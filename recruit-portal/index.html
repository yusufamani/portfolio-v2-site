<script>
const sources = {"v1": "<div class=\"title-card\">\n  <h1 class=\"with-mark\"><img src=\"images/linkedin-mark.png?v=1cb36f74\" alt=\"LinkedIn\">Recruit Portal</h1>\n  <p class=\"lede\">Designing the system that runs Engineering hiring at LinkedIn.</p>\n</div>\n\n<div class=\"hero\">\n  <img src=\"images/rp-hero-laptop.png?v=63e50fa2\" data-zoom=\"images/rp-hero-laptop.png?v=63e50fa2\" alt=\"Recruit Portal shown on a laptop: a left navigation for Interviews, Candidates, Scheduling and Decide; a search field above eight filters; and a table where each row shows the candidate, requisition, interview step, step action, status, age, recruiter, and the single action that moves that candidate forward\">\n</div>\n\n<div class=\"factbar\">\n  <div class=\"fact\"><span class=\"k\">Role</span><span class=\"v\">UX/Product Design (sole)</span></div>\n  <div class=\"fact\"><span class=\"k\">Timeline</span><span class=\"v\">Oct 2021 \u2013 Aug 2024 \u00b7 3 years</span></div>\n  <div class=\"fact\"><span class=\"k\">Users</span><span class=\"v\"><span class=\"tip\" tabindex=\"0\"><span class=\"tip-t\">~15k\u201325k</span><i class=\"tip-i\">i</i><span class=\"tip-b\"><b>Best estimate</b>: all-time provisioned users across all Recruit Portal roles. TA org ~1.5\u20132k, hiring managers ~3\u20135k, interviewers ~10\u201315k, plus churn over several years.</span></span></span></div>\n</div>\n\n## Overview\n\nI was the **sole designer on LinkedIn's internal ATS for Engineering hiring for three years.** I started with contextual inquiry, then designed in priority order: search and filter, a scalable information architecture, and a homepage built around one actionable task list. The last and largest phase was the end-to-end flow that **consolidated LinkedIn's two separate ATSs into one**: seven personas, two candidate tracks, and every handoff and edge case in between. The VP of Engineering Recruiting approved it. **It shipped**, the legacy tool was sunset the same day, and thousands of people now use it across every role in the hiring process.\n\n## The Context\n\n<p class=\"punch\">Hiring the right people is the highest-stakes thing a company does.</p>\n\nThe **applicant tracking system**, the ATS, is where that happens. Every company needs one.\n\nMost buy one off the shelf. **LinkedIn built its own for Engineering**, because the way we hire engineers doesn't fit anyone else's template.\n\n### An ATS is a complex application\n\n> **Complex application**: \"any application supporting broad, unstructured goals or nonlinear workflows.\" Complex apps typically serve highly trained users in specialized domains, require handoff across multiple roles and tools, and carry high cost when tasks go wrong.\n>\n> [Nielsen Norman Group](https://www.nngroup.com/articles/complex-application-design-framework/)\n\nSeven roles live inside it: none using it the same way, each entering at a different point, doing one job, and handing off.\n\n<div class=\"roles\">\n  <span class=\"role\"><span class=\"e\">\ud83d\udd0d</span> Sourcers</span>\n  <span class=\"role\"><span class=\"e\">\ud83c\udfaf</span> Recruiters</span>\n  <span class=\"role\"><span class=\"e\">\ud83d\udcc5</span> Schedulers</span>\n  <span class=\"role\"><span class=\"e\">\ud83d\udcac</span> Interviewers</span>\n  <span class=\"role\"><span class=\"e\">\ud83d\udc54</span> Hiring Managers</span>\n  <span class=\"role\"><span class=\"e\">\u2696\ufe0f</span> Review Council</span>\n  <span class=\"role\"><span class=\"e\">\u2699\ufe0f</span> TA Ops</span>\n</div>\n\n<div class=\"flow\">\n  <div class=\"step\"><span class=\"n\">01</span><span class=\"t\">Initial contact</span></div>\n  <div class=\"step\"><span class=\"n\">02</span><span class=\"t\">Resume review</span></div>\n  <div class=\"step\"><span class=\"n\">03</span><span class=\"t\">Interviews</span><span class=\"sub\">Recruiter \u00b7 Technical \u00b7 Onsite</span></div>\n  <div class=\"step\"><span class=\"n\">04</span><span class=\"t\">Decision</span></div>\n  <div class=\"step\"><span class=\"n\">05</span><span class=\"t\">Offer</span></div>\n</div>\n\n## The Problem\n\n### What I walked into\n\nLinkedIn's internal ATS was built by engineers. **It got the job done. It was also painful to use.**\n\nYears of one-off features, each built on top of the last and bandaged together. Every addition made the system a little more complex, and a little harder to understand.\n\n<p class=\"punch sm\">A Frankenstein UX.</p>\n\n> **The tool had never been formally evaluated from a UX perspective, until I arrived.**\n\n<img src=\"images/rp-legacy-tool.png?v=cdb5f9f9\" alt=\"The legacy tool's home screen: three stacked candidate queues (assign, schedule, assigned to schedulers), each with its own repeated filter row, column set, and per-row action controls\" width=\"840\">\n\n<div class=\"diag\">\n  <div class=\"eqs\">\n    <div class=\"eq\"><span class=\"ic\">\ud83d\ude15</span>Low readability = <span class=\"up\">\u2191</span> interaction cost</div>\n    <div class=\"eq\"><span class=\"ic\">\ud83d\ude15</span>Low meaning = <span class=\"up\">\u2191</span> cognitive load</div>\n  </div>\n  <div class=\"says\">\n    <p>\u201cwhat is all this data telling me?\u201d</p>\n    <p>\u201cwhat should I do?\u201d</p>\n  </div>\n</div>\n\n\n## Three years, one product\n\n<div class=\"tl\">\n\n  <div class=\"tl-act\">\n    <div class=\"tl-items\">\n      <div class=\"tl-item\"><span class=\"n hl-red\">\ud83d\udcda Contextual inquiry</span><span class=\"d\">Oct 2021 \u2013 Jan 2022 \u00b7 3 months</span></div>\n      <div class=\"tl-item\"><span class=\"n hl-orange\">\ud83c\udf05 Vision alignment</span><span class=\"d\">Jan 2022 \u2013 Mar 2022 \u00b7 3 months</span></div>\n      <div class=\"tl-item\"><span class=\"n hl-slate\">\ud83d\udd0e Search &amp; filter</span><span class=\"d\">Feb 2022 \u2013 Jun 2022 \u00b7 4 months</span></div>\n      <div class=\"tl-item\"><span class=\"n hl-amber\">\ud83c\udfdb\ufe0f Information architecture</span><span class=\"d\">Oct 2022 \u2013 Nov 2022 \u00b7 2 months</span></div>\n      <div class=\"tl-item\"><span class=\"n hl-green\">\ud83c\udfe1 Homepage</span><span class=\"d\">Jul 2022 \u2013 Dec 2022 \u00b7 5 months</span></div>\n      <div class=\"tl-item\"><span class=\"n hl-blue\">\ud83c\udf0a E2E Flow</span><span class=\"d\">Dec 2022 \u2013 Aug 2024 \u00b7 1 year 4 months</span></div>\n    </div>\n  </div>\n\n</div>\n\nEverything I did on this project falls into three categories:\n\n<div class=\"methods\">\n  <div class=\"method\"><span class=\"e\">\ud83e\uddea</span><span class=\"t\">UX Research</span><span class=\"s\">Learning: either firsthand via users, or desk research</span></div>\n  <div class=\"method\"><span class=\"e\">\ud83c\udfa8</span><span class=\"t\">UX Design</span><span class=\"s\">Solutioning, prototyping, design</span></div>\n  <div class=\"method\"><span class=\"e\">\ud83d\uddfa\ufe0f</span><span class=\"t\">UX Alignment</span><span class=\"s\">Presenting, strategy, handoff</span></div>\n</div>\n\n## \ud83d\udcda Contextual inquiry\n\n<div class=\"phead\">\n  <span class=\"chip chip-research\">Research</span>\n  <span class=\"when\">October 2021 \u2013 January 2022 \u00b7 3 months</span>\n</div>\n\n<p class=\"what\">First-hand qualitative research into who the users are, how they work, where their current flows break down, and where the product could go next.</p>\n\n<p class=\"mlabel\">UX methods</p>\n\n<ul class=\"mlist\">\n  <li><span>\ud83e\uddea</span><span><span class=\"t\">Desk research:</span> <span class=\"s\">product discovery</span></span></li>\n  <li><span>\ud83e\uddea</span><span><span class=\"t\">User interviews:</span> <span class=\"s\">personas</span></span></li>\n  <li><span>\ud83e\uddea</span><span><span class=\"t\">User interviews:</span> <span class=\"s\">Smart Recruiters</span></span></li>\n  <li><span>\ud83e\uddea</span><span><span class=\"t\">User interviews:</span> <span class=\"s\">search, filter &amp; communication</span></span></li>\n  <li><span>\ud83e\uddea</span><span><span class=\"t\">User interviews:</span> <span class=\"s\">dashboards</span></span></li>\n  <li><span>\ud83e\uddea</span><span><span class=\"t\">Competitive usability evaluation</span></span></li>\n</ul>\n\n<details class=\"det\">\n<summary>See method details</summary>\n\n<div class=\"studies\">\n\n  <div class=\"study\">\n    <div class=\"study-txt\">\n      <p class=\"st\">\ud83e\uddea Desk research: product discovery</p>\n      <p class=\"sd\">October 2021</p>\n      <p>A product discovery is the first step any UX practitioner has to complete: getting a baseline understanding of the product, the personas, the user flows, and the wider app ecosystem.</p>\n    </div>\n    <div class=\"study-img\"><img data-zoom=\"images/rp-zoom-desk-research.png?v=6675a6e9\" src=\"images/rp-study-desk-research.png?v=8e1c8d17\" alt=\"User flow diagram mapping the full hiring process: headcount manager, hiring manager, recruiter, candidate, sourcer, coordinator, interviewers, HR ops and TA team, and how each role's actions hand off to the next\"></div>\n  </div>\n\n  <div class=\"study\">\n    <div class=\"study-txt\">\n      <p class=\"st\">\ud83e\uddea User interviews: personas</p>\n      <p class=\"sd\">November 2021</p>\n      <p>I conducted interviews with each user type: Recruiter, Scheduler, Inbound Sourcer, and Hiring Manager.</p>\n      <p>Each session meant observing the user complete common tasks, discussing how the tool could be improved, and identifying pain-points. I then synthesized every insight by user, regrouped them by topic, and distilled them into a summary.</p>\n    </div>\n    <div class=\"study-img\"><img data-zoom=\"images/rp-zoom-personas.png?v=ade7a90f\" src=\"images/rp-study-personas.png?v=36dbf162\" alt=\"Affinity synthesis board: key insights first grouped by user type, then regrouped by topic (system design, search for near misses, search and filter, communication, reporting, limited functionality), then distilled into a summary\"></div>\n  </div>\n\n  <div class=\"study\">\n    <div class=\"study-txt\">\n      <p class=\"st\">\ud83e\uddea User interviews: Smart Recruiters</p>\n      <p class=\"sd\">November 2021</p>\n      <p>I conducted 2 user interviews (one ENG Recruiter, one Non-ENG Recruiter) to learn how the Smart Recruiters ATS worked for the people using it.</p>\n    </div>\n    <div class=\"study-img\"><img src=\"images/rp-study-smart-recruiters.png?v=f8c1f301\" alt=\"Title slide: User Interviews, Smart Recruiters\"></div>\n  </div>\n\n  <div class=\"study\">\n    <div class=\"study-txt\">\n      <p class=\"st\">\ud83e\uddea User interviews: search, filter &amp; communication</p>\n      <p class=\"sd\">December 2021</p>\n      <p>I conducted user interviews with Recruiters focused on:</p>\n      <ul>\n        <li>Search and filter</li>\n        <li>Communication</li>\n      </ul>\n      <p>For each pain-point I captured the supporting quotes alongside a proposed solution.</p>\n    </div>\n    <div class=\"study-img\"><img data-zoom=\"images/rp-zoom-search-filter.png?v=4ca7c328\" src=\"images/rp-study-search-filter.png?v=ea359e20\" alt=\"Deep-dive synthesis: three pain-points (difficult to share information, cumbersome communication workflow, lack of templates), each paired with a proposed solution and the supporting quotes from the session\"></div>\n  </div>\n\n  <div class=\"study\">\n    <div class=\"study-txt\">\n      <p class=\"st\">\ud83e\uddea User interviews: dashboards</p>\n      <p class=\"sd\">December 2021</p>\n      <p>I conducted user interviews with each user type focused on:</p>\n      <ul>\n        <li>Usability of the current dashboards</li>\n        <li>External trackers people kept for candidates and tasks</li>\n        <li>Opportunities for improved or new dashboards</li>\n      </ul>\n      <p>Each participant ran through the same structure (goal, walkthrough, notes, data) and every session converged on one shared set of key insights.</p>\n    </div>\n    <div class=\"study-img\"><img data-zoom=\"images/rp-zoom-dashboards.png?v=d79c6c1e\" src=\"images/rp-study-dashboards.png?v=3034e1e4\" alt=\"Dashboards synthesis board: four participant tracks run through the same session structure, each ending in per-session key insights that converge into one combined set\"></div>\n  </div>\n\n  <div class=\"study\">\n    <div class=\"study-txt\">\n      <p class=\"st\">\ud83e\uddea Competitive usability evaluation</p>\n      <p class=\"sd\">January 2022</p>\n      <p>We examined our own tool, Smart Recruiters, and Monday.com: looking at how each engages its customers and solves their needs, then running a high-level evaluation of the experience.</p>\n      <p>We compared each product on:</p>\n      <ul>\n        <li>Usability heuristics</li>\n        <li>Functionality &amp; features</li>\n        <li>Patterns &amp; workflows</li>\n        <li>UI design</li>\n      </ul>\n    </div>\n    <div class=\"study-img\"><img src=\"images/rp-study-competitive.png?v=1e240ec6\" alt=\"Cover: Competitive Usability Evaluation\"></div>\n  </div>\n\n</div>\n\n</details>\n\n<p class=\"mlabel\">UX findings</p>\n\n<ul class=\"takeaways\">\n  <li><b>Good candidates were unfindable.</b> Search, filter, and sort were too weak to re-engage past \u201cnear-miss\u201d candidates, and results lacked the context to tell people apart.</li>\n  <li><b>Nobody could see the pipeline.</b> A cluttered home screen with no comprehensive view, and no way to answer <em>\u201chow is this requisition performing?\u201d</em></li>\n  <li><b>Work leaked out of the product.</b> No bulk actions, no candidate messaging, no templates, so recruiters ran the real process in Outlook, Excel, and Word, and leaned on TA Ops for whatever the tool couldn't do.</li>\n  <li><b>The people at the edges were cut out.</b> Candidates were never told when they'd been rejected. Hiring managers wanted to prioritize and reject, but the system didn't support it.</li>\n</ul>\n\n<details class=\"det\">\n<summary>See all 19 findings</summary>\n\n<div class=\"findings\">\n\n  <div class=\"fgroup\">\n    <p class=\"h\">System &amp; process limitations</p>\n    <ul>\n      <li>Users struggle with juggling multiple systems.</li>\n      <li>No bulk actions: users rely on TA Ops for certain tasks.</li>\n      <li>Hiring managers want to be more involved, rejecting and prioritizing candidates themselves.</li>\n    </ul>\n  </div>\n\n  <div class=\"fgroup\">\n    <p class=\"h\">Search &amp; filter</p>\n    <ul>\n      <li>Users want to re-engage past \u201cnear-miss\u201d candidates but can't: search isn't capable enough.</li>\n      <li>Search, filter, and sort all need to be more useful.</li>\n      <li>Results lack the context needed to tell candidates apart.</li>\n    </ul>\n  </div>\n\n  <div class=\"fgroup\">\n    <p class=\"h\">Communication</p>\n    <ul>\n      <li>Candidates are never informed when they're rejected.</li>\n      <li>No way to contact candidates inside the tool, so users fall back on Outlook for email, Excel for tracking, and Word for templates.</li>\n    </ul>\n  </div>\n\n  <div class=\"fgroup\">\n    <p class=\"h\">Home screen</p>\n    <ul>\n      <li>Cluttered, unhelpful, and missing any comprehensive view.</li>\n    </ul>\n  </div>\n\n  <div class=\"fgroup\">\n    <p class=\"h\">Requisition health</p>\n    <ul>\n      <li>Users need insight into how a requisition is doing: <em>\u201chow is the pipeline performing?\u201d</em></li>\n      <li>They want a breakdown of how many candidates sit in each stage.</li>\n    </ul>\n  </div>\n\n</div>\n\n<div class=\"fgroup wide\">\n  <p class=\"h\">Competitors: what they do better than us</p>\n  <ul>\n    <li>Internal messaging for recruiting teams</li>\n    <li>External messaging with candidates</li>\n    <li>Communication templates</li>\n    <li>Flexible dashboards with multiple views</li>\n    <li>Advanced filters for more useful queries</li>\n    <li>Todos, tasks, and reminders</li>\n    <li>Requisition health for pipeline visibility</li>\n  </ul>\n</div>\n\n<div class=\"fgroup wide\">\n  <p class=\"h\">Us: what we do better than competitors</p>\n  <ul>\n    <li>Complex scheduling: interview modules and interviewer pools</li>\n  </ul>\n</div>\n\n</details>\n\n<p class=\"mlabel\">UX decision</p>\n\n<div class=\"decision\">\n  <p><b>Evidence-based direction.</b> The research gave me two things: the areas worth focusing on, and the design objectives to structure them around. Both carried straight into the next phase.</p>\n</div>\n\n## \ud83c\udf05 Vision alignment\n\n<div class=\"phead\">\n  <span class=\"chip chip-design\">Design</span>\n  <span class=\"chip chip-align\">Alignment</span>\n  <span class=\"when\">January 2022 \u2013 March 2022 \u00b7 3 months</span>\n</div>\n\n<p class=\"what\">After learning about users and discovering the big impact opportunities to improve the product, I set out to create designs to align cross-functional teams on the \u201cfuture vision\u201d application.</p>\n\n<p class=\"mlabel\">UX methods</p>\n\n<ul class=\"mlist one\">\n  <li><span>\ud83c\udfa8</span><span><span class=\"t\">Design:</span> <span class=\"s\">\u201cnext-generation\u201d version of the tool</span></span></li>\n  <li><span>\ud83d\uddfa\ufe0f</span><span><span class=\"t\">Alignment:</span> <span class=\"s\">design showcase w/ PM, ENG manager, UX</span></span></li>\n  <li><span>\ud83d\uddfa\ufe0f</span><span><span class=\"t\">Alignment:</span> <span class=\"s\">design showcase w/ engineering team</span></span></li>\n</ul>\n\n<details class=\"det\">\n<summary>See method details</summary>\n\n<div class=\"studies\">\n\n  <div class=\"study\">\n    <div class=\"study-txt\">\n      <p class=\"st\">\ud83c\udfa8 Design: \u201cnext-generation\u201d version of the tool</p>\n      <p class=\"sd\">January 2022</p>\n      <p>Designed features:</p>\n      <ul>\n        <li>Requisition health</li>\n        <li>Sourcing past candidates</li>\n        <li>Dashboards</li>\n        <li>Data visualizations</li>\n        <li>Collaboration</li>\n        <li>\u201cNice to haves\u201d: reminders, inline actions, bulk actions</li>\n      </ul>\n    </div>\n    <div class=\"study-img\"><img data-zoom=\"images/rp-zoom-nextgen-mockups.png?v=2efeccdd\" src=\"images/rp-study-nextgen-mockups.png?v=4582eed0\" alt=\"Figma board of the next-generation mockups, grouped into use-cases, context, requisitions, candidates, and other concepts\"></div>\n  </div>\n\n  <div class=\"study\">\n    <div class=\"study-txt\">\n      <p class=\"st\">\ud83d\uddfa\ufe0f Alignment: design showcase w/ PM, ENG manager, UX</p>\n      <p class=\"sd\">January 25, 2022</p>\n      <p>Conducted a design showcase with the purpose of aligning cross-functional teams on one unified vision for the tool, and for the future of LinkedIn applicant tracking, evaluation, and hiring.</p>\n    </div>\n    <div class=\"study-img\"><img data-zoom=\"images/rp-zoom-showcase-pm-eng.png?v=f3ee1a9d\" src=\"images/rp-study-showcase-pm-eng.png?v=23f4c69f\" alt=\"Figma board of the design showcase deck: context, timeline, issues, strategy, then a demo section per feature\"></div>\n  </div>\n\n  <div class=\"study\">\n    <div class=\"study-txt\">\n      <p class=\"st\">\ud83d\uddfa\ufe0f Alignment: design showcase w/ engineering team</p>\n      <p class=\"sd\">March 8, 2022</p>\n      <p>Socialized the new concepts and features to our engineering team. The energy in the session was excited and enthusiastic about the direction we were moving in.</p>\n    </div>\n    <div class=\"study-img\"><img src=\"images/rp-study-showcase-engteam.png?v=edf26133\" alt=\"Figma board of the engineering-team showcase deck, walked through feature by feature\"></div>\n  </div>\n\n</div>\n\n</details>\n\n<p class=\"mlabel\">UX features</p>\n<p class=\"fnote\"><b>On fidelity:</b> deliberately mid-fidelity concept mocks, for aligning teams on direction rather than specifying UI.</p>\n\n\n<div class=\"carousel\">\n<div class=\"car-track\">\n\n<div class=\"car-slide\">\n<img data-zoom=\"images/rp-zoom-req-health.png?v=4f42513a\" src=\"images/rp-feat-req-health.png?v=5763b2e2\" alt=\"Requisition health. An expanded requisition row showing a count of active candidates at each stage: resume review, RPS, TPS, onsite interview, offer, hire\">\n<p class=\"car-cap\"><b>Requisition health</b></p>\n<p class=\"car-prob\"><b>\u26a0\ufe0f Problem:</b> users had no view of how a requisition was performing, so they built external trackers.</p>\n<p class=\"car-learn\"><b>\ud83d\udca1 Solution:</b> count the people active at each stage. More in the early stages means a healthier requisition.</p>\n<p class=\"car-win\"><b>\u2705 Win:</b> an at-a-glance read on any requisition, inside the tool.</p>\n<p class=\"car-q\">\u201cWhere are the bottlenecks for fulfilling this requisition?\u201d (Hiring Manager, Recruiter, or Sourcer)</p>\n</div>\n\n<div class=\"car-slide\">\n<img data-zoom=\"images/rp-zoom-source-past.png?v=7aa73757\" src=\"images/rp-feat-source-past.png?v=4277e5a8\" alt=\"Source past candidates. The candidates tab with six active filter chips: requisition, time frame, stage, onsite score, track, and skills, returning past near-miss candidates\">\n<p class=\"car-cap\"><b>Source past candidates</b></p>\n<p class=\"car-prob\"><b>\u26a0\ufe0f Problem:</b> recruiters and sourcers would rather re-engage a past \u201cnear miss\u201d than source a stranger, but there was no way to find them.</p>\n<p class=\"car-learn\"><b>\ud83d\udca1 Solution:</b> search past candidates by resume (title, location, company, skills) <em>and</em> by their history in the tool (past reqs, track, scores, status).</p>\n<p class=\"car-win\"><b>\u2705 Win:</b> the data was already there. Now it's findable.</p>\n<p class=\"car-q\">\u201cI want to find a UX Engineer who declined an offer or almost made it past the onsite with a score between 2.8\u20132.9, about 3\u20135 years ago, from the UI track, with skills in HTML, CSS, JavaScript\u201d (Recruiter)</p>\n</div>\n\n</div>\n<div class=\"car-ctrl\">\n<button class=\"car-btn car-prev\" aria-label=\"Previous\">&lsaquo;</button>\n<div class=\"car-dots\"></div>\n<button class=\"car-btn car-next\" aria-label=\"Next\">&rsaquo;</button>\n</div>\n</div>\n\n<p class=\"mlabel\">UX results</p>\n\n<ul class=\"takeaways\">\n  <li><b>I redesigned the system</b> to include modern UI components, scalable information architecture, enhanced dashboards, and advanced features: search, filter, requisition health.</li>\n  <li><b>UX, Product, and Engineering all aligned</b> on the \u201cnext generation\u201d designs, which illustrated the future state of the tool and set a clear direction for how the product should evolve to satisfy users' needs.</li>\n</ul>\n\n<p class=\"mlabel\">UX decision</p>\n\n<div class=\"decision\">\n  <p><b>Search &amp; filter, first.</b> Based on the conversations with users and the cross-functional team, we identified which feature to prioritize first for development to make the largest UX impact, \ud83d\udd0e search and filter.</p>\n</div>\n\n## \ud83d\udd0e Search & filter\n\n<div class=\"phead\">\n<span class=\"chip chip-research\">Research</span>\n<span class=\"chip chip-design\">Design</span>\n<span class=\"chip chip-align\">Alignment</span>\n<span class=\"when\">February 2022 \u2013 June 2022 \u00b7 4 months</span>\n</div>\n\n<p class=\"what\">Users struggled to find the information they were looking for, including past \u201cnear misses\u201d, due to missing filter criteria and outdated UX interactions.</p>\n\n<p class=\"mlabel\">UX methods</p>\n\n<ul class=\"mlist\">\n  <li><span>\ud83c\udfa8</span><span><span class=\"t\">Design:</span> <span class=\"s\">search and filter</span></span></li>\n  <li><span>\ud83d\uddfa\ufe0f</span><span><span class=\"t\">Alignment:</span> <span class=\"s\">user acceptance testing</span></span></li>\n  <li><span>\ud83e\uddea</span><span><span class=\"t\">Research:</span> <span class=\"s\">card sort</span></span></li>\n  <li><span>\ud83d\uddfa\ufe0f</span><span><span class=\"t\">Alignment:</span> <span class=\"s\">filter strategy</span></span></li>\n  <li><span>\ud83d\uddfa\ufe0f</span><span><span class=\"t\">Alignment:</span> <span class=\"s\">engineering hand-off</span></span></li>\n</ul>\n\n<details class=\"det\">\n<summary>See method details</summary>\n\n<div class=\"studies\">\n\n<div class=\"study\">\n<div class=\"study-txt\">\n<p class=\"st\">\ud83c\udfa8 Design: search and filter</p>\n<p class=\"sd\">February 2022</p>\n<p>Designed an improved dashboard, layout, and overall UI: focused on creating more effective search and filter capabilities.</p>\n</div>\n<div class=\"study-img\"><img data-zoom=\"images/rp-zoom-sf-mockups.png?v=bb157da8\" src=\"images/rp-study-sf-mockups.png?v=d2846e9b\" alt=\"Redesigned requisition dashboard: a cleaner table with search, filter, status pills and per-row actions\"></div>\n</div>\n\n<div class=\"study\">\n<div class=\"study-txt\">\n<p class=\"st\">\ud83d\uddfa\ufe0f Alignment: user acceptance testing</p>\n<p class=\"sd\">March 2022</p>\n<p>The purpose of user acceptance testing (a.k.a. usability testing) is to evaluate the effectiveness of a design with users, and to hear feedback.</p>\n<p>I conducted 5 sessions with Recruiters to gather first impressions and to observe participants completing tasks related to the dashboard, filters, and search.</p>\n<p>Users loved the designs.</p>\n</div>\n<div class=\"study-img\"><img data-zoom=\"images/rp-zoom-sf-uat.png?v=6e20c5b5\" src=\"images/rp-study-sf-uat.png?v=809c679c\" alt=\"Title slide for the user testing session: 'Let's talk about these new designs and hear some feedback'\"></div>\n</div>\n\n<div class=\"study\">\n<div class=\"study-txt\">\n<p class=\"st\">\ud83e\uddea Research: card sort</p>\n<p class=\"sd\">April 2022</p>\n<p>This card sort presented users with a list of filters and had them group the filters by usage. The goal was to understand which filters users reach for most, and which additional filters they need.</p>\n<p>The results were clear:</p>\n<ul>\n  <li>Users mainly use <b>7 filters</b>, which heavily shaped the design</li>\n  <li>Two of those seven, <b>score</b> and <b>track</b>, didn't exist in the tool yet</li>\n</ul>\n</div>\n<div class=\"study-img\"><img data-zoom=\"images/rp-zoom-sf-cardsort.png?v=31ad6801\" src=\"images/rp-study-sf-cardsort.png?v=84faa924\" alt=\"Card sort results: a popular-placements matrix ranking every filter by frequently / sometimes / never used, with the top seven called out and two flagged as not yet existing in the tool\"></div>\n</div>\n\n<div class=\"study\">\n<div class=\"study-txt\">\n<p class=\"st\">\ud83d\uddfa\ufe0f Alignment: filter strategy</p>\n<p class=\"sd\">May 2022</p>\n<ul>\n  <li>Shared the card sort results with Product and Engineering.</li>\n  <li>Discussed how the results would shape the design: surface the most popular filters up front, tuck the rest away into a modal.</li>\n  <li>Discussed the additional filter criteria users wanted, and how engineering could implement those data points.</li>\n</ul>\n</div>\n<div class=\"study-img\"><img data-zoom=\"images/rp-zoom-sf-strategy.png?v=a3397d9b\" src=\"images/rp-study-sf-strategy.png?v=ef53a937\" alt=\"Key insights and design strategy board: card sort findings on the left, then the incremental design proposal walked through screen by screen\"></div>\n</div>\n\n<div class=\"study\">\n<div class=\"study-txt\">\n<p class=\"st\">\ud83d\uddfa\ufe0f Alignment: engineering hand-off</p>\n<p class=\"sd\">June 2022</p>\n<p>Designs were updated based on user feedback and card sort data. I then worked iteratively with the engineering team to polish the mockups and make sure they were ready for development.</p>\n</div>\n<div class=\"study-img\"><img data-zoom=\"images/rp-zoom-sf-handoff.png?v=023d8f85\" src=\"images/rp-study-sf-handoff.png?v=96022f43\" alt=\"engineering hand-off board: candidate filter mockups, requisition filter mockups, search mockups and edge cases, each covering inactive, active and interactive states\"></div>\n</div>\n\n</div>\n\n</details>\n\n<p class=\"mlabel\">UX process</p>\n\n<div class=\"carousel\">\n<div class=\"car-track\">\n\n<div class=\"car-slide\">\n<img data-zoom=\"images/rp-zoom-sf-before.png?v=4a5a5734\" src=\"images/rp-feat-sf-before.png?v=b40a1b5f\" alt=\"The original filter experience: a narrow left rail of ten stacked inputs, radio buttons and checkboxes above a Search button, beside a dense results table\">\n<p class=\"car-cap\"><b>01 \u00b7 Where it started.</b> Ten filters stacked down a narrow left rail. Every one had to be set before hitting <em>Search</em>, nothing showed you what was currently applied, and the controls mixed free-text fields, dropdowns, radios, and checkboxes with no shared logic.</p>\n<p class=\"car-prob\"><b>The problem:</b> hard to manage more than one filter at a time, and the filters users needed most weren't there. Users proposed <b>11 additional filters</b> on top of the 10 that existed.</p>\n</div>\n\n<div class=\"car-slide\">\n<img data-zoom=\"images/rp-zoom-sf-cardsort-results.png?v=2dc37e23\" src=\"images/rp-feat-sf-cardsort.png?v=2033b90f\" alt=\"Card sort results: a popular placements matrix ranking 21 filters by frequently, sometimes and never used, with the top seven bracketed and two of them flagged as not existing in the tool\">\n<p class=\"car-cap\"><b>02 \u00b7 Letting users rank them.</b> I put all 21 filters, the 10 that existed plus the 11 users proposed, into a card sort and had participants group them by how often they'd actually use each one.</p>\n<p class=\"car-learn\"><b>What it told me:</b> seven filters sat clearly above the rest at 80\u201390% frequent use. Two of those seven, <b>score</b> and <b>track</b>, didn't exist in the tool at all. Everything below that line could be tucked away.</p>\n</div>\n\n<div class=\"car-slide\">\n<img data-zoom=\"images/rp-zoom-sf-search-ui.png?v=36492ce7\" src=\"images/rp-feat-sf-search-ui.png?v=d6791daa\" alt=\"The redesigned candidates view. Six filter controls sit across the top: my candidates, requisitions, module score, track, stage, sources, and an all-filters button\">\n<p class=\"car-cap\"><b>03 \u00b7 Surfacing the winners.</b> The six controls across the top are the card sort's answer: including <em>module score</em> and <em>track</em>, the two that didn't exist before. Application state and status folded together into <em>stage</em>.</p>\n<p class=\"car-win\"><b>The win:</b> the filters users actually reach for are one click away, and everything else is tucked behind \u201cAll filters\u201d instead of crowding the page.</p>\n</div>\n\n<div class=\"car-slide\">\n<img data-zoom=\"images/rp-zoom-sf-active-filters.png?v=9884585a\" src=\"images/rp-feat-sf-active-filters.png?v=5de88275\" alt=\"The same view with filters applied: stage and sources highlighted in blue with their values shown, and a count badge of three on the all-filters button\">\n<p class=\"car-cap\"><b>04 \u00b7 Making state visible.</b> Applied filters change state and carry their value in the control itself, and the \u201cAll filters\u201d button carries a count of everything active.</p>\n<p class=\"car-win\"><b>The win:</b> users can always see what's narrowing their results, so a stray filter never quietly hides the candidate they're looking for.</p>\n</div>\n\n<div class=\"car-slide\">\n<div class=\"uishot\">\n<img src=\"images/rp-feat-sf-all-filters.png?v=2739b306\" alt=\"The candidates view with the all-filters modal open over it\">\n<div class=\"modalscroll\"><img data-zoom=\"images/rp-feat-sf-all-filters-full.png?v=481bc96a\" src=\"images/rp-feat-sf-modal-body.png?v=e076b0df\" alt=\"Every filter in the modal: active filters, requisition criteria, candidates criteria, role, past candidate criteria, and resume criteria\"></div>\n</div>\n<p class=\"scrollhint\">Scroll inside the modal to see every filter \u00b7 click to open full size</p>\n<p class=\"car-cap\"><b>05 \u00b7 Tucking away the rest.</b> Everything below the card sort's cut-off lives here, grouped into categories that make sense to a recruiter. Active filters are listed at the top so you can jump straight to whatever you set.</p>\n<p class=\"car-win\"><b>The win:</b> full query power for the recruiter who needs it, without making the default view pay for it.</p>\n</div>\n\n</div>\n<div class=\"car-ctrl\">\n<button class=\"car-btn car-prev\" aria-label=\"Previous\">&lsaquo;</button>\n<div class=\"car-dots\"></div>\n<button class=\"car-btn car-next\" aria-label=\"Next\">&rsaquo;</button>\n</div>\n</div>\n\n<p class=\"mlabel\">UX results</p>\n\n<ul class=\"takeaways\">\n  <li><b>The card sort confirmed which filters are used most</b>, seven of them, and surfaced that two of those seven, score and track, didn't exist in the tool yet.</li>\n  <li><b>User acceptance testing</b>: users approved of the new design direction, including updated navigation, dashboard layout, and search and filter interactions.</li>\n  <li><b>UX, Product, Engineering, and Users aligned</b> on the search and filter features and enhancements. Designs were cross-functionally approved and handed off to the engineering team for development.</li>\n</ul>\n\n## \ud83c\udfdb\ufe0f Information architecture\n\n<div class=\"phead\">\n<span class=\"chip chip-design\">Design</span>\n<span class=\"chip chip-align\">Alignment</span>\n<span class=\"when\">October 2022 \u2013 November 2022 \u00b7 2 months</span>\n</div>\n\n<p class=\"what\">A growing product needed a structure that could hold it. I designed the options, then <b>A/B tested them with engineers and power users.</b></p>\n\n<p class=\"mlabel\">UX methods</p>\n\n<ul class=\"mlist one\">\n  <li><span>\ud83c\udfa8</span><span><span class=\"t\">Design:</span> <span class=\"s\">information architecture mockups</span></span></li>\n  <li><span>\ud83d\uddfa\ufe0f</span><span><span class=\"t\">Alignment:</span> <span class=\"s\">IA feedback &amp; A/B testing w/ eng &amp; power users</span></span></li>\n</ul>\n\n<details class=\"det\">\n<summary>See method details</summary>\n\n<div class=\"studies\">\n\n<div class=\"study\">\n<div class=\"study-txt\">\n<p class=\"st\">\ud83c\udfa8 Design: information architecture mockups</p>\n<p class=\"sd\">October 2022</p>\n<p>Created designs to outline the product's information architecture: how users navigate, how information is presented, the interactions, and the steps to complete tasks. The goal was to make sure the solution would be scalable and sustainable.</p>\n</div>\n<div class=\"study-img\"><img data-zoom=\"images/rp-zoom-hp-ia.png?v=130880fa\" src=\"images/rp-study-hp-ia.png?v=e5a960c5\" alt=\"The information architecture board: context, designs, and A/B testing laid out side by side\"></div>\n</div>\n\n<div class=\"study\">\n<div class=\"study-txt\">\n<p class=\"st\">\ud83d\uddfa\ufe0f Alignment: IA feedback &amp; A/B testing w/ eng &amp; power users</p>\n<p class=\"sd\">November 2022</p>\n<p>Held feedback sessions and A/B testing on multiple design solutions with:</p>\n<ul>\n  <li>Engineers, to discuss technical feasibility trade-offs</li>\n  <li>Power users, to discuss thoughts and perspectives</li>\n</ul>\n</div>\n<div class=\"study-img\"><img data-zoom=\"images/rp-zoom-hp-ia-feedback.png?v=3c8ff34f\" src=\"images/rp-study-hp-ia-feedback.png?v=44f85669\" alt=\"The IA feedback board: early homepage design concepts laid out for a feedback session\"></div>\n</div>\n</div>\n\n</details>\n\n<p class=\"mlabel\">UX process</p>\n\n<div class=\"carousel\">\n<div class=\"car-track\">\n\n<div class=\"car-slide\">\n<img data-zoom=\"images/rp-zoom-nav.png?v=3097c343\" src=\"images/rp-feat-nav.png?v=d701953d\" alt=\"Main navigation options: a side rail shown in collapsed and default states, beside a top navigation bar\">\n<p class=\"car-cap\"><b>01 \u00b7 Where does navigation live?</b> Two options on the table: a <em>side</em> rail that can collapse, or a <em>top</em> bar. Both were built out so the comparison was real rather than theoretical.</p>\n</div>\n\n<div class=\"car-slide\">\n<img data-zoom=\"images/rp-zoom-scale.png?v=16064912\" src=\"images/rp-feat-scale.png?v=1ffe37f3\" alt=\"A two-by-two comparing side and top navigation against few and many nav items\">\n<p class=\"car-cap\"><b>02 \u00b7 Testing each against scale.</b> How many nav items can the solution hold?</p>\n<p class=\"car-learn\"><b>What it told me:</b> top navigation breaks down with many nav items.</p>\n</div>\n\n<div class=\"car-slide\">\n<img data-zoom=\"images/rp-zoom-abfilters.png?v=19724a36\" src=\"images/rp-feat-abfilters.png?v=72f3f4bb\" alt=\"A two-by-two comparing top and side navigation against bar and modal filter styles, with the trade-offs listed alongside\">\n<p class=\"car-cap\"><b>03 \u00b7 Testing filters.</b> Bar or modal, against each navigation option. No clear winner: it had trade-offs.</p>\n<p class=\"car-learn\"><b>The trade-off:</b> <b>speed vs clarity</b>. A bar promotes speed; a modal promotes clarity. And the preference splits by user: <b>power users want speed, new users want clarity</b>.</p>\n</div>\n\n<div class=\"car-slide\">\n<img data-zoom=\"images/rp-zoom-ia-winner.png?v=3b9ee340\" src=\"images/rp-feat-ia-winner.png?v=87b56e68\" alt=\"The chosen architecture: a vertical side navigation with an expandable submenu under My Dashboard, beside a requisitions table with filter pills and an all-filters modal trigger\">\n<p class=\"car-cap\"><b>04 \u00b7 The winner.</b> <b>Side navigation + submenu</b>, with filters in a modal.</p>\n<p class=\"car-learn\"><b>Why:</b> a side rail accommodates a broad range of content: <b>7\u20139+ main nav items</b>. It scales as the product grows, and users can collapse it when they need the space.</p>\n</div>\n\n</div>\n<div class=\"car-ctrl\">\n<button class=\"car-btn car-prev\" aria-label=\"Previous\">&lsaquo;</button>\n<div class=\"car-dots\"></div>\n<button class=\"car-btn car-next\" aria-label=\"Next\">&rsaquo;</button>\n</div>\n</div>\n\n<p class=\"mlabel\">UX results</p>\n\n<ul class=\"takeaways\">\n  <li><b>I designed a scalable information architecture</b> and navigation for a growing product: validated against how many items it would eventually need to hold, not just how it looked at launch.</li>\n  <li><b>The design solution was validated with power users</b> and socialized with engineering teams to ensure technical feasibility.</li>\n</ul>\n\n## \ud83c\udfe1 Homepage\n\n<div class=\"phead\">\n<span class=\"chip chip-research\">Research</span>\n<span class=\"chip chip-design\">Design</span>\n<span class=\"chip chip-align\">Alignment</span>\n<span class=\"when\">July 2022 \u2013 December 2022 \u00b7 5 months</span>\n</div>\n\n<p class=\"what\"><b>Users struggled to figure out what to do and how to do it.</b> They told us:</p>\n\n<div class=\"quotes\">\n<p>\u201cThere is no easy way to track my hiring tasks\u201d</p>\n<p>\u201cIt takes manual effort to pursue updates related to my hiring tasks.\u201d</p>\n</div>\n\nInformation was hard to find and hard to use, **spread across a dozen apps**, with no centralized place to track what needed action.\n\nThe homepage had to become that place: **task management** and an **interview calendar**, so users could **see what to do, and do it.**\n\n<p class=\"mlabel\">UX methods</p>\n\n<ul class=\"mlist\">\n  <li><span>\ud83e\uddea</span><span><span class=\"t\">Research:</span> <span class=\"s\">persona building</span></span></li>\n  <li><span>\ud83e\uddea</span><span><span class=\"t\">Research:</span> <span class=\"s\">Product Discovery Kick-off</span></span></li>\n  <li><span>\ud83e\uddea</span><span><span class=\"t\">Research:</span> <span class=\"s\">feature &amp; functionality planning</span></span></li>\n  <li><span>\ud83d\uddfa\ufe0f</span><span><span class=\"t\">Alignment:</span> <span class=\"s\">design studio</span></span></li>\n  <li><span>\ud83c\udfa8</span><span><span class=\"t\">Design:</span> <span class=\"s\">homepage</span></span></li>\n  <li><span>\ud83d\uddfa\ufe0f</span><span><span class=\"t\">Alignment:</span> <span class=\"s\">user acceptance testing</span></span></li>\n  <li><span>\ud83d\uddfa\ufe0f</span><span><span class=\"t\">Alignment:</span> <span class=\"s\">engineering hand-off</span></span></li>\n</ul>\n\n<details class=\"det\">\n<summary>See method details</summary>\n\n<div class=\"studies\">\n\n<div class=\"study\">\n<div class=\"study-txt\">\n<p class=\"st\">\ud83e\uddea Research: persona building</p>\n<p class=\"sd\">July 2022</p>\n<p>The goal of persona building was to ground ourselves and empathize with our users.</p>\n<p>This activity meant focusing on each of our user types and pinpointing their responsibilities, role, tasks, and pain-points, in order to identify opportunities for UX improvements.</p>\n</div>\n<div class=\"study-img\"><img data-zoom=\"images/rp-zoom-hp-personas.png?v=4c37299e\" src=\"images/rp-study-hp-personas.png?v=fcbf4a94\" alt=\"Persona cards for each user type, mapped to responsibilities and feeding into a shared opportunities board\"></div>\n</div>\n\n<div class=\"study\">\n<div class=\"study-txt\">\n<p class=\"st\">\ud83e\uddea Research: Product Discovery Kick-off</p>\n<p class=\"sd\">August 2022</p>\n<p>Collaboratively worked with Product to define the problem space, problem, user goals, needs, pain-points, the current solution, vision, mission, measurable KPIs, business requirements, and potential opportunities.</p>\n<p>A 32-page document.</p>\n</div>\n<div class=\"study-img\"><img data-zoom=\"images/rp-zoom-hp-pdk.png?v=b57c50a4\" src=\"images/rp-study-hp-pdk.png?v=e63139e7\" alt=\"The Product Discovery Kick-off document: usage guidelines above a problem-space question list\"></div>\n</div>\n\n<div class=\"study\">\n<div class=\"study-txt\">\n<p class=\"st\">\ud83e\uddea Research: feature &amp; functionality planning</p>\n<p class=\"sd\">September 2022</p>\n<p>Deep-dived into contextual inquiry to frame ourselves in the needs of our users from a functionality and feature perspective: user stories, task analysis, jobs-to-be-done, and user flows.</p>\n<img data-zoom=\"images/rp-zoom-hp-planning-flow.png?v=fb8f52b0\" src=\"images/rp-study-hp-planning-flow.png?v=288c87dc\" alt=\"The end-to-end hiring flow mapped left to right, headcount planning through offer acceptance, with the role responsible for each step marked above it\">\n</div>\n<div class=\"study-img\"><img data-zoom=\"images/rp-zoom-hp-planning.png?v=dac30c72\" src=\"images/rp-study-hp-planning.png?v=0ae03799\" alt=\"A wall of user flows mapping features and functionality across roles\"></div>\n</div>\n\n<div class=\"study\">\n<div class=\"study-txt\">\n<p class=\"st\">\ud83d\uddfa\ufe0f Alignment: design studio</p>\n<p class=\"sd\">October 2022</p>\n<p>Brought together the PM, the Engineering Manager, and a power user for a UX design studio: brainstorming, critique, and prioritization. The goal was to address <em>\u201chow might we help users figure out what needs to get done and how to go about it.\u201d</em></p>\n<p>Tangible outcome: a ranked feature list and rough mockups.</p>\n</div>\n<div class=\"study-img\"><img data-zoom=\"images/rp-zoom-hp-studio.png?v=49a6818c\" src=\"images/rp-study-hp-studio.png?v=283b329f\" alt=\"The design studio board: context on the left, numbered activities on the right\"></div>\n</div>\n\n<div class=\"study\">\n<div class=\"study-txt\">\n<p class=\"st\">\ud83c\udfa8 Design: homepage</p>\n<p class=\"sd\">December 2022</p>\n<p>Designed mockups for a new and improved homepage and dashboard experience, focused on task management, helping users know what to do and how to go about it.</p>\n</div>\n<div class=\"study-img\"><img data-zoom=\"images/rp-zoom-hp-mockups.png?v=83a68587\" src=\"images/rp-study-hp-mockups.png?v=9acbab67\" alt=\"A homepage mockup: My Dashboard with a task list beside an interview calendar\"></div>\n</div>\n\n<div class=\"study\">\n<div class=\"study-txt\">\n<p class=\"st\">\ud83d\uddfa\ufe0f Alignment: user acceptance testing</p>\n<p class=\"sd\">December 2022</p>\n<p>Validated design solutions with 3 power users. These sessions consisted of gathering first impressions and observing tasks within the new designs related to the dashboard, filters, and navigation.</p>\n</div>\n<div class=\"study-img\"><img data-zoom=\"images/rp-zoom-hp-uat.png?v=9d3d5471\" src=\"images/rp-study-hp-uat.png?v=4555ff25\" alt=\"The user acceptance testing board: rows of annotated homepage screens, one row per participant\"></div>\n</div>\n\n<div class=\"study\">\n<div class=\"study-txt\">\n<p class=\"st\">\ud83d\uddfa\ufe0f Alignment: engineering hand-off</p>\n<p class=\"sd\">December 2022</p>\n<p>Hand-off mocks covering the homepage, requisitions, and candidates: default views, interactive states, active states, and filter modals for each.</p>\n</div>\n<div class=\"study-img\"><img data-zoom=\"images/rp-zoom-hp-handoff.png?v=071880dc\" src=\"images/rp-study-hp-handoff.png?v=8ff0a295\" alt=\"The engineering hand-off board: homepage, requisitions, and candidates mocks grouped by view\"></div>\n</div>\n</div>\n\n</details>\n\n<p class=\"mlabel\">UX features</p>\n\n<div class=\"carousel\">\n<div class=\"car-track\">\n\n<div class=\"car-slide\">\n<img data-zoom=\"images/rp-zoom-mytasks.png?v=f304c920\" src=\"images/rp-feat-mytasks.png?v=f48f46a5\" alt=\"My Dashboard: a My Tasks list of hiring actions with priority flags and due dates, beside an interview calendar and the day's interview schedule\">\n<p class=\"car-cap\"><b>01 \u00b7 My Tasks = an actionable to-do list.</b> Every hiring action waiting on the user in one place, with the interview calendar alongside it. <b>Slide 02 is a working version you can click through.</b></p>\n</div>\n\n<div class=\"car-slide\">\n<div class=\"proto\" data-proto=\"mytasks\" data-chrome=\"card\" data-hint=\"0\"></div>\n<p class=\"car-cap\"><b>02 \u00b7 Try the task actions.</b> Click a task to expand it, then try <b>Task type</b>, <b>Priority</b>, <b>Sort</b>, or the <b>due date</b> inside an open task.</p>\n</div>\n\n</div>\n<div class=\"car-ctrl\">\n<button class=\"car-btn car-prev\" aria-label=\"Previous\">&lsaquo;</button>\n<div class=\"car-dots\"></div>\n<button class=\"car-btn car-next\" aria-label=\"Next\">&rsaquo;</button>\n</div>\n</div>\n\n<p class=\"mlabel\">UX results</p>\n\n<ul class=\"takeaways\">\n  <li><b>UX and Product's partnership yielded an in-depth understanding</b> of our users, the context in which they work, the pain-points with the current solution, and the opportunity to drastically improve task management.</li>\n  <li><b>The homepage became the centralized place</b>: My Tasks pulls every hiring action into one actionable to-do list instead of a dozen apps.</li>\n  <li><b>The design solution was validated with power users</b> and socialized with engineering teams to ensure technical feasibility.</li>\n</ul>\n\n## \ud83c\udf0a E2E Flow\n\n<div class=\"phead\">\n<span class=\"chip chip-research\">Research</span>\n<span class=\"chip chip-design\">Design</span>\n<span class=\"chip chip-align\">Alignment</span>\n<span class=\"when\">December 2022 \u2013 August 2024 \u00b7 1 year 4 months</span>\n</div>\n\n<p class=\"what\">LinkedIn had <b>two applicant tracking systems</b> (one for Engineering, one for everyone else) with <b>9 redundant features</b> across requisition management, candidate management, scheduling, evaluation, and offer management.</p>\n\n*Dead time.* Hiring at LinkedIn took **57 days**, from application to hire. I set out to find out why.\n\nSo the goal was two things at once:\n\n<ul class=\"takeaways goals\">\n  <li>Consolidate both systems into <b>one ATS</b> with a seamless end-to-end flow.</li>\n  <li><b>Cut the dead time.</b></li>\n</ul>\n\n<p class=\"mlabel\">UX methods</p>\n\n<ul class=\"mlist\">\n  <li><span>\ud83e\uddea</span><span><span class=\"t\">User interviews:</span> <span class=\"s\">why time-to-hire takes so long</span></span></li>\n  <li><span>\ud83e\uddea</span><span><span class=\"t\">User interviews:</span> <span class=\"s\">synthesis &amp; affinity diagram</span></span></li>\n  <li><span>\ud83d\uddfa\ufe0f</span><span><span class=\"t\">Alignment:</span> <span class=\"s\">w/ PM and ENG Manager</span></span></li>\n  <li><span>\ud83e\uddea</span><span><span class=\"t\">Research:</span> <span class=\"s\">Product Discovery Kick-off (PDK)</span></span></li>\n  <li><span>\ud83d\uddfa\ufe0f</span><span><span class=\"t\">Alignment:</span> <span class=\"s\">TPE Demo Day</span></span></li>\n  <li><span>\ud83e\uddea</span><span><span class=\"t\">Research:</span> <span class=\"s\">defining E2E flow</span></span></li>\n  <li><span>\ud83c\udfa8</span><span><span class=\"t\">Design:</span> <span class=\"s\">designing E2E flow</span></span></li>\n  <li><span>\ud83d\uddfa\ufe0f</span><span><span class=\"t\">Alignment:</span> <span class=\"s\">demo feedback w/ the VP of Eng Recruiting</span></span></li>\n  <li><span>\ud83d\uddfa\ufe0f</span><span><span class=\"t\">Alignment:</span> <span class=\"s\">demo feedback w/ leadership</span></span></li>\n  <li><span>\ud83c\udfa8</span><span><span class=\"t\">Design:</span> <span class=\"s\">pre-launch enhancements</span></span></li>\n</ul>\n\n<details class=\"det\">\n<summary>See method details</summary>\n\n<div class=\"studies\">\n\n<div class=\"study\">\n<div class=\"study-txt\">\n<p class=\"st\">\ud83e\uddea User interviews: why time-to-hire takes so long</p>\n<p class=\"sd\">December 2022 \u2013 January 2023</p>\n<p>Conducted 7 user interviews to understand why time to hire takes so long, how we can reduce it, and causes of \u201cdead-time\u201d.</p>\n<p>Interviewed: Recruiter, SR Technical Recruiter, HR Ops Associate, HR Ops Specialist, SR HR Ops Specialist, SR HR Ops Lead, and HR Ops Manager.</p>\n</div>\n<div class=\"study-img\"><img data-zoom=\"images/rp-zoom-e2e-interviews.png?v=08f41faa\" src=\"images/rp-study-e2e-interviews.png?v=7e8fb8cd\" alt=\"\ud83e\uddea User interviews: \u201cwhy does time-to-hire take so long at LinkedIn?\u201d\"></div>\n</div>\n\n<div class=\"study\">\n<div class=\"study-txt\">\n<p class=\"st\">\ud83e\uddea User interviews: synthesis &amp; affinity diagram</p>\n<p class=\"sd\">January 2023</p>\n<p>Conducted a post-interview synthesis and affinity diagram to find common themes and categorize data into buckets.</p>\n</div>\n<div class=\"study-img\"><img data-zoom=\"images/rp-zoom-e2e-affinity.png?v=31ba9120\" src=\"images/rp-study-e2e-synthesis.png?v=d5e4ed6e\" alt=\"\ud83e\uddea User interview data synthesis\"></div>\n</div>\n\n<div class=\"study\">\n<div class=\"study-txt\">\n<p class=\"st\">\ud83d\uddfa\ufe0f Alignment: w/ PM and ENG Manager</p>\n<p class=\"sd\">February 2023</p>\n<p>Formed key-insights on the leading causes of \u201cdead-time\u201d during the recruitment, evaluation, and onboarding phases.</p>\n<p>Insights included issues related to: scheduling, manual data verification, manual work, lack of automation, absence of trackers, and other areas.</p>\n</div>\n<div class=\"study-img\"><img data-zoom=\"images/rp-zoom-e2e-insights.png?v=eed9b4e1\" src=\"images/rp-study-e2e-insights.png?v=10acbd9c\" alt=\"\ud83d\uddfa\ufe0f Insights alignment w/ UX, PM &amp; ENG Manager\"></div>\n</div>\n\n<div class=\"study\">\n<div class=\"study-txt\">\n<p class=\"st\">\ud83e\uddea Research: Product Discovery Kick-off (PDK)</p>\n<p class=\"sd\">March 2023</p>\n<p>Collaboratively worked with the Product Manager to shift our focus to scheduling, evaluation, and decision-making requirements. (72-page document)</p>\n<p>Documentation included: summary, goals, team, personas, resources, definitions, interviewer logic, applicant profile, scheduling, dashboards, assessment, review council, and product requirements.</p>\n</div>\n<div class=\"study-img\"><img data-zoom=\"images/rp-zoom-e2e-pdk.png?v=75b613b2\" src=\"images/rp-study-e2e-pdk.png?v=3fc77216\" alt=\"\ud83e\uddea Product discovery kick-off (PDK)\"></div>\n</div>\n\n<div class=\"study\">\n<div class=\"study-txt\">\n<p class=\"st\">\ud83d\uddfa\ufe0f Alignment: TPE Demo Day</p>\n<p class=\"sd\">April 2023</p>\n<p>Product presented during TPE Demo Day highlighting: productivity at LinkedIn, time to hire (57 days), the problem, task management, and reducing time to hire.</p>\n<p>I presented designs that give a high-level overview of our long-term vision, while simultaneously illustrating short-term wins.</p>\n</div>\n<div class=\"study-img\"><img data-zoom=\"images/rp-zoom-e2e-tpe.png?v=dbfeca1a\" src=\"images/rp-study-e2e-tpe.png?v=55c97de7\" alt=\"\ud83d\uddfa\ufe0f TPE demo day\"></div>\n</div>\n\n<div class=\"study\">\n<div class=\"study-txt\">\n<p class=\"st\">\ud83e\uddea Research: defining E2E flow</p>\n<p class=\"sd\">May 2023 \u2013 August 2023 \u00b7 3 months</p>\n<p>Defined revamped user flows connecting the two ATSs for schedule, evaluate, and decision flows.</p>\n<p>Creating flows was a group effort, involving the Product Manager, Program Manager, and key power users.</p>\n</div>\n<div class=\"study-img\"><img data-zoom=\"images/rp-zoom-e2e-defining.png?v=fa8a29bb\" src=\"images/rp-study-e2e-defining.png?v=80cea55f\" alt=\"\ud83e\uddea Defining end-to-end flow\"></div>\n</div>\n\n<div class=\"study\">\n<div class=\"study-txt\">\n<p class=\"st\">\ud83c\udfa8 Design: designing E2E flow</p>\n<p class=\"sd\">September 2023 \u2013 October 2023 \u00b7 2 months</p>\n<p>I designed the end-to-end user experience between both ATSs, Smart Recruiters and Recruit Portal.</p>\n<p>Designs outlined flows including:</p>\n<ul>\n  <li>Engineering candidate scheduling and evaluation</li>\n  <li>Non-engineering candidate scheduling and evaluation</li>\n  <li>Scheduling &amp; evaluation edge-cases and micro-interactions</li>\n  <li>Review council: creation, schedule, vote, decide</li>\n  <li>Review council edge cases</li>\n  <li>Dashboards</li>\n  <li>Clearly defined 7 user personas, access, and actions</li>\n</ul>\n</div>\n<div class=\"study-img\"><img data-zoom=\"images/rp-zoom-e2e-designing.png?v=fa6f11d6\" src=\"images/rp-study-e2e-designing.png?v=42a1fa94\" alt=\"\ud83c\udfa8 Designing end-to-end user flow\"></div>\n</div>\n\n<div class=\"study\">\n<div class=\"study-txt\">\n<p class=\"st\">\ud83d\uddfa\ufe0f Alignment: demo feedback w/ the VP of Engineering Recruiting</p>\n<p class=\"sd\">October 2023</p>\n<p>\u201cMet and exceeded expectations, matched the way the flow works in my mind\u201d (VP of Engineering Recruiting)</p>\n<p>\u201cI think it is a good experience for our TA Teams and candidates\u201d (VP of Engineering Recruiting)</p>\n</div>\n<div class=\"study-img\"><img data-zoom=\"images/rp-zoom-e2e-cj.png?v=1ac9119f\" src=\"images/rp-study-e2e-cj.png?v=24b637c2\" alt=\"Persona card: Ned, a sales candidate, on the manual schedule flow where the interview team is configured per requisition\"></div>\n</div>\n\n<div class=\"study\">\n<div class=\"study-txt\">\n<p class=\"st\">\ud83d\uddfa\ufe0f Alignment: demo feedback w/ leadership</p>\n<p class=\"sd\">November 2023</p>\n<p>Strong and positive feedback from the SteerCo: a cross-functional leadership group that meets on a regular cadence to review progress, make key decisions, and unblock workstreams.</p>\n</div>\n<div class=\"study-img\"><img data-zoom=\"images/rp-zoom-e2e-steerco.png?v=d07707ba\" src=\"images/rp-study-e2e-steerco.png?v=d388d23e\" alt=\"Persona card: Lenny, an engineering candidate, on the pre-populated schedule flow based on interviewer pools and matching criteria\"></div>\n</div>\n\n<div class=\"study\">\n<div class=\"study-txt\">\n<p class=\"st\">\ud83c\udfa8 Design: pre-launch enhancements</p>\n<p class=\"sd\">April 2024 \u2013 August 2024 \u00b7 4 months</p>\n<p>Created and collaborated on designs with stakeholder sign-off for the following features:</p>\n<ul>\n  <li>Scheduling: additional fields</li>\n  <li>Scheduling: recommended interviewers logic (AND, OR)</li>\n  <li>Schedule duration</li>\n  <li>Schedule: interviewer drop-down metadata</li>\n  <li>Scheduling: bypass availability</li>\n  <li>Scheduling: add additional interview slots</li>\n  <li>Scheduling: multiple evaluation rounds</li>\n  <li>Dashboard: candidate dashboard</li>\n  <li>Dashboard: scheduled interviews dashboard</li>\n  <li>Dashboard: interviewer dashboard</li>\n  <li>Dashboard: save filters</li>\n  <li>Dashboard: sorting data</li>\n  <li>Assessment: mass disposition</li>\n  <li>Assessment: HackerRank link</li>\n  <li>Candidate: timezone presets and preferences</li>\n</ul>\n</div>\n<div class=\"study-img\">\n<img src=\"images/rp-study-e2e-pl-schedule.png?v=9100ef14\" alt=\"Cover: Schedule\">\n<img src=\"images/rp-study-e2e-pl-dashboard.png?v=4db6262a\" alt=\"Cover: Dashboard\">\n<img src=\"images/rp-study-e2e-pl-enhance.png?v=ce926749\" alt=\"Cover: Post-launch Enhancements\">\n</div>\n</div>\n</div>\n\n</details>\n\n<p class=\"mlabel\">UX findings</p>\n\nSeven interviews across Recruiting and HR Ops. Three causes of dead time stood out, and became what I designed around.\n\n<ul class=\"takeaways\">\n  <li><b>Scheduling was the biggest contributor.</b> Recruiters asked candidates for availability by hand, waited, then relayed it on. Interviewers were slow to accept, and when one declined, the recruiter often didn't see it. Every decline meant a re-schedule.</li>\n  <li><b>Everyone had built their own tracker.</b> Candidates, silver medalists, declined offers, schedules, offers, onboarding paperwork: all tracked outside the system, because the system didn't track them.</li>\n  <li><b>Nothing moved on its own.</b> A recruiter running ten requisitions had to remember to advance every candidate after every interview. Generating an offer needed a hand-made ticket, and one missed email cost days.</li>\n</ul>\n\n<p class=\"mlabel\">UX features</p>\n\nI designed the end-to-end experience across both systems: **7 personas**, two candidate tracks, and every state in between. One board held all of it.\n\n<ul class=\"takeaways\">\n  <li><b>The core flows.</b> Schedule and evaluate, for Engineering and non-Engineering candidates, across Recruiter, Scheduler, and Interviewer.</li>\n  <li><b>The review council.</b> Interviewers, hiring manager, and recruiter meet to review feedback and vote on the hire, so I designed creating one, scheduling it, voting, and deciding.</li>\n  <li><b>The edge cases.</b> Cancel an interview, reschedule, replace a single interviewer, a no-show, not enough availability.</li>\n  <li><b>The micro-interactions.</b> Needs scheduling, awaiting availability, upcoming interviews, assigning a coordinator, adding multiple interviewers.</li>\n  <li><b>The dashboards.</b> Refined, then tailored to what each persona actually needs to see.</li>\n</ul>\n\n<div class=\"shot\">\n<img data-zoom=\"images/rp-zoom-e2e-designing.png?v=fa6f11d6\" src=\"images/rp-study-e2e-designing.png?v=42a1fa94\" alt=\"The end-to-end flow board: 7 personas across schedule, evaluate and decide, with the Simpsons cast standing in for each role\">\n<p class=\"car-win\"><b>\ud83d\udca1 The design decision:</b> seven personas moving through one system is hard to follow when everyone is \u201cRecruiter A\u201d and \u201cHiring Manager B\u201d. I cast the <b>Simpsons</b> as the personas instead. You could trace any character across the whole board and always know who was doing what. It became how the team talked about the flow.</p>\n</div>\n\n<div class=\"shot\">\n<img data-zoom=\"images/rp-zoom-e2e-lenny.png?v=6ca51f40\" src=\"images/rp-feat-e2e-lenny.png?v=46dcdb81\" alt=\"One candidate's schedule and evaluation flow: RPS and onsite rows, with the work handing off between Recruiter, Scheduler and Interviewer\">\n<p class=\"car-cap\"><b>One flow, end to end.</b> Lenny's path through RPS and onsite, and the handoffs it depends on: <b>Recruiter \u2192 Scheduler \u2192 Recruiter \u2192 Interviewer \u2192 Recruiter</b>. Every other flow, edge case, and micro-interaction on the board is a variation on this spine.</p>\n</div>\n\n<p class=\"mlabel\">UX results</p>\n\n<ul class=\"takeaways\">\n  <li><b>The VP of Engineering Recruiting approved it.</b> Leadership approved it the following month.</li>\n  <li><b>The persona device became the team's shared language.</b> Casting the Simpsons made a seven-role system legible to people who don't read flow diagrams for a living, and it's how the team referred to the flow afterwards.</li>\n</ul>\n\n> *\u201cMet and exceeded expectations, matched the way the flow works in my mind.\u201d*\n> *\u201cI think it is a good experience for our TA Teams and candidates.\u201d*\n> **VP of Engineering Recruiting**, October 2023\n\n## What happened\n\n<p class=\"punch sm\">It shipped! Recruit Portal launched, and the legacy tool was sunset the same day.</p>\n\n<ul class=\"takeaways\">\n  <li><b>One system instead of two.</b> Recruit Portal now integrates directly with the non-Engineering ATS and with Workday, the consolidation the end-to-end flow was designed around.</li>\n  <li><b>Scheduling runs inside the tool.</b> Interviewers set the days and times they're available, so the mis-scheduling that used to trigger re-scheduling loops doesn't start the same way.</li>\n  <li><b>Evaluation happens in one place.</b> Interviewers enter feedback and ratings directly in the tool, locked once submitted. Managers assign interviewer skills and modules, so loops stay consistent.</li>\n  <li><b>Thousands of users, across every persona</b>: recruiters, schedulers, interviewers, hiring managers, review councils, and TA Ops.</li>\n</ul>\n\n## What I learned\n\n<ul class=\"takeaways\">\n  <li><b>Stakeholders are co-designers, not approvers.</b> When approval sits with people who haven't been in the work, reviews turn into debates about assumptions instead of evidence, and sign-off slips, taking the timeline with it. The fix isn't a better review. It's bringing the right senior partners <em>into</em> the working sessions. The cost is a few hours a week of senior calendar; the return is design that ships with alignment already baked in.</li>\n</ul>\n\nI hosted working sessions where I updated the mocks live while stakeholders gave feedback, instead of taking notes away and returning with revisions.\n\n> *\u201cI very much liked the ad-hoc updates to the mocks while stakeholders were dishing out feedback. We can use sessions like this to validate ideas and iterate quickly.\u201d*\n> **Product Manager**, September 2023\n\n<ul class=\"takeaways cont\">\n  <li><b>Design's job doesn't end at hand-off.</b> I treated engineering as a design partner, not a recipient. The mocks were the blueprint: implementation is where the real decisions kept getting made. So I stayed in the room: pairing on trade-offs, reworking mocks during engineering review, checking builds against design intent. It's the most consistent feedback I get from engineers, and it isn't adjacent to design. It <em>is</em> design.</li>\n  <li><b>A standing power-user network beats a one-off study.</b> The same handful of recruiters and schedulers gave me a reliable read on every decision for three years: faster than commissioning research each time, and more honest than asking a stakeholder.</li>\n  <li><b>Enterprise design rewards endurance.</b> Recruit Portal didn't get good in a sprint. It got good over three years: research compounding, power-user relationships deepening, the design language stabilizing, the engineering partnership becoming muscle memory. My most senior contribution wasn't any single deliverable. It was being the constant that let everything else compound.</li>\n</ul>\n"};

const content = document.getElementById('content');
const fallbackTitle = "case-study";

function show(v) {
  if (!sources[v]) v = 'v1';
  content.innerHTML = marked.parse(sources[v]);
  wrapSections();
  syncCounts();
  document.querySelectorAll('.vtoggle button').forEach(function (b) {
    b.classList.toggle('on', b.dataset.v === v);
    b.setAttribute('aria-selected', b.dataset.v === v ? 'true' : 'false');
  });
  /* title is set statically at build time */
  if (sources.v2) {
    history.replaceState(null, '', location.pathname + (v === 'v1' ? '#v1' : ''));
  }
  initCarousels();
  initProtos();
  initArchive();
  buildRail();
  scrollToHash();
}

let railObserver = null;

// "See all N findings" is recounted from the list itself, so the number can
// never drift when items are added or removed. The markdown keeps a correct
// number as the fallback if this never runs.
function syncCounts() {
  content.querySelectorAll('details summary').forEach(function (s) {
    const m = s.textContent.match(/^(\s*See all\s+)(\d+)(\s+.+)$/);
    if (!m) return;
    const n = s.parentElement.querySelectorAll('li').length;
    if (n > 0 && String(n) !== m[2]) s.textContent = m[1] + n + m[3];
  });
}

function buildRail() {  document.querySelectorAll('.rail').forEach(function (r) { r.remove(); });
  if (railObserver) { railObserver.disconnect(); railObserver = null; }

  const secs = [...content.querySelectorAll('.sec')];
  if (secs.length < 4) return;

  const rail = document.createElement('nav');
  rail.className = 'rail';
  rail.setAttribute('aria-label', 'Sections');
  let html = '<p class="rail-h">On this page</p><ol>';
  secs.forEach(function (sec, i) {
    const h = sec.querySelector('h2');
    const id = 'sec-' + (h.textContent.toLowerCase().replace(/[^a-z0-9\s-]/g, '').trim().replace(/\s+/g, '-') || i);
    sec.id = id;
    html += '<li><a href="#' + id + '">' + h.textContent.trim() + '</a></li>';
  });
  rail.innerHTML = html + '</ol>';
  document.body.appendChild(rail);

  const links = [...rail.querySelectorAll('a')];
  links.forEach(function (a, i) {
    a.addEventListener('click', function (e) {
      e.preventDefault();
      secs[i].scrollIntoView({ behavior: 'smooth', block: 'start' });
      history.replaceState(null, '', location.pathname + location.hash);
    });
  });

  // with sticky h2s the pinned heading is ground truth, so the rail switches
  // exactly when a section reaches the top rather than at a reading line
  function sync() {
    const line = 1;
    let active = 0;
    secs.forEach(function (sec, i) {
      if (sec.getBoundingClientRect().top <= line) active = i;
    });
    // a short final section can never cross the line, so own the page bottom
    const left = document.documentElement.scrollHeight - innerHeight - scrollY;
    if (left <= 2) active = secs.length - 1;
    links.forEach(function (a, i) { a.classList.toggle('on', i === active); });
  }
  let tick = false;
  addEventListener('scroll', function () {
    if (tick) return;
    tick = true;
    requestAnimationFrame(function () { sync(); tick = false; });
  }, { passive: true });
  addEventListener('resize', sync, { passive: true });
  sync();
}

function wrapSections() {
  let cur = null;
  [...content.children].forEach(function (el) {
    if (el.tagName === 'H2') {
      cur = document.createElement('section');
      cur.className = 'sec';
      content.insertBefore(cur, el);
      cur.appendChild(el);
    } else if (cur) {
      cur.appendChild(el);
    }
  });
}

function initCarousels() {
  document.querySelectorAll('.carousel').forEach(function (c) {
    const track = c.querySelector('.car-track');
    const slides = c.querySelectorAll('.car-slide');
    const dots = c.querySelector('.car-dots');
    const prev = c.querySelector('.car-prev');
    const next = c.querySelector('.car-next');
    if (!track || !slides.length || !dots) return;

    dots.innerHTML = '';
    slides.forEach(function (s, i) {
      const b = document.createElement('button');
      b.className = 'car-dot' + (i === 0 ? ' on' : '');
      b.setAttribute('aria-label', 'Go to slide ' + (i + 1));
      b.addEventListener('click', function () { go(i); });
      dots.appendChild(b);
    });

    function idx() { return Math.round(track.scrollLeft / track.clientWidth); }
    function go(i) { track.scrollTo({ left: i * track.clientWidth, behavior: 'smooth' }); }
    function sync() {
      const i = idx();
      dots.querySelectorAll('.car-dot').forEach(function (d, j) { d.classList.toggle('on', j === i); });
      if (prev) prev.disabled = i <= 0;
      if (next) next.disabled = i >= slides.length - 1;
    }
    if (prev) prev.addEventListener('click', function () { go(idx() - 1); });
    if (next) next.addEventListener('click', function () { go(idx() + 1); });
    track.addEventListener('scroll', sync, { passive: true });
    sync();
  });
}

// The archive gate is a tidiness feature, not security. Every case study's
// markdown is already in the page source and each one is still reachable by its
// own URL. This keeps the home page to three pieces without deleting the rest.
// Markdown is rendered client-side, so the browser's native jump to "#about"
// fires before that element exists. Re-run it once the markup is in place.
function scrollToHash() {
  const h = location.hash;
  if (!h || h.length < 2 || h === '#v1') return;
  let t = null;
  try { t = document.querySelector(h); } catch (e) { return; }
  if (t) t.scrollIntoView();
}

function initArchive() {
  content.querySelectorAll('.archive').forEach(function (a) {
    const btn = a.querySelector('.arch-btn');
    const input = a.querySelector('.arch-in');
    const go = a.querySelector('.arch-go');
    const ic = a.querySelector('.arch-ic');
    if (!btn || !input || !go) return;
    const want = Number(a.dataset.k || 0);

    function hash(s) {
      let x = 5381;
      s = String(s).trim().toLowerCase();
      for (let i = 0; i < s.length; i++) x = ((x << 5) + x + s.charCodeAt(i)) >>> 0;
      return x;
    }
    function remember(v) {
      try { v ? sessionStorage.setItem('archOpen', '1') : sessionStorage.removeItem('archOpen'); } catch (e) {}
    }
    function openUp() {
      a.classList.add('open');
      a.classList.remove('asking', 'bad');
      if (ic) ic.textContent = '\u{1F513}';
      btn.setAttribute('aria-expanded', 'true');
    }
    function shut() {
      a.classList.remove('open', 'asking', 'bad');
      if (ic) ic.textContent = '\u{1F512}';
      btn.setAttribute('aria-expanded', 'false');
    }

    let was = false;
    try { was = sessionStorage.getItem('archOpen') === '1'; } catch (e) {}
    if (was) openUp();

    btn.addEventListener('click', function () {
      if (a.classList.contains('open')) { shut(); remember(false); return; }
      a.classList.toggle('asking');
      a.classList.remove('bad');
      if (a.classList.contains('asking')) input.focus();
    });

    function tryKey() {
      if (hash(input.value) === want) {
        input.value = '';
        remember(true);
        openUp();
      } else {
        a.classList.remove('bad');
        void a.offsetWidth;
        a.classList.add('bad');
        input.select();
      }
    }
    go.addEventListener('click', tryKey);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); tryKey(); }
      else a.classList.remove('bad');
    });
  });
}

function initProtos() {
  document.querySelectorAll('.proto[data-proto]').forEach(function (host) {
    if (host.dataset.built) return;
    host.dataset.built = '1';

    const rows = PROTO_ROWS.map(function (r) { return Object.assign({}, r); });
    const state = { types: [], sort: null, priority: false, open: -1, pop: null };

    const card =
      '<div class="proto-card">' +
        '<div class="proto-head">' +
          '<span class="proto-title">My Tasks</span>' +
          '<button class="proto-ctl" data-pop="type">' + PROTO_IC.filter + 'Task type</button>' +
          '<button class="proto-ctl" data-pop="prio">' + PROTO_IC.flag + 'Priority</button>' +
          '<button class="proto-ctl" data-pop="sort">' + PROTO_IC.sort + 'Sort</button>' +
        '</div>' +
        '<ul class="proto-rows"></ul>' +
        '<div class="proto-foot"><span>Rows per page: 10</span></div>' +
      '</div>';
    host.innerHTML = (host.dataset.chrome === 'card' ? card : protoChrome(card)) +
      (host.dataset.hint === '0' ? '' :
        '<p class="proto-hint">Live rebuild — <b>click a task</b> to expand it, then try <b>Task type</b>, <b>Priority</b>, <b>Sort</b>, or the <b>due date</b> inside an open task.</p>');

    const head = host.querySelector('.proto-head');
    const list = host.querySelector('.proto-rows');

    function visible() {
      let v = rows.map(function (r, i) { return { r: r, i: i }; });
      if (state.types.length) v = v.filter(function (o) { return state.types.indexOf(o.r.k) > -1; });
      if (state.priority) v = v.filter(function (o) { return o.r.f; });
      if (state.sort) {
        const dir = state.sort === 'old' ? 1 : -1;
        v.sort(function (a, b) { return (a.i - b.i) * dir; });
      }
      return v;
    }

    function draw() {
      const v = visible();
      if (!v.length) { list.innerHTML = '<li class="proto-empty">No tasks match these filters.</li>'; return; }
      list.innerHTML = v.map(function (o) {
        const r = o.r, open = state.open === o.i;
        return '<li class="proto-row' + (open ? ' open' : '') + '" data-i="' + o.i + '">' +
          '<div class="proto-top">' +
            '<span class="proto-txt">' + r.t.replace(/<a>/g, '<a href="#" onclick="return false">') + '</span>' +
            '<span class="proto-flag' + (r.f ? ' on' : '') + '">' + PROTO_IC.flag + '</span>' +
            (open ? '<button class="proto-datechip" data-pop="date">' + r.d + ' <span class="x">×</span></button>'
                  : '<span class="proto-date">' + r.d + '</span>') +
            '<span class="proto-chev">' + PROTO_IC.chev + '</span>' +
          '</div>' +
          '<div class="proto-body">' +
            '<div class="proto-meta">' +
              '<div><div class="k">Hiring Manager</div>Lisa Johnson</div>' +
              '<div><div class="k">Age</div>27 days</div>' +
            '</div>' +
            '<div class="proto-note">' +
              '<div class="nt"><div class="k">Note</div>Please complete this task before Monday of next week!</div>' +
              '<div class="proto-act">' +
                '<button class="proto-ibtn" data-act="del" title="Delete task">' + PROTO_IC.trash + '</button>' +
                '<button class="proto-ibtn' + (r.f ? ' on' : '') + '" data-act="flag" title="Prioritize task">' + PROTO_IC.flag + '</button>' +
                '<button class="proto-approve" data-act="done">Approve</button>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</li>';
      }).join('');
    }

    function closePop() {
      const p = host.querySelector('.proto-pop');
      if (p) p.remove();
      state.pop = null;
    }

    function openPop(btn, kind) {
      closePop();
      state.pop = kind;
      const p = document.createElement('div');
      p.className = 'proto-pop' + (kind === 'date' ? ' dates' : '');
      if (kind === 'type') {
        p.innerHTML = '<h4>Task type filters</h4>' + PROTO_TYPES.map(function (t) {
          return '<label class="proto-opt"><input type="checkbox" data-k="' + t.k + '"' +
                 (state.types.indexOf(t.k) > -1 ? ' checked' : '') + '>' + t.l + '</label>';
        }).join('');
      } else if (kind === 'sort') {
        p.innerHTML = '<h4>Sort tasks</h4>' +
          '<label class="proto-opt"><input type="checkbox" data-s="new"' + (state.sort === 'new' ? ' checked' : '') + '>New to old</label>' +
          '<label class="proto-opt"><input type="checkbox" data-s="old"' + (state.sort === 'old' ? ' checked' : '') + '>Old to new</label>';
      } else {
        p.innerHTML = PROTO_DATES.map(function (d) {
          return '<div class="proto-opt" data-d="' + d + '">' + d + '</div>';
        }).join('');
      }
      const anchor = kind === 'date' ? btn.closest('.proto-row') : head;
      anchor.style.position = 'relative';
      anchor.appendChild(p);
      const off = btn.getBoundingClientRect().left - anchor.getBoundingClientRect().left;
      p.style.left = Math.max(4, Math.min(off, anchor.clientWidth - 220)) + 'px';
      if (kind === 'date') p.style.top = (btn.offsetTop + btn.offsetHeight + 2) + 'px';
    }

    host.addEventListener('click', function (e) {
      const ctl = e.target.closest('[data-pop]');
      if (ctl) {
        e.stopPropagation();
        const kind = ctl.dataset.pop;
        if (kind === 'prio') {
          closePop();
          state.priority = !state.priority;
          ctl.classList.toggle('on', state.priority);
          draw();
          return;
        }
        if (state.pop === kind) { closePop(); return; }
        openPop(ctl, kind);
        return;
      }

      const opt = e.target.closest('.proto-opt');
      if (opt) {
        e.stopPropagation();
        if (opt.dataset.d) {
          const row = opt.closest('.proto-row');
          rows[+row.dataset.i].d = opt.dataset.d;
          closePop(); draw();
          return;
        }
        const box = opt.querySelector('input');
        if (!box) return;
        setTimeout(function () {
          if (box.dataset.k) {
            const k = box.dataset.k, at = state.types.indexOf(k);
            if (box.checked && at < 0) state.types.push(k);
            if (!box.checked && at > -1) state.types.splice(at, 1);
            host.querySelector('[data-pop="type"]').classList.toggle('on', state.types.length > 0);
          } else {
            state.sort = box.checked ? box.dataset.s : null;
            opt.parentNode.querySelectorAll('input').forEach(function (o) { if (o !== box) o.checked = false; });
            host.querySelector('[data-pop="sort"]').classList.toggle('on', !!state.sort);
          }
          draw();
        }, 0);
        return;
      }

      const act = e.target.closest('[data-act]');
      if (act) {
        e.stopPropagation();
        const i = +act.closest('.proto-row').dataset.i;
        if (act.dataset.act === 'flag') rows[i].f = rows[i].f ? 0 : 1;
        else { rows.splice(i, 1); state.open = -1; }
        closePop(); draw();
        return;
      }

      const top = e.target.closest('.proto-top');
      if (top) {
        const i = +top.closest('.proto-row').dataset.i;
        state.open = state.open === i ? -1 : i;
        closePop(); draw();
      }
    });

    document.addEventListener('click', function (e) {
      if (state.pop && !host.contains(e.target)) closePop();
    });

    draw();
  });
}

/* Presentation decks. Arrow keys, space, click and swipe page through the
   slides; the URL hash keeps a slide shareable and survives a reload, which
   matters if a browser restarts mid-interview. */
(function () {
  const deck = document.querySelector('.deck');
  if (!deck) return;
  const slides = Array.from(deck.querySelectorAll('.slide'));
  if (!slides.length) return;

  const bar = document.createElement('div');
  bar.className = 'deck-ui'; bar.innerHTML = '<i></i>';
  const no = document.createElement('div');
  no.className = 'deck-no';
  document.body.appendChild(bar); document.body.appendChild(no);
  const fill = bar.querySelector('i');

  let i = Math.max(0, Math.min(slides.length - 1,
    (parseInt(location.hash.replace('#s', ''), 10) || 1) - 1));

  function go(n) {
    i = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach(function (s, k) { s.classList.toggle('on', k === i); });
    no.textContent = (i + 1) + ' / ' + slides.length;
    fill.style.width = ((i + 1) / slides.length * 100) + '%';
    history.replaceState(null, '', location.pathname + '#s' + (i + 1));
  }
  go(i);

  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(i + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(i - 1); }
    else if (e.key === 'Home') { e.preventDefault(); go(0); }
    else if (e.key === 'End') { e.preventDefault(); go(slides.length - 1); }
    else if (e.key === 'f') { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
  });
  /* Click the right two-thirds to advance, the left third to go back, so a
     mis-click during a presentation is recoverable rather than disruptive. */
  deck.addEventListener('click', function (e) {
    go(e.clientX < window.innerWidth / 3 ? i - 1 : i + 1);
  });
  let x0 = null;
  deck.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  deck.addEventListener('touchend', function (e) {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 40) go(dx < 0 ? i + 1 : i - 1);
    x0 = null;
  });
})();

/* Mobile menu. Below 760px the links live behind the toggle and open as a
   full-screen panel; above it this code never fires because the button is
   display:none and cannot be clicked. */
(function () {
  const btn = document.querySelector('.navtoggle');
  const nav = document.getElementById('sitenav');
  if (!btn || !nav) return;
  function setOpen(open) {
    document.body.classList.toggle('nav-open', open);
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    btn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
  }
  btn.addEventListener('click', function () {
    setOpen(!document.body.classList.contains('nav-open'));
  });
  /* Any link closes it, including the in-page About/Contact anchors, which
     would otherwise scroll behind a panel that is still covering the screen. */
  nav.addEventListener('click', function (e) {
    if (e.target.closest('a')) setOpen(false);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') setOpen(false);
  });
  /* Rotating to landscape can cross the breakpoint while the panel is open,
     which would leave the scroll lock on a desktop-width layout. */
  window.addEventListener('resize', function () {
    if (window.innerWidth > 760) setOpen(false);
  });
})();
