<style>
:root {
  --fg: #1a1a1a;
  --muted: #6b6b6b;
  --rule: #e6e6e6;
  --link: #0a66c2;
  --bg: #ffffff;
  --code-bg: #f6f8fa;
  --quote: #f9f9fb;
  --quote-bar: #0a66c2;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif; line-height: 1.6; }
.shell { max-width: 760px; margin: 0 auto; padding: 0 24px 96px; }
/* The header bar spans the full viewport so its background covers the
   full-bleed hero behind it when pinned; the nav inside stays aligned to the
   same 1072px column as everything else. Spacing is margin, not padding, so
   that when the bar is sticky only the nav pins rather than ~146px of
   surrounding whitespace. */
.sitehead-wrap { margin: 36px 0 42px; padding: 12px 24px; }
.sitehead { max-width: 1072px; margin: 0 auto; }
/* Sticky everywhere except pages with h2 section headings, which are themselves
   `position: sticky; top: 0` and would collide. See has_sticky_sections(). */
body.sticky-nav .sitehead-wrap { position: sticky; top: 0; z-index: 50; background: var(--bg); }
/* Hero greeting. Sentence case, so the tracking goes slightly negative;
   the +.6px it had was there to open up all-caps. */
.intro-greeting { font-size: 42px; font-weight: 800; line-height: 1.1; letter-spacing: -.5px; margin: 0 0 18px; padding: 0; border: none; }
.navrow { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 18px 34px; }
/* Wordmark: the hero treatment at nav scale. Text rather than an image so it
   stays crisp at any density and remains selectable and translatable. */
.wordmark { display: inline-flex; align-items: center; gap: 10px;
  font-size: 20px; font-weight: 800; letter-spacing: .4px; text-transform: uppercase;
  color: var(--fg); text-decoration: none; line-height: 1; white-space: nowrap; margin-right: 8px; }
/* The planet lifted from the hero render, mirrored so its ring tilts the other
   way. Decorative only: the wordmark text carries the meaning. */
.wm-planet { width: 31px; height: auto; display: block; flex: none; }
.wordmark:hover { text-decoration: none; color: var(--fg); opacity: .72; }
.tabs { display: flex; flex-wrap: wrap; gap: 34px; margin: 0; border-bottom: none; }
.tabs a { padding: 0; margin: 0; font-size: 15px; font-weight: 500; letter-spacing: 1.1px; text-transform: uppercase; color: #aaa; border-bottom: none; text-decoration: none; transition: color .14s ease; }
.tabs a:hover { text-decoration: none; color: var(--fg); }
.tabs a.active { color: var(--fg); border-bottom: none; }
.crumbs { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
.crumbs a { color: var(--muted); }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { line-height: 1.25; }
h1 { font-size: 32px; margin: 0 0 8px; }
/* Section rule bleeds 24px into the gutters so a section break reads louder than a paragraph break.
   Sticky: each h2 pins only within its own .sec wrapper, so headings never stack at top:0. */
h2 { font-size: 24px; letter-spacing: -0.35px; margin: 52px -24px 0; padding: 19px 24px 15px;
  position: sticky; top: 0; z-index: 5; background: var(--bg); }
h2::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: var(--rule); }
.sec:first-of-type h2 { margin-top: 34px; padding-top: 0; }
.sec:first-of-type h2::before { display: none; }
h3 { font-size: 17px; margin: 28px 0 8px; }
h3 .sub { font-weight: 400; }
h4 { font-size: 15px; margin: 20px 0 6px; }
p { margin: 12px 0; }
em { color: var(--muted); }
hr { border: none; border-top: 1px solid var(--rule); margin: 32px 0; }
ul, ol { padding-left: 22px; }
li { margin: 4px 0; }
blockquote {
  background: var(--quote);
  border-left: 3px solid var(--quote-bar);
  margin: 16px 0;
  padding: 12px 18px;
  border-radius: 0 6px 6px 0;
  color: #2a2a2a;
}
blockquote p { margin: 6px 0; }
table { border-collapse: collapse; width: 100%; margin: 16px 0; font-size: 14px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { background: #fafafa; font-weight: 600; }
table.tiers { table-layout: fixed; }
table.tiers col:nth-child(1) { width: 22%; }
table.tiers col:nth-child(2) { width: 78%; }
table.tiers td ul { margin: 0; padding-left: 1.1em; }
table.tiers td li { margin: 0 0 2px; }
table.tiers td li:last-child { margin-bottom: 0; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; background: var(--code-bg); padding: 2px 5px; border-radius: 3px; }
pre code { display: block; padding: 12px; overflow-x: auto; }
img { max-width: 100%; height: auto; border-radius: 4px; margin: 12px 0; }
.idx ul { list-style: none; padding: 0; }
.idx li { padding: 12px 0; border-bottom: 1px solid var(--rule); }
.idx li:last-child { border: none; }
/* Version toggle (AI original vs human refinement) */
.vtoggle { display: inline-flex; border: 1px solid var(--rule); border-radius: 9px; padding: 3px; gap: 3px; margin: 0 0 26px; background: #f6f7f8; }
.vtoggle button { font: inherit; font-size: 13px; font-weight: 600; padding: 7px 15px; border: none; background: none; border-radius: 6px; color: var(--muted); cursor: pointer; transition: all .12s ease; }
.vtoggle button:hover { color: var(--fg); }
.vtoggle button.on { background: var(--bg); color: var(--link); box-shadow: 0 1px 3px rgba(0,0,0,.10); }
/* Title card — section 1 holds the opening view, so section 2 needs a scroll */
.title-card { min-height: 26vh; display: flex; flex-direction: column; justify-content: center; }
.title-card h1 { font-size: 46px; margin: 0 0 18px; letter-spacing: -0.6px; }
h1.with-mark { display: flex; align-items: center; gap: 15px; }
h1.with-mark img { width: 40px; height: 40px; border-radius: 8px; flex: 0 0 auto; }
.lede { font-size: 20px; line-height: 1.5; color: var(--muted); margin: 0; max-width: 640px; }
/* Hero bleeds to the shell edges, matching the section rule, so it reads as the page's anchor image.
   The laptop mockup carries its own frame and shadow, so .hero adds no chrome of its own. */
.hero { margin: 24px -24px 34px; }
.hero img { display: block; width: 100%; margin: 0; cursor: zoom-in; }
/* Fact bar — role / timeline */
.factbar { display: flex; flex-wrap: wrap; gap: 40px; margin: 0 0 34px; padding: 20px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.fact { flex: 1 1 0; min-width: 150px; display: flex; flex-direction: column; gap: 5px; }
.fact .k { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
.fact .v { font-size: 15px; color: var(--fg); }
/* borderless variant — for use inside a section, where rules read as breaks */
.factbar.bare { border: none; padding: 0; margin: 18px 0 22px; }
/* Hover/focus tooltip — used for the estimated user count */
.tip { position: relative; cursor: help; }
.tip .tip-t { border-bottom: 1px dotted #9aa3ab; }
.tip .tip-i { display: inline-block; width: 13px; height: 13px; line-height: 12px; margin-left: 5px;
  border: 1px solid #9aa3ab; border-radius: 50%; font-size: 9.5px; font-weight: 700; font-style: normal;
  font-family: Georgia, serif; text-align: center; color: #8d969e; vertical-align: 1px; }
.tip:hover .tip-i, .tip:focus .tip-i, .tip:focus-within .tip-i { border-color: var(--fg); color: var(--fg); }
.tip .tip-b { visibility: hidden; opacity: 0; position: absolute; left: 0; top: calc(100% + 8px); z-index: 40;
  width: 300px; background: #22282d; color: #eef1f3; font-size: 12.5px; line-height: 1.5; font-weight: 400;
  text-transform: none; letter-spacing: 0; padding: 10px 13px; border-radius: 7px;
  box-shadow: 0 6px 20px rgba(0,0,0,.22); transition: opacity .14s ease; }
.tip .tip-b::before { content: ''; position: absolute; left: 14px; top: -5px; width: 10px; height: 10px; background: #22282d; transform: rotate(45deg); }
.tip:hover .tip-b, .tip:focus .tip-b, .tip:focus-within .tip-b { visibility: visible; opacity: 1; }
/* last fact sits at the right edge — anchor its tooltip right so it can't overflow */
.fact:last-child .tip-b { left: auto; right: 0; }
.fact:last-child .tip-b::before { left: auto; right: 14px; }
/* Below ~560px the fact bar wraps and the last fact jumps to the left margin, so a
   right-anchored 300px tooltip hangs off the left edge. Anchor left instead. */
@media (max-width: 560px) {
  .tip .tip-b, .fact:last-child .tip-b { left: 0; right: auto; width: min(300px, calc(100vw - 48px)); }
  .tip .tip-b::before, .fact:last-child .tip-b::before { left: 14px; right: auto; }
}
/* no label — the value stands alone */
.fact.nolabel .k { display: none; }
/* Phase chip — signals the focus of each section */
.chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 5px; letter-spacing: .1px; margin: -4px 0 16px; }
.chip-research { background: #e6f5e6; color: #1a6b37; }
.chip-design { background: #fdeaea; color: #a32a2e; }
.chip-align { background: #e7f0fa; color: #0a4e96; }
/* Phase header framework — title · [chip + timeline on one line] · what */
.phead { display: flex; align-items: center; flex-wrap: wrap; gap: 13px; margin: 0 0 11px; }
.phead .chip { margin: 0; }
.phead .when { font-size: 13.5px; color: var(--muted); }
.what { font-size: 15.5px; line-height: 1.55; color: #3a3a3a; margin: 0; }
.todo { color: #a8a8a8; font-style: italic; }
/* Punch line — short declarative statement that carries a section */
.punch { font-size: 19px; line-height: 1.45; font-weight: 600; color: var(--fg); margin: 26px 0 18px; letter-spacing: -0.2px; }
.punch.sm { font-size: 17px; letter-spacing: 0; }
.qt { font-style: italic; color: #8a8a8a; }
.sidenote { font-size: 15px; line-height: 1.62; color: #8a8a8a; border-left: 2px solid var(--rule); padding-left: 15px; margin: 20px 0 0; }
.sidenote b { color: var(--fg); font-weight: 600; }
/* Role chips */
.roles { display: flex; flex-wrap: wrap; gap: 9px; margin: 18px 0 8px; }
.role { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--rule); border-radius: 999px; padding: 8px 16px 8px 13px; font-size: 14px; background: #fff; }
.role .e { font-size: 22px; line-height: 1; }
.role .d { color: var(--muted); font-size: 13px; }
/* Process flow */
.flow { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0 10px; }
.flow .step { flex: 1 1 120px; background: #f6f8fa; border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; }
.flow .step .n { display: block; font-size: 11px; font-weight: 700; color: var(--link); letter-spacing: .5px; margin-bottom: 5px; }
.flow .step .t { display: block; font-size: 13.5px; font-weight: 600; line-height: 1.35; }
.flow .step .sub { display: block; font-size: 12px; font-weight: 400; color: var(--muted); margin-top: 6px; line-height: 1.5; }
/* .icons — emoji markers instead of 01/02 numbers */
.flow.icons .step .n { font-size: 21px; line-height: 1; margin-bottom: 8px; }
/* Diagnostic block — symptom = cost equations beside the user's unspoken questions */
.diag { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 32px; margin: -8px 0 6px; }
.diag .eq:first-child, .diag .says p:first-child { margin-top: 0; }
.diag .eqs { flex: 1.3 1 370px; }
.diag .eq { font-size: 16px; font-weight: 600; margin: 14px 0; letter-spacing: -0.1px; white-space: nowrap; }
.diag .eq .ic { font-size: 15px; margin-right: 9px; }
.diag .eq .up { color: #e5484d; font-weight: 700; }
.diag .says { flex: 1 1 240px; margin: 0; }
.diag .says p { font-size: 16px; font-style: italic; color: #5a5a5a; margin: 14px 0; }
.imgnote { font-size: 12.5px; color: #a0a0a0; margin: 8px 0 0; }
/* Roadmap timeline — the two-act table of contents */
.tl { margin: 22px 0 4px; }
.tl-act { margin: 0 0 38px; }
.tl-act:last-child { margin-bottom: 8px; }
.tl-act .act-h { font-size: 20px; font-weight: 700; margin: 0 0 3px; letter-spacing: -0.3px; }
.tl-act .act-m { font-size: 13px; color: var(--muted); margin: 0 0 16px; }
.tl-items { position: relative; margin: 0 0 0 7px; }
.tl-item { position: relative; padding: 0 0 22px 30px; border-left: 2px solid #1a1a1a; }
.tl-item::before { content: ''; position: absolute; left: -2px; top: 10px; width: 15px; height: 2px; background: #1a1a1a; }
/* line starts at the first tick and stops at the last one */
.tl-item:first-child { border-left-color: transparent; }
.tl-item:first-child::after { content: ''; position: absolute; left: -2px; top: 10px; bottom: 0; width: 2px; background: #1a1a1a; }
.tl-item:last-child { padding-bottom: 0; border-left-color: transparent; }
.tl-item:last-child::after { content: ''; position: absolute; left: -2px; top: 0; height: 12px; width: 2px; background: #1a1a1a; }
.tl-item .n { font-size: 15.5px; font-weight: 600; padding: 3px 9px; border-radius: 5px; }
.tl-item .d { display: block; font-size: 13px; color: var(--muted); margin-top: 6px; padding-left: 9px; }
.tl-foot { font-size: 12.5px; color: #a0a0a0; margin: 14px 0 0 37px; }
.tl + p { margin-top: 40px; }
/* UX method cards */
.methods { display: flex; flex-wrap: wrap; gap: 12px; margin: 20px 0 10px; }
.method { flex: 1 1 195px; border: 1px solid var(--rule); border-radius: 10px; padding: 15px 18px 16px; background: #fff; }
.method .e { font-size: 16px; margin-right: 8px; }
.method .t { font-size: 15.5px; font-weight: 700; }
.method .s { display: block; font-size: 13px; color: var(--muted); line-height: 1.5; margin-top: 7px; }
/* Research question list */
.qs { list-style: none; padding: 0; margin: 14px 0 4px; }
.qs li { font-size: 17.5px; color: #4a4a4a; line-height: 1.45; margin: 10px 0; padding-left: 24px; position: relative; }
.qs li::before { content: '—'; position: absolute; left: 0; color: #c4c4c4; }
/* Method list — compact two-column activity inventory */
.mlabel { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 24px 0 12px; }
.mlist { list-style: none; padding: 0; margin: 0; column-count: 2; column-gap: 18px; counter-reset: ml; }
.mlist.one { column-count: 1; }
.mlist li { display: flex; gap: 5px; font-size: 13px; line-height: 1.5; margin: 0 0 10px; break-inside: avoid; }
.mlist li::before { counter-increment: ml; content: counter(ml, decimal-leading-zero); flex: 0 0 auto; font-size: 10.5px; font-weight: 700; color: #c2c2c2; letter-spacing: 0; padding-top: 2px; }
.mlist .t { font-weight: 600; }
.mlist .s { color: var(--muted); }
/* Finding groups — column flow so short cards don't leave dead space */
.findings { column-count: 2; column-gap: 12px; margin: 16px 0 16px; }
.fgroup { border: 1px solid var(--rule); border-radius: 10px; padding: 14px 18px 15px; background: #fff; break-inside: avoid; margin: 0 0 12px; }
.fgroup .h { font-size: 13.5px; font-weight: 700; margin: 0 0 9px; }
.fgroup ul { margin: 0; padding-left: 16px; }
.fgroup li { font-size: 13.5px; line-height: 1.5; margin: 6px 0; color: #3d3d3d; }
.fgroup.wide { margin: 0 0 12px; }
.fgroup.wide ul { column-count: 2; column-gap: 26px; }
.fgroup.wide li { break-inside: avoid; }
/* exactly three peers read better side by side than balanced across two columns */
.findings.three { column-count: 3; }
@media (max-width: 860px) { .findings.three { column-count: 2; } }
@media (max-width: 620px) { .findings.three { column-count: 1; } }
/* .even — equal-height cards in one row; grid, not column-flow */
.findings.even { column-count: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.findings.even .fgroup { margin: 0; }
.fgroup p.t { font-size: 13.5px; line-height: 1.5; margin: 0; color: #3d3d3d; }
@media (max-width: 860px) { .findings.even { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 620px) { .findings.even { grid-template-columns: 1fr; } }
/* Takeaway summary — the few points that must land */
.takeaways { list-style: none; padding: 0; margin: 16px 0 0; counter-reset: tk; }
.takeaways li { font-size: 15px; line-height: 1.6; margin: 0 0 14px; color: #3a3a3a; position: relative; padding-left: 38px; }
.takeaways li::before { counter-increment: tk; content: counter(tk, decimal-leading-zero); position: absolute; left: 0; top: 2px; font-size: 13px; font-weight: 700; color: #bdbdbd; letter-spacing: .5px; }
.takeaways li b { color: var(--fg); }
.takeaways.goals { margin: 10px 0 0; }
.takeaways.goals li { margin: 0 0 7px; }
/* A list split around an inserted quote keeps one running count. */
.takeaways.cont { counter-reset: none; }
.takeaways.steps li { padding-left: 23px; text-indent: -23px; }
.takeaways.steps li::before { content: none; }
/* .tools — right-aligned tool column, so the fragmentation is scannable */
.takeaways.tools li { padding-right: 160px; }
.takeaways.tools li em { position: absolute; right: 0; top: 3px; width: 150px; text-align: right; font-style: normal; font-size: 12.5px; color: var(--muted); }
@media (max-width: 760px) { .takeaways.tools li { padding-right: 0; } .takeaways.tools li em { position: static; display: block; width: auto; text-align: left; margin-top: 2px; } }
h2 + .mlabel { margin-top: 14px; }
/* Disclosure */
.det { margin: 10px 0 0; }
.det > summary { cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 600; color: var(--link); padding: 2px 0; list-style: none; }
.det > summary::-webkit-details-marker { display: none; }
.det > summary::before { content: '▸'; font-size: 10px; }
.det[open] > summary::before { content: '▾'; }
.det > summary:hover { text-decoration: underline; }
.det[open] > summary { margin-bottom: 2px; }
/* Decision / outcome callout */
.decision { border-left: 3px solid var(--link); background: #f2f7fc; border-radius: 0 8px 8px 0; padding: 16px 22px 17px; margin: 16px 0 0; }
.decision p { margin: 0; font-size: 15px; line-height: 1.6; }
.decision .nxt { margin-top: 13px; font-size: 14px; font-weight: 600; color: var(--link); }
/* Study detail cards (inside the methods disclosure) */
.studies { margin: 14px 0 0; }
.study { display: flex; flex-wrap: wrap; gap: 22px; background: #f7f8f9; border-radius: 12px; padding: 18px 22px 20px; margin: 0 0 12px; }
.study:last-child { margin-bottom: 0; }
.study-txt { flex: 1 1 320px; }
.study-txt img { width: 100%; border-radius: 6px; margin: 12px 0 0; border: 1px solid #e3e3e3; cursor: zoom-in; }
.study-img { flex: 0 1 290px; align-self: flex-start; }
.study-img img { width: 100%; border-radius: 6px; margin: 0; border: 1px solid #e3e3e3; }
.study-img img + img { margin-top: 10px; }
img[data-zoom] { cursor: zoom-in; }
/* Lightbox */
.lb { position: fixed; inset: 0; background: rgba(12,12,14,.93); display: none; align-items: center; justify-content: center; z-index: 999; cursor: zoom-out; padding: 24px; }
.lb.on { display: flex; }
.lb img { max-width: 97vw; max-height: 94vh; border-radius: 4px; background: #fff; }
.lb .x { position: absolute; top: 18px; right: 24px; color: #fff; font-size: 26px; line-height: 1; opacity: .75; }
.lb .x:hover { opacity: 1; }
/* Feature carousel */
.carousel { margin: 18px 0 6px; }
.car-track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; scrollbar-width: none; -ms-overflow-style: none; }
.car-track::-webkit-scrollbar { display: none; }
.car-slide { flex: 0 0 100%; scroll-snap-align: center; margin: 0; padding: 0 1px; }
.car-slide img, .shot img { width: 100%; display: block; border: 1px solid var(--rule); border-radius: 8px; margin: 0; }
.car-scroll { max-height: 532px; overflow-y: auto; border: 1px solid var(--rule); border-radius: 8px; }
.car-scroll img { border: 0; border-radius: 0; }
.shot { margin: 16px 0 0; }
.shot img { cursor: zoom-in; }
.car-ph { width: 100%; aspect-ratio: 16/9; border: 1px dashed #cfcfcf; border-radius: 8px; background: #fafafa; display: flex; align-items: center; justify-content: center; color: #b0b0b0; font-size: 13px; }
.car-slide .car-cap, .shot .car-cap, .car-cap { font-size: 14px; line-height: 1.55; color: #3d3d3d; margin: 13px 2px 0; }
.car-slide .car-cap b, .shot .car-cap b, .car-cap b { color: var(--fg); }

/* Touch devices only: enlarge tap targets to meet WCAG 2.5.8. Scoped to
   `pointer: coarse` so mouse/desktop rendering is untouched. Where the visual
   size matters (carousel dots), the hit area is expanded with a transparent
   pseudo-element rather than by resizing the control. */
@media (pointer: coarse) {
  .tabs { gap: 26px 30px; }
  .tabs a { padding: 10px 0; }
  /* 14.5px text is ~22px tall; 6px padding clears the 24px tap target without
     the boxes meeting, since the flex row gap is 12px. */
  .about-links a { padding: 6px 0; }
  .car-dots { gap: 20px; }
  .car-dot { position: relative; }
  .car-dot::after { content: ""; position: absolute; inset: -13px -9px; }
  .car-btn { width: 40px; height: 40px; font-size: 18px; }
  .proto-ctl { padding: 9px 11px; }
  .cbtn { padding: 13px 22px; }
  .arch-btn { padding: 15px 16px; }
}

/* ---------- Mobile menu ----------
   Below 760px the five links no longer fit beside the wordmark (they need
   ~643px on their own), so they collapse behind a toggle and open as a
   full-screen panel. This block sits after the `pointer: coarse` rules above
   on purpose: both set `.tabs`, and on a touch phone this one has to win. */
.navtoggle { display: none; background: none; border: 0; padding: 10px; margin: -10px;
  cursor: pointer; flex-direction: column; gap: 5px; z-index: 101; }
.navtoggle span { display: block; width: 23px; height: 2px; background: var(--fg); border-radius: 2px;
  transition: transform .22s ease, opacity .16s ease; }

@media (max-width: 760px) {
  .navtoggle { display: inline-flex; }
  /* flex-wrap must be reset: the base .tabs rule sets `wrap`, and with
     column direction a short viewport pushes the last link into a second
     column instead of scrolling. */
  .tabs { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: none;
    flex-direction: column; flex-wrap: nowrap; justify-content: center; align-items: center;
    gap: 30px; margin: 0; padding: 72px 24px; overflow-y: auto; }
  .tabs a { font-size: 19px; letter-spacing: 1.7px; padding: 10px 14px; }
  body.nav-open { overflow: hidden; }
  body.nav-open .tabs { display: flex; }
  body.nav-open .navtoggle { position: fixed; top: 30px; right: 24px; }
  /* bars are 2px with a 5px gap, so each end bar travels 7px to meet in the middle */
  body.nav-open .navtoggle span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  body.nav-open .navtoggle span:nth-child(2) { opacity: 0; }
  body.nav-open .navtoggle span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
}

/* Full-bleed hero. The artwork's left third is flat cream, so the copy sits in
   that zone and the band's background-color continues it seamlessly to the
   viewport edge. Below 1260px the art can no longer clear the copy, so the two
   stack instead of overlapping.
   The 105% size overfills the band rather than letterboxing it, which also
   hides the seam where the image meets the band colour. Anchored to `bottom`,
   not `center`: the artwork runs flush to the bottom edge of the render with
   no clear space, while the top third is empty, so the whole overflow has to
   be taken off the top or the desk gets clipped. 110% is the ceiling: past
   that the copy starts overlapping the artwork at 1265px, the narrowest width
   that still uses this overlapping layout. */
.hero-band { margin: -22px calc(50% - 50vw) 64px; padding: 76px 0; background: #fceee3 url("/images/hero-art.jpg") right bottom / auto 105% no-repeat; display: flex; align-items: center; min-height: clamp(540px, 40vw, 920px); }

.wcard:hover .wcard-img img { transform: scale(1.045); }
.wcard-body { padding: 30px 32px; display: flex; flex-direction: column; justify-content: center; }
.wcard-meta { font-size: 11.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.wcard-body h3 { font-size: 23px; line-height: 1.22; letter-spacing: -.3px; margin: 0 0 10px; border: none; padding: 0; }

.wcard-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px; }
.wtag { font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 5px; background: #f1f3f5; color: #51585f; }
.wcard-cta { font-size: 13.5px; font-weight: 600; color: var(--link); margin-top: auto; }
.wcard:hover .wcard-cta { text-decoration: underline; }

.about { position: relative; display: grid; grid-template-columns: 1fr 330px; gap: 48px; align-items: start; margin: 0 0 72px; }
.about p { font-size: 15.5px; line-height: 1.68; }
.about p:first-child { margin-top: 0; }
.about-photo img { display: block; width: 100%; border-radius: 14px; margin: 0; }
.about-facts { margin: 20px 0 0; padding: 18px 20px; background: #f8f9fa; border-radius: 12px; }
.about-facts p { margin: 0 0 8px; font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.about-facts ul { margin: 0; padding-left: 18px; }
.about-facts li { font-size: 14px; line-height: 1.5; margin: 0 0 5px; }
/* Grouped bullets. Four short scannable lists replace the five prose
   paragraphs the page used to open with. Two columns on desktop so the page
   does not become one long ribbon; the label matches Skills and Tools. */
.about-groups { display: grid; grid-template-columns: 1fr 1fr; gap: 26px 44px; margin: 30px 0 0; }
.about-group p { margin: 0 0 10px; font-size: 11.5px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--muted); }
.about-group ul { margin: 0; padding-left: 18px; }
.about-group li { font-size: 14.5px; line-height: 1.56; margin: 0 0 7px; }
.about-group li:last-child { margin-bottom: 0; }
@media (max-width: 620px) { .about-groups { grid-template-columns: 1fr; gap: 24px; } }
/* Skills, mirrored from the résumé's Core Skills. Uses the same neutral pill as

   same label style as Fast facts. */
.about-skills { margin: 28px 0 0; }
.about-skills p { margin: 0 0 11px; font-size: 11.5px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--muted); }
.about-skills ul { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; }
.about-skills li { font-size: 13px; font-weight: 600; padding: 5px 11px; border-radius: 6px;
  background: #f1f3f5; color: #51585f; margin: 0; line-height: 1.4; }
/* Social links: they live with the bio now, so they carry labels rather than
   being icon-only the way they were in the header. */
.about-links { display: flex; flex-wrap: wrap; gap: 12px 26px; margin: 28px 0 0; }
.about-links a { display: inline-flex; align-items: center; gap: 8px; font-size: 14.5px;
  color: var(--muted); text-decoration: none; transition: color .14s ease; }
.about-links a:hover { color: var(--fg); }
.about-links svg { display: block; width: 16px; height: 16px; fill: currentColor; flex: none; }
/* Objects lifted from the hero render, scattered in the margins beside About.
   Purely decorative: aria-hidden and pointer-events none, so they are invisible
   to assistive tech and never intercept a click. They sit outside .about, so
   they only appear once the viewport is wide enough to hold them without
   causing a horizontal scrollbar. */
.deco { position: absolute; display: block; pointer-events: none; user-select: none; z-index: 0; }
.deco img { display: block; width: 100%; height: auto; margin: 0; animation: decoFloat 7s ease-in-out infinite; }
.deco-rocket { width: 70px; top: -22px; right: -96px; transform: rotate(-10deg); }
.deco-cross  { width: 44px; top: 76px; left: -92px; transform: rotate(10deg); }
.deco-ring   { width: 58px; top: 330px; left: -96px; transform: rotate(-7deg); }
.deco-cross img { animation-delay: -2.3s; }
.deco-ring img  { animation-delay: -4.6s; }
@keyframes decoFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
@media (prefers-reduced-motion: reduce) { .deco img { animation: none; } }
/* Below 1280px the page margins are too narrow to hold anything (the content
   box is 1072px, so a 1150px viewport leaves only 39px a side). Rather than
   hide the objects there, they regroup into the empty space under Fast Facts,
   which exists at every desktop width because the text column is always the
   taller of the two. */
@media (max-width: 1279px) {
  .deco { top: auto; left: auto; bottom: 0; }
  .deco-rocket { width: 54px; right: 208px; bottom: 16px; transform: rotate(-10deg); }
  .deco-ring   { width: 44px; right: 120px; bottom: 0; transform: rotate(-7deg); }
  .deco-cross  { width: 36px; right: 42px; bottom: 26px; transform: rotate(10deg); }
}
/* Single column: the right-hand column is gone, so there is nowhere to put them. */
@media (max-width: 880px) { .deco { display: none; } }

.contact { margin: 0 0 40px; }
.contact-lede { font-size: 17px; line-height: 1.6; color: #3a3a3a; margin: 0 0 22px; max-width: 560px; }
.cbtns { display: flex; flex-wrap: wrap; gap: 10px; }
.cbtn { display: inline-flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 600; padding: 11px 20px; border-radius: 9px; border: 1px solid var(--rule); background: var(--bg); color: var(--fg); text-decoration: none; transition: background .15s ease, border-color .15s ease; }
.cbtn:hover { background: #f6f7f8; border-color: #d4d4d4; }
.cbtn-primary { background: var(--link); border-color: var(--link); color: #fff; }
.cbtn-primary:hover { background: #085aad; border-color: #085aad; }

@media (max-width: 1260px) {

  .hero-copy { max-width: 620px; }
  .hero-art { display: block; width: 100%; margin: 44px 0 0; }
}
@media (max-width: 880px) {
  .wcard, .wcard-alt { grid-template-columns: 1fr; }
  .wcard-alt .wcard-img { order: 0; }
  /* Stacked cards are already tall, so the desktop gap would read as a break
     between sections rather than spacing within one. */
  .work { gap: 64px; margin: 0 0 88px; }
  .about { grid-template-columns: 1fr; gap: 30px; }
  .about-photo { max-width: 300px; }
  .intro-greeting { font-size: 34px; }

}/* ---------- Presentation decks ----------
   Slides are authored against a fixed 1280x720 stage and the whole stage is
   scaled by one root font-size, so every slide is pixel-identical on a laptop,
   a projector and in the PDF export. Nothing reflows, nothing drifts.
   Everything inside a slide is sized in em, so one number controls the lot. */
.shell:has(.deck) { max-width: none; padding: 0; margin: 0; }
body:has(.deck) { overflow: hidden; background: #0f1419; }
/* Every piece of site chrome is hidden in a deck, on screen and in print. */
body:has(.deck) .sitehead-wrap,
body:has(.deck) .crumbs,
body:has(.deck) .foot,
body:has(.deck) .rail { display: none; }

.deck { position: fixed; inset: 0; display: flex; align-items: center;
  justify-content: center; background: #0f1419; }

/* 16:9 box that fits the viewport; 1em == 16px when the stage is 1280 wide. */
.slide { position: absolute; box-sizing: border-box; overflow: hidden;
  width: min(100vw, 177.7778vh); height: min(56.25vw, 100vh);
  font-size: calc(min(100vw, 177.7778vh) * 0.0125);
  background: #fff; color: var(--fg);
  padding: 4.5em 5em; opacity: 0; visibility: hidden;
  transition: opacity .18s ease; }
.slide.on { opacity: 1; visibility: visible; }

/* Type scale. Six sizes, no exceptions: anything that does not fit means the
   slide has too much on it, not that the type should shrink. */
.slide .s-kick { font-size: .8125em; font-weight: 700; letter-spacing: .14em;
  text-transform: uppercase; color: var(--muted); margin: 0 0 1.25em; }
.slide h2 { font-size: 3em; line-height: 1.08; letter-spacing: -.02em;
  font-weight: 800; margin: 0; padding: 0; border: none; position: static; }
/* The site draws a hairline above every h2. A slide is not an article section. */
.slide h2::before, .slide h3::before { display: none; content: none; }
.slide h3 { font-size: 1.75em; line-height: 1.18; letter-spacing: -.01em;
  font-weight: 700; margin: 0 0 .6em; padding: 0; border: none; }
.slide p { font-size: 1.125em; line-height: 1.6; margin: .85em 0 0; max-width: 34em; }
.slide .s-lead { font-size: 1.5em; line-height: 1.45; color: #3a3a3a; max-width: 28em; }
.slide .s-note { font-size: .9375em; color: var(--muted); }

/* Layouts. Title, split and full-bleed cover every slide in both decks. */
.slide.s-title { display: flex; flex-direction: column; justify-content: center; }
/* One measure for the whole block, so heading and body share a right edge and
   the white space reads as composed rather than left over. */
.slide.s-title > h2, .slide.s-title > h3,
.slide.s-title > p, .slide.s-title > ul { max-width: 72%; }
.slide.s-title > .s-lead { max-width: 72%; }

/* Cards, for when a list is really a set of separate things rather than a
   sequence. Reads as a diagram instead of prose. */
.s-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1em 1.25em;
  margin: 1.5em 0 0; padding: 0; list-style: none; max-width: 100%; }
.s-cards.four { grid-template-columns: repeat(4, 1fr); }
.s-cards li { margin: 0; padding: 1.15em 1.25em; background: #f4f6f7;
  border-radius: .6em; }
.s-cards .t { display: block; font-size: 1.125em; font-weight: 700; line-height: 1.25;
  margin: 0 0 .35em; }
.s-cards .d { display: block; font-size: .9375em; line-height: 1.45; color: #4a5056; }
/* Cards are a diagram, so they take the full stage rather than the text measure. */
.slide.s-title > ul.s-cards { max-width: 100%; }
.slide.s-split { display: grid; grid-template-columns: 1fr 1fr; gap: 3.5em;
  align-items: center; }
.slide.s-split.wide-right { grid-template-columns: 0.8fr 1.2fr; }
.slide.s-full { padding: 0; display: block; position: relative; }
.slide.s-full img { width: 100%; height: 100%; object-fit: cover; margin: 0;
  border: none; border-radius: 0; }
/* Caption panel for a full-bleed slide. Sits on an opaque card rather than a
   scrim, so contrast is guaranteed regardless of what is behind it. */
.s-over { position: absolute; left: 3.5em; bottom: 3.5em; max-width: 30em;
  background: #fff; border-radius: .6em; padding: 1.6em 1.8em;
  box-shadow: 0 .5em 2em rgba(15,20,25,.18); }
.s-over .s-kick { margin: 0 0 .6em; }
.s-over h3 { margin: 0; }
.s-over p { margin: .6em 0 0; max-width: none; }
.slide-body { min-width: 0; }
.slide-fig { min-width: 0; }
.slide-fig img { width: 100%; display: block; margin: 0; border: 1px solid var(--rule);
  border-radius: .5em; }
.slide-fig .s-cap { font-size: .875em; color: var(--muted); margin: .75em 0 0; }

/* Stat blocks, for the outcome slides. */
.s-stats { display: flex; gap: 3em; margin: 1.75em 0 0; padding: 0; list-style: none; }
.s-stats li { margin: 0; }
.s-stats .n { display: block; font-size: 2.75em; font-weight: 800; line-height: 1;
  letter-spacing: -.02em; }
.s-stats .l { display: block; font-size: .875em; color: var(--muted); margin: .5em 0 0;
  max-width: 11em; line-height: 1.45; }

.slide ul.s-list { margin: 1.25em 0 0; padding: 0; list-style: none; }
.slide ul.s-list li { font-size: 1.125em; line-height: 1.5; margin: 0 0 .8em;
  padding-left: 1.4em; position: relative; }
.slide ul.s-list li::before { content: ""; position: absolute; left: 0; top: .6em;
  width: .45em; height: .45em; border-radius: 50%; background: var(--link); }
.slide ul.s-list li b { font-weight: 700; }

/* Deck chrome: slide number and progress. Deliberately quiet. */
/* Chrome sits on top of white slides, so it is dark rather than light. */
.deck-ui { position: fixed; left: 0; right: 0; bottom: 0; height: 3px;
  background: rgba(15,20,25,.10); z-index: 5; }
.deck-ui i { display: block; height: 100%; background: var(--link); width: 0;
  transition: width .2s ease; }
.deck-no { position: fixed; right: 1.4rem; bottom: 1.3rem; z-index: 6;
  font-size: 12px; font-weight: 600; letter-spacing: .08em; color: #9aa3ab; }
body:has(.deck) .deck-no, body:has(.deck) .deck-ui { display: block; }

/* PDF export. One slide per landscape page, every slide visible, no chrome.
   Chrome's print-to-PDF at 1280x720 produces a deck that matches the screen. */
@page { size: 1280px 720px; margin: 0; }
@media print {
  body:has(.deck) { overflow: visible; background: #fff; }
  .deck { position: static; display: block; background: #fff; }
  .slide { position: static; opacity: 1; visibility: visible; transition: none;
    width: 1280px; height: 720px; font-size: 16px; page-break-after: always;
    break-after: page; }
  .slide:last-child { page-break-after: auto; break-after: auto; }
  .deck-ui, .deck-no, .crumbs, .sitehead-wrap, .foot { display: none !important; }
  /* The shell's own padding would otherwise add a trailing blank page. */
  .shell:has(.deck) { padding: 0 !important; margin: 0 !important; }
  html, body { margin: 0 !important; padding: 0 !important; }
}

/* ---------- 3D work gallery ---------- */
.shell:has(.gal) { max-width: 1120px; }
.gal { display: grid; grid-template-columns: repeat(2, 1fr); gap: 38px 30px; margin: 0 0 64px; }
.gitem { display: block; margin: 0; text-decoration: none; color: inherit; }
.gitem img { display: block; width: 100%; margin: 0; border-radius: 10px; background: #f1f3f5; transition: transform .4s ease, box-shadow .2s ease; }
.gitem:hover img { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(0,0,0,.13); }
.gcap { margin: 13px 2px 0; }
.gcap b { display: block; font-size: 16px; letter-spacing: -.1px; }
.gitem:hover .gcap b { text-decoration: underline; }
.gcap span { display: block; font-size: 13px; color: var(--muted); margin-top: 3px; }
.gcap em { display: block; font-size: 14px; line-height: 1.55; color: #4a4a4a; margin-top: 7px; font-style: normal; }
@media (max-width: 880px) { .gal { grid-template-columns: 1fr; gap: 30px; } }/* ---------- 3D piece detail pages ---------- */
.shell:has(.pgal), .shell:has(.phero) { max-width: 1120px; }
.piece-meta { font-size: 13.5px; color: var(--muted); margin: -4px 0 20px; }
.piece-skills { font-size: 13.5px; line-height: 1.6; color: #5a5a5a; margin: 0 0 26px; padding: 14px 18px; background: #f8f9fa; border-radius: 10px; }
.phero { display: block; width: 100%; margin: 0 0 14px; border-radius: 12px; background: #f1f3f5; cursor: zoom-in; }
.pgal { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin: 0 0 56px; }
.pgal img { display: block; width: 100%; margin: 0; border-radius: 10px; background: #f1f3f5; cursor: zoom-in; }
@media (max-width: 880px) { .pgal { grid-template-columns: 1fr; } }
</style>
