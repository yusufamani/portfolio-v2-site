let railObserver = null;

// "See all N findings" is recounted from the list itself, so the number can
// never drift when items are added or removed. The markdown keeps a correct
// number as the fallback if this never runs.
function syncCounts() {
  content.querySelectorAll('details summary').forEach(function (s) {
    const m = s.textContent.match(/^(\s*See all\s+)(\d+)(\s+.+)$/);
    if (!m) return;
    const n = s.parentElement.querySelectorAll('li').length;
    if (n > 0 && String(n) !== m[2]) s.textContent = m[1] + n + m[3];
  });
}

function buildRail() {  document.querySelectorAll('.rail').forEach(function (r) { r.remove(); });
  if (railObserver) { railObserver.disconnect(); railObserver = null; }

  const secs = [...content.querySelectorAll('.sec')];
  if (secs.length < 4) return;

  const rail = document.createElement('nav');
  rail.className = 'rail';
  rail.setAttribute('aria-label', 'Sections');
  let html = '<p class="rail-h">On this page</p><ol>';
  secs.forEach(function (sec, i) {
    const h = sec.querySelector('h2');
    const id = 'sec-' + (h.textContent.toLowerCase().replace(/[^a-z0-9\s-]/g, '').trim().replace(/\s+/g, '-') || i);
    sec.id = id;
    html += '<li><a href="#' + id + '">' + h.textContent.trim() + '</a></li>';
  });
  rail.innerHTML = html + '</ol>';
  document.body.appendChild(rail);

  const links = [...rail.querySelectorAll('a')];
  links.forEach(function (a, i) {
    a.addEventListener('click', function (e) {
      e.preventDefault();
      secs[i].scrollIntoView({ behavior: 'smooth', block: 'start' });
      history.replaceState(null, '', location.pathname + location.hash);
    });
  });

  // with sticky h2s the pinned heading is ground truth, so the rail switches
  // exactly when a section reaches the top rather than at a reading line
  function sync() {
    const line = 1;
    let active = 0;
    secs.forEach(function (sec, i) {
      if (sec.getBoundingClientRect().top <= line) active = i;
    });
    // a short final section can never cross the line, so own the page bottom
    const left = document.documentElement.scrollHeight - innerHeight - scrollY;
    if (left <= 2) active = secs.length - 1;
    links.forEach(function (a, i) { a.classList.toggle('on', i === active); });
  }
  let tick = false;
  addEventListener('scroll', function () {
    if (tick) return;
    tick = true;
    requestAnimationFrame(function () { sync(); tick = false; });
  }, { passive: true });
  addEventListener('resize', sync, { passive: true });
  sync();
}

function wrapSections() {
  let cur = null;
  [...content.children].forEach(function (el) {
    if (el.tagName === 'H2') {
      cur = document.createElement('section');
      cur.className = 'sec';
      content.insertBefore(cur, el);
      cur.appendChild(el);
    } else if (cur) {
      cur.appendChild(el);
    }
  });
}

function initCarousels() {
  document.querySelectorAll('.carousel').forEach(function (c) {
    const track = c.querySelector('.car-track');
    const slides = c.querySelectorAll('.car-slide');
    const dots = c.querySelector('.car-dots');
    const prev = c.querySelector('.car-prev');
    const next = c.querySelector('.car-next');
    if (!track || !slides.length || !dots) return;

    dots.innerHTML = '';
    slides.forEach(function (s, i) {
      const b = document.createElement('button');
      b.className = 'car-dot' + (i === 0 ? ' on' : '');
      b.setAttribute('aria-label', 'Go to slide ' + (i + 1));
      b.addEventListener('click', function () { go(i); });
      dots.appendChild(b);
    });

    function idx() { return Math.round(track.scrollLeft / track.clientWidth); }
    function go(i) { track.scrollTo({ left: i * track.clientWidth, behavior: 'smooth' }); }
    function sync() {
      const i = idx();
      dots.querySelectorAll('.car-dot').forEach(function (d, j) { d.classList.toggle('on', j === i); });
      if (prev) prev.disabled = i <= 0;
      if (next) next.disabled = i >= slides.length - 1;
    }
    if (prev) prev.addEventListener('click', function () { go(idx() - 1); });
    if (next) next.addEventListener('click', function () { go(idx() + 1); });
    track.addEventListener('scroll', sync, { passive: true });
    sync();
  });
}

      '<div class="proto-brand">Hire<i>in</i></div>' +
      '<div class="proto-ssearch">' + PROTO_IC.search + 'Search</div>' +
      '<ul class="proto-nav">' + nav + '</ul>' +
      '<div class="proto-user"><span class="proto-av">SJ</span>' +
        '<span class="nm">Steve Jameson<br><span class="rl">Recruiter</span></span></div>' +
    '</aside>' +
    '<div class="proto-main">' +
      '<div class="proto-h1">My Dashboard</div>' +
      '<div class="proto-topsearch">' + PROTO_IC.search + 'Search…</div>' +
      '<div class="proto-cols">' +
        '<div class="proto-colmain">' + cardHtml + '</div>' +
        '<div class="proto-cal">' +
          '<h5>Interview Calendar</h5>' +
          '<div class="proto-calnav"><span>‹</span>June 2022<span>›</span></div>' +
          '<div class="proto-grid">' + grid + '</div>' +
          '<div class="proto-calsep"></div>' +
          '<h6>Today’s interview schedule</h6>' + ev +
        '</div>' +
      '</div>' +
    '</div>' +
  '</div>';
}

// The archive gate is a tidiness feature, not security. Every case study's
// markdown is already in the page source and each one is still reachable by its
// own URL. This keeps the home page to three pieces without deleting the rest.
// Markdown is rendered client-side, so the browser's native jump to "#about"
// fires before that element exists. Re-run it once the markup is in place.
function scrollToHash() {
  const h = location.hash;
  if (!h || h.length < 2 || h === '#v1') return;
  let t = null;
  try { t = document.querySelector(h); } catch (e) { return; }
  if (t) t.scrollIntoView();
}

function initArchive() {
  content.querySelectorAll('.archive').forEach(function (a) {
    const btn = a.querySelector('.arch-btn');
    const input = a.querySelector('.arch-in');
    const go = a.querySelector('.arch-go');
    const ic = a.querySelector('.arch-ic');
    if (!btn || !input || !go) return;
    const want = Number(a.dataset.k || 0);

    function hash(s) {
      let x = 5381;
      s = String(s).trim().toLowerCase();
      for (let i = 0; i < s.length; i++) x = ((x << 5) + x + s.charCodeAt(i)) >>> 0;
      return x;
    }
    function remember(v) {
      try { v ? sessionStorage.setItem('archOpen', '1') : sessionStorage.removeItem('archOpen'); } catch (e) {}
    }
    function openUp() {
      a.classList.add('open');
      a.classList.remove('asking', 'bad');
      if (ic) ic.textContent = '\u{1F513}';
      btn.setAttribute('aria-expanded', 'true');
    }
    function shut() {
      a.classList.remove('open', 'asking', 'bad');
      if (ic) ic.textContent = '\u{1F512}';
      btn.setAttribute('aria-expanded', 'false');
    }

    let was = false;
    try { was = sessionStorage.getItem('archOpen') === '1'; } catch (e) {}
    if (was) openUp();

    btn.addEventListener('click', function () {
      if (a.classList.contains('open')) { shut(); remember(false); return; }
      a.classList.toggle('asking');
      a.classList.remove('bad');
      if (a.classList.contains('asking')) input.focus();
    });

    function tryKey() {
      if (hash(input.value) === want) {
        input.value = '';
        remember(true);
        openUp();
      } else {
        a.classList.remove('bad');
        void a.offsetWidth;
        a.classList.add('bad');
        input.select();
      }
    }
    go.addEventListener('click', tryKey);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); tryKey(); }
      else a.classList.remove('bad');
    });
  });
}

function initProtos() {
  document.querySelectorAll('.proto[data-proto]').forEach(function (host) {
    if (host.dataset.built) return;
    host.dataset.built = '1';

    const rows = PROTO_ROWS.map(function (r) { return Object.assign({}, r); });
    const state = { types: [], sort: null, priority: false, open: -1, pop: null };

    const card =
      '<div class="proto-card">' +
        '<div class="proto-head">' +
          '<span class="proto-title">My Tasks</span>' +
          '<button class="proto-ctl" data-pop="type">' + PROTO_IC.filter + 'Task type</button>' +
          '<button class="proto-ctl" data-pop="prio">' + PROTO_IC.flag + 'Priority</button>' +
          '<button class="proto-ctl" data-pop="sort">' + PROTO_IC.sort + 'Sort</button>' +
        '</div>' +
        '<ul class="proto-rows"></ul>' +
        '<div class="proto-foot"><span>Rows per page: 10</span></div>' +
      '</div>';
    host.innerHTML = (host.dataset.chrome === 'card' ? card : protoChrome(card)) +
      (host.dataset.hint === '0' ? '' :
        '<p class="proto-hint">Live rebuild — <b>click a task</b> to expand it, then try <b>Task type</b>, <b>Priority</b>, <b>Sort</b>, or the <b>due date</b> inside an open task.</p>');

    const head = host.querySelector('.proto-head');
    const list = host.querySelector('.proto-rows');

    function visible() {
      let v = rows.map(function (r, i) { return { r: r, i: i }; });
      if (state.types.length) v = v.filter(function (o) { return state.types.indexOf(o.r.k) > -1; });
      if (state.priority) v = v.filter(function (o) { return o.r.f; });
      if (state.sort) {
        const dir = state.sort === 'old' ? 1 : -1;
        v.sort(function (a, b) { return (a.i - b.i) * dir; });
      }
      return v;
    }

    function draw() {
      const v = visible();
      if (!v.length) { list.innerHTML = '<li class="proto-empty">No tasks match these filters.</li>'; return; }
      list.innerHTML = v.map(function (o) {
        const r = o.r, open = state.open === o.i;
        return '<li class="proto-row' + (open ? ' open' : '') + '" data-i="' + o.i + '">' +
          '<div class="proto-top">' +
            '<span class="proto-txt">' + r.t.replace(/<a>/g, '<a href="#" onclick="return false">') + '</span>' +
            '<span class="proto-flag' + (r.f ? ' on' : '') + '">' + PROTO_IC.flag + '</span>' +
            (open ? '<button class="proto-datechip" data-pop="date">' + r.d + ' <span class="x">×</span></button>'
                  : '<span class="proto-date">' + r.d + '</span>') +
            '<span class="proto-chev">' + PROTO_IC.chev + '</span>' +
          '</div>' +
          '<div class="proto-body">' +
            '<div class="proto-meta">' +
              '<div><div class="k">Hiring Manager</div>Lisa Johnson</div>' +
              '<div><div class="k">Age</div>27 days</div>' +
            '</div>' +
            '<div class="proto-note">' +
              '<div class="nt"><div class="k">Note</div>Please complete this task before Monday of next week!</div>' +
              '<div class="proto-act">' +
                '<button class="proto-ibtn" data-act="del" title="Delete task">' + PROTO_IC.trash + '</button>' +
                '<button class="proto-ibtn' + (r.f ? ' on' : '') + '" data-act="flag" title="Prioritize task">' + PROTO_IC.flag + '</button>' +
                '<button class="proto-approve" data-act="done">Approve</button>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</li>';
      }).join('');
    }

    function closePop() {
      const p = host.querySelector('.proto-pop');
      if (p) p.remove();
      state.pop = null;
    }

    function openPop(btn, kind) {
      closePop();
      state.pop = kind;
      const p = document.createElement('div');
      p.className = 'proto-pop' + (kind === 'date' ? ' dates' : '');
      if (kind === 'type') {
        p.innerHTML = '<h4>Task type filters</h4>' + PROTO_TYPES.map(function (t) {
          return '<label class="proto-opt"><input type="checkbox" data-k="' + t.k + '"' +
                 (state.types.indexOf(t.k) > -1 ? ' checked' : '') + '>' + t.l + '</label>';
        }).join('');
      } else if (kind === 'sort') {
        p.innerHTML = '<h4>Sort tasks</h4>' +
          '<label class="proto-opt"><input type="checkbox" data-s="new"' + (state.sort === 'new' ? ' checked' : '') + '>New to old</label>' +
          '<label class="proto-opt"><input type="checkbox" data-s="old"' + (state.sort === 'old' ? ' checked' : '') + '>Old to new</label>';
      } else {
        p.innerHTML = PROTO_DATES.map(function (d) {
          return '<div class="proto-opt" data-d="' + d + '">' + d + '</div>';
        }).join('');
      }
      const anchor = kind === 'date' ? btn.closest('.proto-row') : head;
      anchor.style.position = 'relative';
      anchor.appendChild(p);
      const off = btn.getBoundingClientRect().left - anchor.getBoundingClientRect().left;
      p.style.left = Math.max(4, Math.min(off, anchor.clientWidth - 220)) + 'px';
      if (kind === 'date') p.style.top = (btn.offsetTop + btn.offsetHeight + 2) + 'px';
    }

    host.addEventListener('click', function (e) {
      const ctl = e.target.closest('[data-pop]');
      if (ctl) {
        e.stopPropagation();
        const kind = ctl.dataset.pop;
        if (kind === 'prio') {
          closePop();
          state.priority = !state.priority;
          ctl.classList.toggle('on', state.priority);
          draw();
          return;
        }
        if (state.pop === kind) { closePop(); return; }
        openPop(ctl, kind);
        return;
      }

      const opt = e.target.closest('.proto-opt');
      if (opt) {
        e.stopPropagation();
        if (opt.dataset.d) {
          const row = opt.closest('.proto-row');
          rows[+row.dataset.i].d = opt.dataset.d;
          closePop(); draw();
          return;
        }
        const box = opt.querySelector('input');
        if (!box) return;
        setTimeout(function () {
          if (box.dataset.k) {
            const k = box.dataset.k, at = state.types.indexOf(k);
            if (box.checked && at < 0) state.types.push(k);
            if (!box.checked && at > -1) state.types.splice(at, 1);
            host.querySelector('[data-pop="type"]').classList.toggle('on', state.types.length > 0);
          } else {
            state.sort = box.checked ? box.dataset.s : null;
            opt.parentNode.querySelectorAll('input').forEach(function (o) { if (o !== box) o.checked = false; });
            host.querySelector('[data-pop="sort"]').classList.toggle('on', !!state.sort);
          }
          draw();
        }, 0);
        return;
      }

      const act = e.target.closest('[data-act]');
      if (act) {
        e.stopPropagation();
        const i = +act.closest('.proto-row').dataset.i;
        if (act.dataset.act === 'flag') rows[i].f = rows[i].f ? 0 : 1;
        else { rows.splice(i, 1); state.open = -1; }
        closePop(); draw();
        return;
      }

      const top = e.target.closest('.proto-top');
      if (top) {
        const i = +top.closest('.proto-row').dataset.i;
        state.open = state.open === i ? -1 : i;
        closePop(); draw();
      }
    });

    document.addEventListener('click', function (e) {
      if (state.pop && !host.contains(e.target)) closePop();
    });

    draw();
  });
}

document.querySelectorAll('.vtoggle button').forEach(function (b) {
  b.addEventListener('click', function () { show(b.dataset.v); });
});

// The refined version is the finished case study, so it is the default; the
// AI original stays reachable at #v1 for comparison.
show(location.hash === '#v1' ? 'v1' : 'v2');

const lb = document.getElementById('lb');
const lbImg = lb.querySelector('img');
const lbClose = lb.querySelector('.x');
const lbNav = lb.querySelector('.lb-nav');
const lbPrev = lb.querySelector('.lb-prev');
const lbNext = lb.querySelector('.lb-next');
const lbStatus = lb.querySelector('.lb-status');
let zoomOrigin = null;
let zoomImages = [];
let zoomIndex = 0;
function showZoomImage() {
  const image = zoomImages[zoomIndex];
  zoomOrigin = image;
  lbImg.src = image.currentSrc || image.src;
  lbImg.alt = image.alt || '';
  const caption = image.closest('.car-slide')?.querySelector('.car-cap');
  lbStatus.textContent = zoomImages.length > 1
    ? (zoomIndex + 1) + ' / ' + zoomImages.length + (caption ? ' · ' + caption.innerText.replace(/\s+/g, ' ').trim() : '')
    : '';
  lbPrev.disabled = zoomIndex === 0;
  lbNext.disabled = zoomIndex === zoomImages.length - 1;
}
function moveZoom(step) {
  const nextIndex = zoomIndex + step;
  if (nextIndex < 0 || nextIndex >= zoomImages.length) return;
  zoomIndex = nextIndex;
  showZoomImage();
  const track = zoomOrigin.closest('.car-track');
  if (track) {
    track.scrollTo({ left: zoomIndex * track.clientWidth, behavior: 'instant' });
  }
  if ((document.activeElement === lbPrev && lbPrev.disabled) ||
      (document.activeElement === lbNext && lbNext.disabled)) lbClose.focus();
}
function openZoom(image) {
  const carousel = image.closest('.deck .carousel');
  zoomImages = carousel ? Array.from(carousel.querySelectorAll('.car-slide img')) : [image];
  zoomIndex = zoomImages.indexOf(image);
  const hasGallery = zoomImages.length > 1;
  lbNav.hidden = !hasGallery;
  lb.classList.toggle('has-gallery', hasGallery);
  showZoomImage();
  lb.classList.add('on');
  lb.setAttribute('aria-hidden', 'false');
  lbClose.focus();
}
function closeZoom() {
  if (!lb.classList.contains('on')) return;
  lb.classList.remove('on');
  lb.setAttribute('aria-hidden', 'true');
  lbImg.removeAttribute('src');
  if (zoomOrigin && zoomOrigin.isConnected) zoomOrigin.focus();
  zoomOrigin = null;
  zoomImages = [];
  lbStatus.textContent = '';
}
lbPrev.addEventListener('click', function () { moveZoom(-1); });
lbNext.addEventListener('click', function () { moveZoom(1); });
content.addEventListener('click', function (e) {
  const t = e.target.closest('img[data-zoom]');
  if (!t) return;
  /* An image inside a link is a thumbnail for that link, not something to
     zoom. Opening the lightbox here would fire alongside the navigation. */
  if (t.closest('a')) return;
  openZoom(t);
});
lb.addEventListener('click', function (e) {
  if (e.target === lb || e.target === lbClose) closeZoom();
});
lbImg.addEventListener('click', closeZoom);
lb.addEventListener('keydown', function (e) {
  if (e.key === 'Tab') {
    const buttons = Array.from(lb.querySelectorAll('button')).filter(function (button) {
      return !button.disabled && !button.closest('[hidden]');
    });
    const first = buttons[0], last = buttons[buttons.length - 1];
    if (e.shiftKey && (document.activeElement === first || document.activeElement === lb)) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && (document.activeElement === last || document.activeElement === lb)) {
      e.preventDefault();
      first.focus();
    }
  }
});
document.addEventListener('keydown', function (e) {
  if (!lb.classList.contains('on')) return;
  if (e.key === 'Escape') {
    e.preventDefault();
    closeZoom();
  } else if (!e.metaKey && !e.ctrlKey && !e.altKey && zoomImages.length > 1) {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      e.preventDefault();
      moveZoom(e.key === 'ArrowLeft' ? -1 : 1);
    }
  }
});

/* Presentation decks. Arrow keys, space, click and swipe page through the
   slides; the URL hash keeps a slide shareable and survives a reload, which
   matters if a browser restarts mid-interview. */
(function () {
  const deck = document.querySelector('.deck');
  if (!deck) return;
  const slides = Array.from(deck.querySelectorAll('.slide'));
  if (!slides.length) return;
  if (deck.classList.contains('tde-branded')) {
    slides.forEach(function (slide) {
      const footer = document.createElement('div');
      footer.className = 'tde-footer';
      footer.innerHTML = '<img class="tde-footer-logo" src="/images/logos/linkedin.svg" alt="LinkedIn">'
        + '<div class="tde-footer-right"><span class="tde-footer-note">PROPRIETARY + CONFIDENTIAL</span></div>';
      slide.appendChild(footer);
    });
  }

  const bar = document.createElement('div');
  bar.className = 'deck-ui'; bar.innerHTML = '<i></i>';
  const no = document.createElement('div');
  no.className = 'deck-no';
  no.setAttribute('aria-live', 'polite');
  document.body.appendChild(bar); document.body.appendChild(no);
  const fill = bar.querySelector('i');

  let i = Math.max(0, Math.min(slides.length - 1,
    (parseInt(location.hash.replace('#s', ''), 10) || 1) - 1));

  function go(n) {
    i = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach(function (s, k) { s.classList.toggle('on', k === i); });
    no.textContent = (i + 1) + ' / ' + slides.length;
    fill.style.width = ((i + 1) / slides.length * 100) + '%';
    history.replaceState(null, '', location.pathname + '#s' + (i + 1));
  }
  go(i);

  document.addEventListener('keydown', function (e) {
    if (lb.classList.contains('on')) return;
    const zoomTarget = e.target.closest && e.target.closest('.deck-zoomable');
    if (zoomTarget && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault();
      openZoom(zoomTarget);
      return;
    }
    if (e.target.closest && e.target.closest('.carousel')) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(i + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(i - 1); }
    else if (e.key === 'Home') { e.preventDefault(); go(0); }
    else if (e.key === 'End') { e.preventDefault(); go(slides.length - 1); }
    else if (e.key === 'f') { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
  });
  deck.querySelectorAll('.slide-fig > img, .slide-fig.stack img, .slide.s-full > img, .slide-fig .car-slide img').forEach(function (image) {
    image.classList.add('deck-zoomable');
    image.tabIndex = 0;
    image.setAttribute('role', 'button');
    image.setAttribute('aria-haspopup', 'dialog');
    image.setAttribute('aria-label', 'Enlarge image: ' + (image.alt || 'slide image'));
    image.title = 'Click to enlarge';
  });
  /* Click the right two-thirds to advance, the left third to go back, so a
     mis-click during a presentation is recoverable rather than disruptive. */
  deck.addEventListener('click', function (e) {
    const zoomTarget = e.target.closest('.deck-zoomable');
    if (zoomTarget) {
      e.preventDefault();
      openZoom(zoomTarget);
      return;
    }
    if (e.target.closest('.carousel')) return;
    go(e.clientX < window.innerWidth / 3 ? i - 1 : i + 1);
  });
  let x0 = null;
  deck.addEventListener('touchstart', function (e) {
    x0 = e.target.closest('.carousel') ? null : e.touches[0].clientX;
  }, { passive: true });
  deck.addEventListener('touchend', function (e) {
    if (lb.classList.contains('on')) { x0 = null; return; }
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 40) go(dx < 0 ? i + 1 : i - 1);
    x0 = null;
  });
})();

/* Mobile menu. Below 760px the links live behind the toggle and open as a
   full-screen panel; above it this code never fires because the button is
   display:none and cannot be clicked. */
(function () {
  const btn = document.querySelector('.navtoggle');
  const nav = document.getElementById('sitenav');
  if (!btn || !nav) return;
  function setOpen(open) {
    document.body.classList.toggle('nav-open', open);
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    btn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
  }
  btn.addEventListener('click', function () {
    setOpen(!document.body.classList.contains('nav-open'));
  });
  /* Any link closes it, including the in-page About/Contact anchors, which
     would otherwise scroll behind a panel that is still covering the screen. */
  nav.addEventListener('click', function (e) {
    if (e.target.closest('a')) setOpen(false);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') setOpen(false);
  });
  /* Rotating to landscape can cross the breakpoint while the panel is open,
     which would leave the scroll lock on a desktop-width layout. */
  window.addEventListener('resize', function () {
    if (window.innerWidth > 760) setOpen(false);
  });
})();
