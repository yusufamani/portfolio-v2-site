<style>
:root {
  --fg: #1a1a1a;
  --muted: #6b6b6b;
  --rule: #e6e6e6;
  --link: #0a66c2;
  --bg: #ffffff;
  --code-bg: #f6f8fa;
  --quote: #f9f9fb;
  --quote-bar: #0a66c2;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif; line-height: 1.6; }
.shell { max-width: 760px; margin: 0 auto; padding: 0 24px 96px; }
/* The header bar spans the full viewport so its background covers the
   full-bleed hero behind it when pinned; the nav inside stays aligned to the
   same 1072px column as everything else. Spacing is margin, not padding, so
   that when the bar is sticky only the nav pins rather than ~146px of
   surrounding whitespace. */
.sitehead-wrap { margin: 36px 0 42px; padding: 12px 24px; }
.sitehead { max-width: 1072px; margin: 0 auto; }
/* Sticky everywhere except pages with h2 section headings, which are themselves
   `position: sticky; top: 0` and would collide. See has_sticky_sections(). */
body.sticky-nav .sitehead-wrap { position: sticky; top: 0; z-index: 50; background: var(--bg); }
/* Hero greeting. Sentence case, so the tracking goes slightly negative;
   the +.6px it had was there to open up all-caps. */
.intro-greeting { font-size: 42px; font-weight: 800; line-height: 1.1; letter-spacing: -.5px; margin: 0 0 18px; padding: 0; border: none; }
.navrow { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 18px 34px; }
/* Wordmark: the hero treatment at nav scale. Text rather than an image so it
   stays crisp at any density and remains selectable and translatable. */
.wordmark { display: inline-flex; align-items: center; gap: 10px;
  font-size: 20px; font-weight: 800; letter-spacing: .4px; text-transform: uppercase;
  color: var(--fg); text-decoration: none; line-height: 1; white-space: nowrap; margin-right: 8px; }
/* The planet lifted from the hero render, mirrored so its ring tilts the other
   way. Decorative only: the wordmark text carries the meaning. */
.wm-planet { width: 31px; height: auto; display: block; flex: none; }
.wordmark:hover { text-decoration: none; color: var(--fg); opacity: .72; }
.tabs { display: flex; flex-wrap: wrap; gap: 34px; margin: 0; border-bottom: none; }
.tabs a { padding: 0; margin: 0; font-size: 15px; font-weight: 500; letter-spacing: 1.1px; text-transform: uppercase; color: #aaa; border-bottom: none; text-decoration: none; transition: color .14s ease; }
.tabs a:hover { text-decoration: none; color: var(--fg); }
.tabs a.active { color: var(--fg); border-bottom: none; }
.crumbs { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
.crumbs a { color: var(--muted); }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { line-height: 1.25; }
h1 { font-size: 32px; margin: 0 0 8px; }
/* Section rule bleeds 24px into the gutters so a section break reads louder than a paragraph break.
   Sticky: each h2 pins only within its own .sec wrapper, so headings never stack at top:0. */
h2 { font-size: 24px; letter-spacing: -0.35px; margin: 52px -24px 0; padding: 19px 24px 15px;
  position: sticky; top: 0; z-index: 5; background: var(--bg); }
h2::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: var(--rule); }
.sec:first-of-type h2 { margin-top: 34px; padding-top: 0; }
.sec:first-of-type h2::before { display: none; }
h3 { font-size: 17px; margin: 28px 0 8px; }
h3 .sub { font-weight: 400; }
h4 { font-size: 15px; margin: 20px 0 6px; }
p { margin: 12px 0; }
em { color: var(--muted); }
hr { border: none; border-top: 1px solid var(--rule); margin: 32px 0; }
ul, ol { padding-left: 22px; }
li { margin: 4px 0; }
blockquote {
  background: var(--quote);
  border-left: 3px solid var(--quote-bar);
  margin: 16px 0;
  padding: 12px 18px;
  border-radius: 0 6px 6px 0;
  color: #2a2a2a;
}
blockquote p { margin: 6px 0; }
table { border-collapse: collapse; width: 100%; margin: 16px 0; font-size: 14px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { background: #fafafa; font-weight: 600; }
table.tiers { table-layout: fixed; }
table.tiers col:nth-child(1) { width: 22%; }
table.tiers col:nth-child(2) { width: 78%; }
table.tiers td ul { margin: 0; padding-left: 1.1em; }
table.tiers td li { margin: 0 0 2px; }
table.tiers td li:last-child { margin-bottom: 0; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; background: var(--code-bg); padding: 2px 5px; border-radius: 3px; }
pre code { display: block; padding: 12px; overflow-x: auto; }
img { max-width: 100%; height: auto; border-radius: 4px; margin: 12px 0; }
.idx ul { list-style: none; padding: 0; }
.idx li { padding: 12px 0; border-bottom: 1px solid var(--rule); }
.idx li:last-child { border: none; }
/* Version toggle (AI original vs human refinement) */
.vtoggle { display: inline-flex; border: 1px solid var(--rule); border-radius: 9px; padding: 3px; gap: 3px; margin: 0 0 26px; background: #f6f7f8; }
.vtoggle button { font: inherit; font-size: 13px; font-weight: 600; padding: 7px 15px; border: none; background: none; border-radius: 6px; color: var(--muted); cursor: pointer; transition: all .12s ease; }
.vtoggle button:hover { color: var(--fg); }
.vtoggle button.on { background: var(--bg); color: var(--link); box-shadow: 0 1px 3px rgba(0,0,0,.10); }
/* Title card — section 1 holds the opening view, so section 2 needs a scroll */
.title-card { min-height: 26vh; display: flex; flex-direction: column; justify-content: center; }
.title-card h1 { font-size: 46px; margin: 0 0 18px; letter-spacing: -0.6px; }
h1.with-mark { display: flex; align-items: center; gap: 15px; }
h1.with-mark img { width: 40px; height: 40px; border-radius: 8px; flex: 0 0 auto; }
.lede { font-size: 20px; line-height: 1.5; color: var(--muted); margin: 0; max-width: 640px; }
/* Hero bleeds to the shell edges, matching the section rule, so it reads as the page's anchor image.
   The laptop mockup carries its own frame and shadow, so .hero adds no chrome of its own. */
.hero { margin: 24px -24px 34px; }
.hero img { display: block; width: 100%; margin: 0; cursor: zoom-in; }
/* Fact bar — role / timeline */
.factbar { display: flex; flex-wrap: wrap; gap: 40px; margin: 0 0 34px; padding: 20px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.fact { flex: 1 1 0; min-width: 150px; display: flex; flex-direction: column; gap: 5px; }
.fact .k { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
.fact .v { font-size: 15px; color: var(--fg); }
/* borderless variant — for use inside a section, where rules read as breaks */
.factbar.bare { border: none; padding: 0; margin: 18px 0 22px; }
/* Hover/focus tooltip — used for the estimated user count */
.tip { position: relative; cursor: help; }
.tip .tip-t { border-bottom: 1px dotted #9aa3ab; }
.tip .tip-i { display: inline-block; width: 13px; height: 13px; line-height: 12px; margin-left: 5px;
  border: 1px solid #9aa3ab; border-radius: 50%; font-size: 9.5px; font-weight: 700; font-style: normal;
  font-family: Georgia, serif; text-align: center; color: #8d969e; vertical-align: 1px; }
.tip:hover .tip-i, .tip:focus .tip-i, .tip:focus-within .tip-i { border-color: var(--fg); color: var(--fg); }
.tip .tip-b { visibility: hidden; opacity: 0; position: absolute; left: 0; top: calc(100% + 8px); z-index: 40;
  width: 300px; background: #22282d; color: #eef1f3; font-size: 12.5px; line-height: 1.5; font-weight: 400;
  text-transform: none; letter-spacing: 0; padding: 10px 13px; border-radius: 7px;
  box-shadow: 0 6px 20px rgba(0,0,0,.22); transition: opacity .14s ease; }
.tip .tip-b::before { content: ''; position: absolute; left: 14px; top: -5px; width: 10px; height: 10px; background: #22282d; transform: rotate(45deg); }
.tip:hover .tip-b, .tip:focus .tip-b, .tip:focus-within .tip-b { visibility: visible; opacity: 1; }
/* last fact sits at the right edge — anchor its tooltip right so it can't overflow */
.fact:last-child .tip-b { left: auto; right: 0; }
.fact:last-child .tip-b::before { left: auto; right: 14px; }
/* Below ~560px the fact bar wraps and the last fact jumps to the left margin, so a
   right-anchored 300px tooltip hangs off the left edge. Anchor left instead. */
@media (max-width: 560px) {
  .tip .tip-b, .fact:last-child .tip-b { left: 0; right: auto; width: min(300px, calc(100vw - 48px)); }
  .tip .tip-b::before, .fact:last-child .tip-b::before { left: 14px; right: auto; }
}
/* no label — the value stands alone */
.fact.nolabel .k { display: none; }
/* Phase chip — signals the focus of each section */
.chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 5px; letter-spacing: .1px; margin: -4px 0 16px; }
.chip-research { background: #e6f5e6; color: #1a6b37; }
.chip-design { background: #fdeaea; color: #a32a2e; }
.chip-align { background: #e7f0fa; color: #0a4e96; }
/* Phase header framework — title · [chip + timeline on one line] · what */
.phead { display: flex; align-items: center; flex-wrap: wrap; gap: 13px; margin: 0 0 11px; }
.phead .chip { margin: 0; }
.phead .when { font-size: 13.5px; color: var(--muted); }
.what { font-size: 15.5px; line-height: 1.55; color: #3a3a3a; margin: 0; }
.todo { color: #a8a8a8; font-style: italic; }
/* Punch line — short declarative statement that carries a section */
.punch { font-size: 19px; line-height: 1.45; font-weight: 600; color: var(--fg); margin: 26px 0 18px; letter-spacing: -0.2px; }
.punch.sm { font-size: 17px; letter-spacing: 0; }
.qt { font-style: italic; color: #8a8a8a; }
.sidenote { font-size: 15px; line-height: 1.62; color: #8a8a8a; border-left: 2px solid var(--rule); padding-left: 15px; margin: 20px 0 0; }
.sidenote b { color: var(--fg); font-weight: 600; }
/* Role chips */
.roles { display: flex; flex-wrap: wrap; gap: 9px; margin: 18px 0 8px; }
.role { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--rule); border-radius: 999px; padding: 8px 16px 8px 13px; font-size: 14px; background: #fff; }
.role .e { font-size: 22px; line-height: 1; }
.role .d { color: var(--muted); font-size: 13px; }
/* Process flow */
.flow { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0 10px; }
.flow .step { flex: 1 1 120px; background: #f6f8fa; border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; }
.flow .step .n { display: block; font-size: 11px; font-weight: 700; color: var(--link); letter-spacing: .5px; margin-bottom: 5px; }
.flow .step .t { display: block; font-size: 13.5px; font-weight: 600; line-height: 1.35; }
.flow .step .sub { display: block; font-size: 12px; font-weight: 400; color: var(--muted); margin-top: 6px; line-height: 1.5; }
/* .icons — emoji markers instead of 01/02 numbers */
.flow.icons .step .n { font-size: 21px; line-height: 1; margin-bottom: 8px; }
/* Diagnostic block — symptom = cost equations beside the user's unspoken questions */
.diag { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 32px; margin: -8px 0 6px; }
.diag .eq:first-child, .diag .says p:first-child { margin-top: 0; }
.diag .eqs { flex: 1.3 1 370px; }
.diag .eq { font-size: 16px; font-weight: 600; margin: 14px 0; letter-spacing: -0.1px; white-space: nowrap; }
.diag .eq .ic { font-size: 15px; margin-right: 9px; }
.diag .eq .up { color: #e5484d; font-weight: 700; }
.diag .says { flex: 1 1 240px; margin: 0; }
.diag .says p { font-size: 16px; font-style: italic; color: #5a5a5a; margin: 14px 0; }
.imgnote { font-size: 12.5px; color: #a0a0a0; margin: 8px 0 0; }
/* Roadmap timeline — the two-act table of contents */
.tl { margin: 22px 0 4px; }
.tl-act { margin: 0 0 38px; }
.tl-act:last-child { margin-bottom: 8px; }
.tl-act .act-h { font-size: 20px; font-weight: 700; margin: 0 0 3px; letter-spacing: -0.3px; }
.tl-act .act-m { font-size: 13px; color: var(--muted); margin: 0 0 16px; }
.tl-items { position: relative; margin: 0 0 0 7px; }
.tl-item { position: relative; padding: 0 0 22px 30px; border-left: 2px solid #1a1a1a; }
.tl-item::before { content: ''; position: absolute; left: -2px; top: 10px; width: 15px; height: 2px; background: #1a1a1a; }
/* line starts at the first tick and stops at the last one */
.tl-item:first-child { border-left-color: transparent; }
.tl-item:first-child::after { content: ''; position: absolute; left: -2px; top: 10px; bottom: 0; width: 2px; background: #1a1a1a; }
.tl-item:last-child { padding-bottom: 0; border-left-color: transparent; }
.tl-item:last-child::after { content: ''; position: absolute; left: -2px; top: 0; height: 12px; width: 2px; background: #1a1a1a; }
.tl-item .n { font-size: 15.5px; font-weight: 600; padding: 3px 9px; border-radius: 5px; }
.tl-item .d { display: block; font-size: 13px; color: var(--muted); margin-top: 6px; padding-left: 9px; }
.tl-foot { font-size: 12.5px; color: #a0a0a0; margin: 14px 0 0 37px; }
.tl + p { margin-top: 40px; }
/* UX method cards */
.methods { display: flex; flex-wrap: wrap; gap: 12px; margin: 20px 0 10px; }
.method { flex: 1 1 195px; border: 1px solid var(--rule); border-radius: 10px; padding: 15px 18px 16px; background: #fff; }
.method .e { font-size: 16px; margin-right: 8px; }
.method .t { font-size: 15.5px; font-weight: 700; }
.method .s { display: block; font-size: 13px; color: var(--muted); line-height: 1.5; margin-top: 7px; }
/* Research question list */
.qs { list-style: none; padding: 0; margin: 14px 0 4px; }
.qs li { font-size: 17.5px; color: #4a4a4a; line-height: 1.45; margin: 10px 0; padding-left: 24px; position: relative; }
.qs li::before { content: '—'; position: absolute; left: 0; color: #c4c4c4; }
/* Method list — compact two-column activity inventory */
.mlabel { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 24px 0 12px; }
.mlist { list-style: none; padding: 0; margin: 0; column-count: 2; column-gap: 18px; counter-reset: ml; }
.mlist.one { column-count: 1; }
.mlist li { display: flex; gap: 5px; font-size: 13px; line-height: 1.5; margin: 0 0 10px; break-inside: avoid; }
.mlist li::before { counter-increment: ml; content: counter(ml, decimal-leading-zero); flex: 0 0 auto; font-size: 10.5px; font-weight: 700; color: #c2c2c2; letter-spacing: 0; padding-top: 2px; }
.mlist .t { font-weight: 600; }
.mlist .s { color: var(--muted); }
/* Finding groups — column flow so short cards don't leave dead space */
.findings { column-count: 2; column-gap: 12px; margin: 16px 0 16px; }
.fgroup { border: 1px solid var(--rule); border-radius: 10px; padding: 14px 18px 15px; background: #fff; break-inside: avoid; margin: 0 0 12px; }
.fgroup .h { font-size: 13.5px; font-weight: 700; margin: 0 0 9px; }
.fgroup ul { margin: 0; padding-left: 16px; }
.fgroup li { font-size: 13.5px; line-height: 1.5; margin: 6px 0; color: #3d3d3d; }
.fgroup.wide { margin: 0 0 12px; }
.fgroup.wide ul { column-count: 2; column-gap: 26px; }
.fgroup.wide li { break-inside: avoid; }
/* exactly three peers read better side by side than balanced across two columns */
.findings.three { column-count: 3; }
@media (max-width: 860px) { .findings.three { column-count: 2; } }
@media (max-width: 620px) { .findings.three { column-count: 1; } }
/* .even — equal-height cards in one row; grid, not column-flow */
.findings.even { column-count: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.findings.even .fgroup { margin: 0; }
.fgroup p.t { font-size: 13.5px; line-height: 1.5; margin: 0; color: #3d3d3d; }
@media (max-width: 860px) { .findings.even { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 620px) { .findings.even { grid-template-columns: 1fr; } }
/* Takeaway summary — the few points that must land */
.takeaways { list-style: none; padding: 0; margin: 16px 0 0; counter-reset: tk; }
.takeaways li { font-size: 15px; line-height: 1.6; margin: 0 0 14px; color: #3a3a3a; position: relative; padding-left: 38px; }
.takeaways li::before { counter-increment: tk; content: counter(tk, decimal-leading-zero); position: absolute; left: 0; top: 2px; font-size: 13px; font-weight: 700; color: #bdbdbd; letter-spacing: .5px; }
.takeaways li b { color: var(--fg); }
.takeaways.goals { margin: 10px 0 0; }
.takeaways.goals li { margin: 0 0 7px; }
/* A list split around an inserted quote keeps one running count. */
.takeaways.cont { counter-reset: none; }
.takeaways.steps li { padding-left: 23px; text-indent: -23px; }
.takeaways.steps li::before { content: none; }
/* .tools — right-aligned tool column, so the fragmentation is scannable */
.takeaways.tools li { padding-right: 160px; }
.takeaways.tools li em { position: absolute; right: 0; top: 3px; width: 150px; text-align: right; font-style: normal; font-size: 12.5px; color: var(--muted); }
@media (max-width: 760px) { .takeaways.tools li { padding-right: 0; } .takeaways.tools li em { position: static; display: block; width: auto; text-align: left; margin-top: 2px; } }
h2 + .mlabel { margin-top: 14px; }
/* Disclosure */
.det { margin: 10px 0 0; }
.det > summary { cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 600; color: var(--link); padding: 2px 0; list-style: none; }
.det > summary::-webkit-details-marker { display: none; }
.det > summary::before { content: '▸'; font-size: 10px; }
.det[open] > summary::before { content: '▾'; }
.det > summary:hover { text-decoration: underline; }
.det[open] > summary { margin-bottom: 2px; }
/* Decision / outcome callout */
.decision { border-left: 3px solid var(--link); background: #f2f7fc; border-radius: 0 8px 8px 0; padding: 16px 22px 17px; margin: 16px 0 0; }
.decision p { margin: 0; font-size: 15px; line-height: 1.6; }
.decision .nxt { margin-top: 13px; font-size: 14px; font-weight: 600; color: var(--link); }
/* Study detail cards (inside the methods disclosure) */
.studies { margin: 14px 0 0; }
.study { display: flex; flex-wrap: wrap; gap: 22px; background: #f7f8f9; border-radius: 12px; padding: 18px 22px 20px; margin: 0 0 12px; }
.study:last-child { margin-bottom: 0; }
.study-txt { flex: 1 1 320px; }
.study-txt img { width: 100%; border-radius: 6px; margin: 12px 0 0; border: 1px solid #e3e3e3; cursor: zoom-in; }
.study-img { flex: 0 1 290px; align-self: flex-start; }
.study-img img { width: 100%; border-radius: 6px; margin: 0; border: 1px solid #e3e3e3; }
.study-img img + img { margin-top: 10px; }
img[data-zoom] { cursor: zoom-in; }
/* Lightbox */
.lb { position: fixed; inset: 0; background: rgba(12,12,14,.93); display: none; align-items: center; justify-content: center; z-index: 999; cursor: zoom-out; padding: 24px; }
.lb.on { display: flex; }
.lb img { max-width: 97vw; max-height: 94vh; width: auto; height: auto; object-fit: contain; border-radius: 4px; background: #fff; cursor: zoom-out; }
.lb .x { position: absolute; top: 18px; right: 24px; color: #fff; font-size: 26px; line-height: 1; opacity: .75; background: none; border: 0; padding: 12px; cursor: pointer; }
.lb .x:hover, .lb .x:focus-visible { opacity: 1; }
.lb.has-gallery { flex-direction: column; gap: 16px; padding-top: 64px; }
.lb.has-gallery img { max-width: 100%; max-height: calc(100vh - 160px); min-height: 0; }
.lb-nav { flex-shrink: 0; width: 100%; display: flex; align-items: center;
  justify-content: center; gap: 16px; cursor: default; }
.lb-nav[hidden] { display: none; }
.lb-nav button { flex-shrink: 0; width: 44px; height: 44px; border: 1px solid #a4a4a4;
  border-radius: 50%; background: #252527; color: #fff; font-size: 26px; cursor: pointer; }
.lb-nav button:disabled { opacity: .35; cursor: default; }
.lb button:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
.lb-status { max-width: 36em; color: #fff; font-size: 14px; line-height: 1.4;
  text-align: center; margin: 0; }
/* Feature carousel */
.carousel { margin: 18px 0 6px; }
.car-track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; scrollbar-width: none; -ms-overflow-style: none; }
.car-track::-webkit-scrollbar { display: none; }
.car-slide { flex: 0 0 100%; scroll-snap-align: center; margin: 0; padding: 0 1px; }

/* Section rail — sits in the left gutter, needs >=1280px. Active state uses weight/opacity,

/* Touch devices only: enlarge tap targets to meet WCAG 2.5.8. Scoped to
   `pointer: coarse` so mouse/desktop rendering is untouched. Where the visual
   size matters (carousel dots), the hit area is expanded with a transparent
   pseudo-element rather than by resizing the control. */
@media (pointer: coarse) {
  .tabs { gap: 26px 30px; }
  .tabs a { padding: 10px 0; }
  /* 14.5px text is ~22px tall; 6px padding clears the 24px tap target without
     the boxes meeting, since the flex row gap is 12px. */
  .about-links a { padding: 6px 0; }
  .car-dots { gap: 20px; }
  .car-dot { position: relative; }
  .car-dot::after { content: ""; position: absolute; inset: -13px -9px; }
  .car-btn { width: 40px; height: 40px; font-size: 18px; }
  .proto-ctl { padding: 9px 11px; }
  .cbtn { padding: 13px 22px; }
  .arch-btn { padding: 15px 16px; }
}

/* ---------- Mobile menu ----------
   Below 760px the five links no longer fit beside the wordmark (they need
   ~643px on their own), so they collapse behind a toggle and open as a
   full-screen panel. This block sits after the `pointer: coarse` rules above
   on purpose: both set `.tabs`, and on a touch phone this one has to win. */
.navtoggle { display: none; background: none; border: 0; padding: 10px; margin: -10px;
  cursor: pointer; flex-direction: column; gap: 5px; z-index: 101; }
.navtoggle span { display: block; width: 23px; height: 2px; background: var(--fg); border-radius: 2px;
  transition: transform .22s ease, opacity .16s ease; }

@media (max-width: 760px) {
  .navtoggle { display: inline-flex; }
  /* flex-wrap must be reset: the base .tabs rule sets `wrap`, and with
     column direction a short viewport pushes the last link into a second
     column instead of scrolling. */
  .tabs { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: none;
    flex-direction: column; flex-wrap: nowrap; justify-content: center; align-items: center;
    gap: 30px; margin: 0; padding: 72px 24px; overflow-y: auto; }
  .tabs a { font-size: 19px; letter-spacing: 1.7px; padding: 10px 14px; }
  body.nav-open { overflow: hidden; }
  body.nav-open .tabs { display: flex; }
  body.nav-open .navtoggle { position: fixed; top: 30px; right: 24px; }
  /* bars are 2px with a 5px gap, so each end bar travels 7px to meet in the middle */
  body.nav-open .navtoggle span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  body.nav-open .navtoggle span:nth-child(2) { opacity: 0; }
  body.nav-open .navtoggle span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
}

/* Full-bleed hero. The artwork's left third is flat cream, so the copy sits in
   that zone and the band's background-color continues it seamlessly to the
   viewport edge. Below 1260px the art can no longer clear the copy, so the two
   stack instead of overlapping.
   The 105% size overfills the band rather than letterboxing it, which also
   hides the seam where the image meets the band colour. Anchored to `bottom`,
   not `center`: the artwork runs flush to the bottom edge of the render with
   no clear space, while the top third is empty, so the whole overflow has to
   be taken off the top or the desk gets clipped. 110% is the ceiling: past
   that the copy starts overlapping the artwork at 1265px, the narrowest width
   that still uses this overlapping layout. */
.hero-band { margin: -22px calc(50% - 50vw) 64px; padding: 76px 0; background: #fceee3 url("/images/hero-art.jpg") right bottom / auto 105% no-repeat; display: flex; align-items: center; min-height: clamp(540px, 40vw, 920px); }

.work { display: flex; flex-direction: column; gap: 96px; margin: 0 0 120px; }
.wcard { display: grid; grid-template-columns: 1.08fr 1fr; border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; text-decoration: none; color: inherit; background: var(--bg); transition: box-shadow .22s ease, transform .22s ease, border-color .22s ease; }
.wcard:hover { border-color: #d4d4d4; box-shadow: 0 12px 34px rgba(0,0,0,.10); transform: translateY(-3px); }
.wcard-alt { grid-template-columns: 1fr 1.08fr; }
.wcard-alt .wcard-img { order: 2; }
.wcard-img { overflow: hidden; background: #f1f3f5; }
.wcard-img img { display: block; width: 100%; height: 100%; aspect-ratio: 16 / 10; object-fit: cover; margin: 0; transition: transform .5s ease; }
.wcard:hover .wcard-img img { transform: scale(1.045); }
.wcard-body { padding: 30px 32px; display: flex; flex-direction: column; justify-content: center; }
.wcard-meta { font-size: 11.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.wcard-body h3 { font-size: 23px; line-height: 1.22; letter-spacing: -.3px; margin: 0 0 10px; border: none; padding: 0; }
.wcard-line { font-size: 15px; line-height: 1.55; color: #3d3d3d; margin: 0 0 16px; }
.wcard-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px; }
.wtag { font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 5px; background: #f1f3f5; color: #51585f; }
.wcard-cta { font-size: 13.5px; font-weight: 600; color: var(--link); margin-top: auto; }
.wcard:hover .wcard-cta { text-decoration: underline; }

.about { position: relative; display: grid; grid-template-columns: 1fr 330px; gap: 48px; align-items: start; margin: 0 0 72px; }
.about p { font-size: 15.5px; line-height: 1.68; }
.about p:first-child { margin-top: 0; }
.about-photo img { display: block; width: 100%; border-radius: 14px; margin: 0; }
.about-facts { margin: 20px 0 0; padding: 18px 20px; background: #f8f9fa; border-radius: 12px; }
.about-facts p { margin: 0 0 8px; font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.about-facts ul { margin: 0; padding-left: 18px; }
.about-facts li { font-size: 14px; line-height: 1.5; margin: 0 0 5px; }
/* Grouped bullets. Four short scannable lists replace the five prose
   paragraphs the page used to open with. Two columns on desktop so the page
   does not become one long ribbon; the label matches Skills and Tools. */
.about-groups { display: grid; grid-template-columns: 1fr 1fr; gap: 26px 44px; margin: 30px 0 0; }
.about-group p { margin: 0 0 10px; font-size: 11.5px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--muted); }
.about-group ul { margin: 0; padding-left: 18px; }
.about-group li { font-size: 14.5px; line-height: 1.56; margin: 0 0 7px; }
.about-group li:last-child { margin-bottom: 0; }
@media (max-width: 620px) { .about-groups { grid-template-columns: 1fr; gap: 24px; } }
/* Skills, mirrored from the résumé's Core Skills. Uses the same neutral pill as
   the work-card tags so it reads as the site's existing tag language, and the
   same label style as Fast facts. */
.about-skills { margin: 28px 0 0; }
.about-skills p { margin: 0 0 11px; font-size: 11.5px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--muted); }
.about-skills ul { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; }
.about-skills li { font-size: 13px; font-weight: 600; padding: 5px 11px; border-radius: 6px;
  background: #f1f3f5; color: #51585f; margin: 0; line-height: 1.4; }
/* Social links: they live with the bio now, so they carry labels rather than
   being icon-only the way they were in the header. */
.about-links { display: flex; flex-wrap: wrap; gap: 12px 26px; margin: 28px 0 0; }
.about-links a { display: inline-flex; align-items: center; gap: 8px; font-size: 14.5px;
  color: var(--muted); text-decoration: none; transition: color .14s ease; }
.about-links a:hover { color: var(--fg); }
.about-links svg { display: block; width: 16px; height: 16px; fill: currentColor; flex: none; }
/* Objects lifted from the hero render, scattered in the margins beside About.
   Purely decorative: aria-hidden and pointer-events none, so they are invisible
   to assistive tech and never intercept a click. They sit outside .about, so
   they only appear once the viewport is wide enough to hold them without
   causing a horizontal scrollbar. */
.deco { position: absolute; display: block; pointer-events: none; user-select: none; z-index: 0; }
.deco img { display: block; width: 100%; height: auto; margin: 0; animation: decoFloat 7s ease-in-out infinite; }
.deco-rocket { width: 70px; top: -22px; right: -96px; transform: rotate(-10deg); }
.deco-cross  { width: 44px; top: 76px; left: -92px; transform: rotate(10deg); }
.deco-ring   { width: 58px; top: 330px; left: -96px; transform: rotate(-7deg); }
.deco-cross img { animation-delay: -2.3s; }
.deco-ring img  { animation-delay: -4.6s; }
@keyframes decoFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
@media (prefers-reduced-motion: reduce) { .deco img { animation: none; } }
/* Below 1280px the page margins are too narrow to hold anything (the content
   box is 1072px, so a 1150px viewport leaves only 39px a side). Rather than
   hide the objects there, they regroup into the empty space under Fast Facts,
   which exists at every desktop width because the text column is always the
   taller of the two. */
@media (max-width: 1279px) {
  .deco { top: auto; left: auto; bottom: 0; }
  .deco-rocket { width: 54px; right: 208px; bottom: 16px; transform: rotate(-10deg); }
  .deco-ring   { width: 44px; right: 120px; bottom: 0; transform: rotate(-7deg); }
  .deco-cross  { width: 36px; right: 42px; bottom: 26px; transform: rotate(10deg); }
}
/* Single column: the right-hand column is gone, so there is nowhere to put them. */
@media (max-width: 880px) { .deco { display: none; } }

.contact { margin: 0 0 40px; }
.contact-lede { font-size: 17px; line-height: 1.6; color: #3a3a3a; margin: 0 0 22px; max-width: 560px; }
.cbtns { display: flex; flex-wrap: wrap; gap: 10px; }
.cbtn { display: inline-flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 600; padding: 11px 20px; border-radius: 9px; border: 1px solid var(--rule); background: var(--bg); color: var(--fg); text-decoration: none; transition: background .15s ease, border-color .15s ease; }
.cbtn:hover { background: #f6f7f8; border-color: #d4d4d4; }
.cbtn-primary { background: var(--link); border-color: var(--link); color: #fff; }
.cbtn-primary:hover { background: #085aad; border-color: #085aad; }

@media (max-width: 1260px) {
  .hero-band { display: block; min-height: 0; padding: 60px 0 0; background-image: none; }
  .hero-copy { max-width: 620px; }
  .hero-art { display: block; width: 100%; margin: 44px 0 0; }
}
@media (max-width: 880px) {
  .wcard, .wcard-alt { grid-template-columns: 1fr; }
  .wcard-alt .wcard-img { order: 0; }
  /* Stacked cards are already tall, so the desktop gap would read as a break
     between sections rather than spacing within one. */
  .work { gap: 64px; margin: 0 0 88px; }
  .about { grid-template-columns: 1fr; gap: 30px; }
  .about-photo { max-width: 300px; }
  .intro-greeting { font-size: 34px; }
  .intro-lede { font-size: 20px; }
}/* ---------- Presentation decks ----------
   Slides are authored against a fixed 1280x720 stage and the whole stage is
   scaled by one root font-size, so every slide is pixel-identical on a laptop,
   a projector and in the PDF export. Nothing reflows, nothing drifts.
   Everything inside a slide is sized in em, so one number controls the lot. */
.shell:has(.deck) { max-width: none; padding: 0; margin: 0; }
body:has(.deck) { overflow: hidden; background: #0f1419; }
/* Every piece of site chrome is hidden in a deck, on screen and in print. */
body:has(.deck) .sitehead-wrap,
body:has(.deck) .crumbs,
body:has(.deck) .foot,
body:has(.deck) .rail { display: none; }

.deck { position: fixed; inset: 0; display: flex; align-items: center;
  justify-content: center; background: #0f1419; }

/* 16:9 box that fits the viewport; 1em == 16px when the stage is 1280 wide. */
.slide { position: absolute; box-sizing: border-box; overflow: hidden;
  --deck-media-height: 24em;
  width: min(100vw, 177.7778vh); height: min(56.25vw, 100vh);
  font-size: calc(min(100vw, 177.7778vh) * 0.0125);
  background: #fff; color: var(--fg);
  padding: 4.5em 5em; opacity: 0; visibility: hidden;
  transition: opacity .18s ease; }
.slide.on { opacity: 1; visibility: visible; }

/* Shared presentation hierarchy: cover, headline, card title, body and caption. */
.slide .s-kick { font-size: .8125em; line-height: 1.4; font-weight: 700; letter-spacing: .14em;
  text-transform: uppercase; color: var(--muted); margin: 0 0 1.25em; }
.slide h2 { font-size: 3em; line-height: 1.08; letter-spacing: -.02em;
  font-weight: 800; margin: 0; padding: 0; border: none; position: static; text-wrap: balance; }
/* The site draws a hairline above every h2. A slide is not an article section. */
.slide h2::before, .slide h3::before { display: none; content: none; }
.slide h3 { font-size: 2em; line-height: 1.18; letter-spacing: -.01em;
  font-weight: 700; margin: 0 0 .6em; padding: 0; border: none; text-wrap: pretty; }
.slide .s-nowrap { white-space: nowrap; }
.slide p { font-size: 1.125em; line-height: 1.5; margin: .85em 0 0; max-width: 34em; }
.slide .s-lead { font-size: 1.5em; line-height: 1.45; color: #3a3a3a; max-width: 28em; }
.slide .s-note { font-size: .875em; color: var(--muted); }

/* Layouts. Title, split and full-bleed cover every slide in both decks. */
.slide.s-title { display: flex; flex-direction: column; justify-content: flex-start;
  gap: 1em; padding-top: 8em; }
.slide.s-title > p { max-width: 100%; }
.slide.s-title > ul { max-width: 72%; }
.slide.s-title > ul.s-list { max-width: 100%; }
.slide.s-title > .s-lead { max-width: 100%; }
.slide .flow { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: .75em; }
.slide .flow .step { padding: 1em; border-radius: .5em; }
.slide .flow .step .n { font-size: .875em; line-height: 1.4;
  letter-spacing: .04em; margin-bottom: .5em; }
.slide .flow .step .t { font-size: 1.25em; line-height: 1.3; }
.slide .flow .step .sub { font-size: 1em; line-height: 1.5; margin-top: .5em; }
.slide .roles { gap: .5em; }
.slide .role { gap: .5em; padding: .5em .875em; font-size: 1em;
  line-height: 1.4; }
.slide .role .e { font-size: 1.5em; }
/* Numbered rollout milestones, with quiet numerals and a clear reading rhythm. */
.slide.s-title > ol.s-rollout { max-width: 100%; }
.s-rollout { display: grid; gap: 1.35em; margin: 1.25em 0 0; padding: 0;
  list-style: none; }
.s-rollout li { display: grid; grid-template-columns: 2.2em minmax(0, 1fr);
  align-items: start; gap: .65em; margin: 0; }
.s-rollout .n { color: #b8bec4; font-size: 1.25em; font-weight: 700;
  line-height: 1.4; }
.slide .s-rollout .copy { max-width: none; margin: 0; font-size: 1.25em;
  line-height: 1.45; color: #3a3a3a; }
.s-rollout .copy b { color: var(--fg); }
.slide.s-title > .s-validation-grid { max-width: 100%; }
.s-validation-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1.25em; margin: 1em 0 0; }
.s-validation-phase { padding: 1.25em; background: #f4f6f7; border-radius: .6em; }
.slide .s-validation-phase h4 { margin: 0; font-size: 1.25em; line-height: 1.3; }
.slide .s-validation-phase ul.s-list { margin-top: .9em; }
.slide .s-validation-phase ul.s-list li { font-size: 1em; margin-bottom: .55em; }
.slide p.s-validation-note { max-width: 100%; margin-top: .85em; font-size: .875em; color: var(--muted); }
.slide.s-title > .s-outcomes { max-width: 100%; }
.s-outcomes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1.25em; width: 100%; margin: 1.1em 0 0; align-items: stretch; }
.s-outcome-card { min-width: 0; padding: 1.25em; background: #f4f6f7;
  border-radius: .6em; }
.slide .s-outcome-card .s-outcome-label { margin: 0 0 .85em; font-size: .75em;
  line-height: 1.3; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted); }
.slide .s-outcome-card h4, .slide .s-outcome-card .s-outcome-stat {
  margin: 0; font-size: 1.25em; font-weight: 700; line-height: 1.3; }
.slide .s-outcome-card .s-outcome-stat { display: block; }
.slide .s-outcome-card > p:not(.s-outcome-label) { margin: .75em 0 0; max-width: none;
  font-size: 1em; line-height: 1.5; }
.slide .s-outcome-card .s-impact-caveat { color: var(--muted); font-size: .78em;
  line-height: 1.4; margin-top: -.35em; }
.slide.s-title > .s-learning-grid { max-width: 100%; }
.s-learning-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1.25em; width: 100%; margin: 1em 0 0; }
.s-learning-card { padding: 1.25em; background: #f4f6f7; border-radius: .6em; }
.slide .s-learning-card h4 { margin: 0; font-size: 1.25em; line-height: 1.3; }
.slide .s-learning-card p { max-width: none; margin-top: .7em; font-size: 1em; line-height: 1.5; }
.slide p.s-learning-takeaway { max-width: 100%; margin-top: 1.1em; font-size: 1.125em;
  font-weight: 600; color: #3a3a3a; }

/* Cards, for when a list is really a set of separate things rather than a
   sequence. Reads as a diagram instead of prose. */
.s-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.25em;
  margin: 1.5em 0 0; padding: 0; list-style: none; max-width: 100%; }
.s-cards.four { grid-template-columns: repeat(4, 1fr); }
.s-cards li { margin: 0; padding: 1.25em; background: #f4f6f7;
  border-radius: .6em; }
.s-cards .t { display: block; font-size: 1.25em; font-weight: 700; line-height: 1.3;
  margin: 0 0 .35em; }
.s-cards.four .t, .s-recipe .t { min-height: 2.6em; }
.slide h4, .s-cards .t { text-wrap: balance; }
/* Vendor marks on the tool cards. Real logos, set to a common height with
   automatic width, because the available marks mix square icons with a
   wordmark and forcing them into equal boxes would distort them. */
.s-cards .mk { display: flex; align-items: center; gap: .7em; height: 2.05em;
  margin: 0 0 .8em; }
.s-cards .mk img { height: 2.05em; width: auto; display: block; }
.s-cards .mk i { font-style: normal; display: flex; align-items: center;
  justify-content: center; width: 2.46em; height: 2.46em; border-radius: .35em;
  font-size: .8125em; font-weight: 700; background: #e0e4e7; color: #3d454c; }
.s-cards .d { display: block; font-size: 1em; line-height: 1.5; color: #4a5056; }
.s-cards.s-recipe { grid-template-columns: repeat(5, minmax(0, 1fr)); width: 100%; }
.s-recipe .s-recipe-icon { display: block; font-size: 2.5em; line-height: 1.2;
  margin-bottom: .5em; }
/* Cards are a diagram, so they take the full stage rather than the text measure. */
.slide.s-title > ul.s-cards { max-width: 100%; }
/* Cycle timeline. Bars preserve the phases' relative timing and overlap;
   each row names the tools and gives its duration without showing dates. */
.s-tl { margin: .7em 0 0; width: 100%; }
.s-tl .r { display: grid; grid-template-columns: 24em minmax(0, 1fr) 5em;
  align-items: center; gap: .9em; margin: 0 0 .48em; }
.s-tl .phase { font-size: 1em; font-weight: 600; line-height: 1.25; color: #2b3137; }
.s-tl .trk { position: relative; height: 1.15em; background: #eef1f3;
  border-radius: .3em; }
.s-tl .fil { position: absolute; top: 0; bottom: 0; background: #bccbd7;
  min-width: .35em; border-radius: .3em; }
.s-tl .fil.hot { background: var(--link); }
.s-tl .dur { font-size: .875em; font-weight: 600; color: #3a3a3a; white-space: nowrap; }
.s-workstreams .r { grid-template-columns: 16em minmax(0, 1fr) 18em;
  gap: .75em; margin-bottom: .625em; }
.s-workstreams .r:last-child { margin-bottom: 0; }
.s-workstreams .phase { display: flex; align-items: center; gap: .5em;
  padding: .375em .5em; border-radius: .35em; }
.slide .methods { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1em; }
.slide .method { padding: .875em 1em; border-radius: .5em; }
.slide .method .e { font-size: 1.25em; margin-right: .4em; }
.slide .method .t { font-size: 1.25em; }
.slide .method .s { font-size: 1em; margin-top: .375em; }
.slide .s-methods .s-kick { margin: 0; }
.slide .s-method-list { display: grid; gap: .25em; list-style: none;
  padding: 0; margin: .5em 0 0; }
.slide .s-method-list li { display: flex; align-items: start; gap: .5em;
  font-size: 1em; line-height: 1.5; margin: 0; }
.slide .s-method-list b { font-weight: 600; }
.slide p.s-tl-note { max-width: none; margin: .45em 0 0; font-size: .75em; line-height: 1.3; color: var(--muted); }
/* Empty image frame for the review-vote visual, to be replaced when supplied. */
.s-image-placeholder { width: 100%; aspect-ratio: 16 / 10; border: 2px dashed #b8bec4;
  border-radius: .5em; display: flex; align-items: center; justify-content: center;
  color: var(--muted); background: #f7f8f9; }
.s-image-placeholder span { font-size: .9em; }
/* Equation line. The operators are muted so the three phrases read as the
   content and the plus and equals read as structure, not words. */
/* Full width, because an equation that wraps mid-statement stops reading as
   one. */
.slide p.s-eq { max-width: none; }
.s-eq i { font-style: normal; font-weight: 400; color: var(--muted);
  padding: 0 .2em; }

/* Structure diagram. Two stacked layers with a labelled connector: what the
   workflow layer holds, and what the record layer underneath it is. */
.s-diag { margin: 1.3em 0 0; max-width: 100%; }
/* Every p inside the diagram opts out of the slide's paragraph rhythm, which
   would otherwise stack .85em gaps inside the boxes and overflow the stage. */
.s-diag p { margin: 0; max-width: none; font-size: 1em; line-height: 1.3; }
.s-diag .lyr { border: 1px solid var(--rule); border-radius: .55em; padding: .85em 1.1em;
  background: #fff; }
/* Modifier is namespaced because a bare .work is the homepage work-card rule,
   whose flex gap and bottom margin would otherwise pull this box apart. */
.s-diag .lyr.is-work { background: #eef5fb; border-color: #cbdff0; }
/* The record layer holds one line, so it would otherwise read as a thin strip
   under a tall box. Given a floor it reads as a base, without the dead space
   that matching the work layer's height would create. */
.s-diag .lyr:not(.is-work) { min-height: 7.4em; display: flex;
  flex-direction: column; justify-content: center; }
.s-diag .lbl { font-size: .6875em; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; color: var(--muted); margin: 0 0 .5em; }
.s-diag .nm { font-size: 1.125em; font-weight: 700; line-height: 1.15; }
/* Vendor mark sits on the name line. Inline-block rather than flex so the
   name and its qualifier keep normal text wrapping. */
.s-diag .nm img { height: 1.5em; width: auto; vertical-align: -.22em;
  margin-right: .45em; display: inline-block; border: 0; }
.s-diag .nm span { font-weight: 400; color: #4a5056; }
.s-diag .chips { display: flex; flex-wrap: wrap; gap: .35em; margin: .65em 0 0; }
.s-diag .chips i { font-style: normal; font-size: .75em; font-weight: 600;
  padding: .3em .7em; border-radius: .3em; background: #dbe8f4; color: #2d4559;
  line-height: 1.3; }
.s-diag .join { display: flex; align-items: center; gap: .6em; margin: 1em 0 1em 1.25em;
  font-size: .75em; color: var(--muted); }
.s-diag .join::before { content: ""; width: 2px; height: 2.1em; background: #cfd6dc;
  border-radius: 1px; }
/* In a split the diagram sits in a narrower column, so it reads as two cards
   rather than two full-width bars. Deeper padding keeps the record layer from
   collapsing into a sliver. */
.slide-fig .s-diag { margin: 0 auto; max-width: 19em; }
.slide-fig .s-diag .lyr { padding: 1.15em 1.25em; }
.slide.s-split { display: grid; grid-template-columns: 1fr 1fr; gap: 3.5em;
  align-items: center; }
.slide.s-split.wide-right { grid-template-columns: 0.8fr 1.2fr; }
/* Title slide: the product shot carries the slide, so it takes a wider column,
   a tighter gutter and a bleed into the right padding. The text column stays
   wide enough to keep the headline at three lines. */
.slide.s-split.hero-right { grid-template-columns: 0.87fr 1.13fr; gap: 2em; }
.slide.s-split.hero-right .slide-fig { margin-right: -3.25em; }
.slide.s-full { padding: 0; display: block; position: relative; }
.slide.s-full img { width: 100%; height: 100%; object-fit: cover; margin: 0;
  border: none; border-radius: 0; }
/* Caption panel for a full-bleed slide. Sits on an opaque card rather than a
   scrim, so contrast is guaranteed regardless of what is behind it. */
.s-over { position: absolute; left: 3.5em; bottom: 3.5em; max-width: 30em;
  background: #fff; border-radius: .6em; padding: 1.6em 1.8em;
  box-shadow: 0 .5em 2em rgba(15,20,25,.18); }
.s-over .s-kick { margin: 0 0 .6em; }
.s-over h3 { margin: 0; }
.s-over p { margin: .6em 0 0; max-width: none; }
.slide-body { min-width: 0; display: flex; flex-direction: column; gap: 1em;
  align-self: start; padding-top: 3.5em; }
.slide.s-split:not(.hero-right) { padding-top: 8em; align-items: start; }
.slide.s-split:not(.hero-right) .slide-body { padding-top: 0; }
/* Match the headline after the kicker's line box and the shared text gap. */
.slide.s-split:not(.hero-right) .slide-fig { align-self: start;
  margin-top: calc(.8125em * 1.4 + 1em); }
/* Anchor every text group at y=128 on the 1280x720 stage, independent of its length.
   A shared flex gap also avoids different margin-collapsing behavior in split slides. */
.slide.s-title > *, .slide.s-split .slide-body > * { margin-top: 0; margin-bottom: 0; }
.slide.s-split .slide-body > * { max-width: 100%; }
.slide-fig { min-width: 0; }
.slide-fig img { width: 100%; display: block; margin: 0; border: 1px solid var(--rule);
  border-radius: .5em; }
.slide-fig > img, .slide-fig.stack img, .slide.s-full > img { cursor: zoom-in; }
.slide-fig.plain img { border: 0; }
.slide.s-split:not(.hero-right) .slide-fig > img { width: auto; height: auto;
  max-height: var(--deck-media-height); align-self: start; margin: 0 auto; }
/* Two screenshots stacked in one figure column, for before/after or two
   views of the same legacy tool. */
.slide-fig.stack { display: flex; flex-direction: column; gap: .85em; }
.slide-fig.stack > figure { width: fit-content; max-width: 100%; margin: 0; }
.slide.s-split:not(.hero-right) .slide-fig.stack img { width: auto; height: auto;
  max-width: 100%;
  max-height: calc((var(--deck-media-height) - .85em) / 2); }
.slide-fig .s-cap { font-size: .875em; color: var(--muted); margin: .75em 0 0; }
.slide-fig .diag { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
  gap: 1em; }
.slide-fig .diag .eq, .slide-fig .diag .says p { font-size: 1em;
  line-height: 1.45; margin: 0; white-space: normal; }
.slide-fig .diag .eq { color: var(--fg); letter-spacing: 0; }
.slide-fig .diag .eq + .eq, .slide-fig .diag .says p + p { margin-top: .75em; }
.slide-fig .diag .eq .ic { font-size: 1em; margin-right: .4em; }
.workshop-carousel .car-slide img { aspect-ratio: 3 / 1; object-fit: contain;
  background: #fff; }
.deck-carousel .carousel-frame { width: fit-content; max-width: 100%; margin: 0 auto; }
/* Caption length must not widen the frame beyond its fitted screenshot. */
.deck-carousel .carousel-frame .car-cap { contain: inline-size; }
.slide .deck-carousel { margin: 0; }
.deck-carousel .car-slide img { width: auto; height: auto; max-width: 100%;
  max-height: var(--deck-media-height); object-fit: contain; margin: 0 auto; }
.slide .deck-carousel .car-cap { font-size: .875em; line-height: 1.45;
  margin: .75em 0 0; max-width: none; }
.deck-carousel .car-ctrl { gap: .9em; margin-top: .75em; }
.deck-carousel .car-btn { width: 2em; height: 2em; font-size: 1em;
  border-color: #b8bec4; }
.deck-carousel .car-dots { gap: .5em; }
.deck-carousel .car-dot { width: .45em; height: .45em; }

/* Stat blocks, for the outcome slides. */
.s-stats { display: flex; gap: 3em; margin: 1.75em 0 0; padding: 0; list-style: none; }
.s-stats li { margin: 0; }
.s-stats .n { display: block; font-size: 2.75em; font-weight: 800; line-height: 1;
  letter-spacing: -.02em; }
.s-stats .l { display: block; font-size: .875em; color: var(--muted); margin: .5em 0 0;
  max-width: 11em; line-height: 1.45; }

.slide ul.s-list { margin: 1.25em 0 0; padding: 0; list-style: none; }
.slide ul.s-list li { font-size: 1.125em; line-height: 1.5; margin: 0 0 .8em;
  padding-left: 1.4em; position: relative; }
.slide ul.s-list li::before { content: ""; position: absolute; left: 0; top: .6em;
  width: .45em; height: .45em; border-radius: 50%; background: var(--link); }
.slide ul.s-list li b { font-weight: 700; }
.slide ul.s-list li:last-child { margin-bottom: 0; }
.slide ul.s-usecase-list { margin: 1.25em 0 0; padding: 0; list-style: none; }
.slide .s-usecase-list li { display: flex; align-items: flex-start; gap: .7em;
  margin: 0 0 .65em; font-size: 1.125em; line-height: 1.5; }
.s-usecase-list .sq { flex: none; width: .62em; height: .62em; margin-top: .42em;
  border-radius: 50%; }
.s-usecase-list .info { background: #e3b341; }
.s-usecase-list .action { background: #d94b4b; }
.s-usecase-list .promo { background: #32865a; }

/* Deck chrome: slide number and progress. Deliberately quiet. */
/* Chrome sits on top of white slides, so it is dark rather than light. */
.deck-ui { position: fixed; left: 0; right: 0; bottom: 0; height: 3px;
  background: rgba(15,20,25,.10); z-index: 5; }
.deck-ui i { display: block; height: 100%; background: var(--link); width: 0;
  transition: width .2s ease; }
.deck-no { position: fixed; right: 1.4rem; bottom: 1.3rem; z-index: 6;
  font-size: 12px; font-weight: 600; letter-spacing: .08em; color: #9aa3ab; }
body:has(.deck) .deck-no, body:has(.deck) .deck-ui { display: block; }
.tde-footer { position: absolute; left: 1.75em; right: 1.75em; bottom: 1.15em;
  display: flex; align-items: center; justify-content: flex-start; gap: .65em; z-index: 4;
  color: #0a3158; }
.tde-footer-logo { display: block; width: 1.5em; height: 1.5em; flex: none; }
.tde-footer-right { display: flex; align-items: center; }
.tde-footer-note { font-size: .65em; line-height: 1.2; font-weight: 600; }

/* PDF export. One slide per landscape page, every slide visible, no chrome.
   Chrome's print-to-PDF at 1280x720 produces a deck that matches the screen. */
@page { size: 1280px 720px; margin: 0; }
@media print {
  body:has(.deck) { overflow: visible; background: #fff; }
  .deck { position: static; display: block; background: #fff; }
  .slide { position: static; opacity: 1; visibility: visible; transition: none;
    width: 1280px; height: 720px; font-size: 16px; page-break-after: always;
    break-after: page; }
  .slide:last-child { page-break-after: auto; break-after: auto; }
  .deck-ui, .deck-no, .crumbs, .sitehead-wrap, .foot { display: none !important; }
  .tde-footer { right: 2em; }
  /* The shell's own padding would otherwise add a trailing blank page. */
  .shell:has(.deck) { padding: 0 !important; margin: 0 !important; }
  html, body { margin: 0 !important; padding: 0 !important; }
}

/* ---------- 3D work gallery ---------- */
.shell:has(.gal) { max-width: 1120px; }
.gal { display: grid; grid-template-columns: repeat(2, 1fr); gap: 38px 30px; margin: 0 0 64px; }
.gitem { display: block; margin: 0; text-decoration: none; color: inherit; }
.gitem img { display: block; width: 100%; margin: 0; border-radius: 10px; background: #f1f3f5; transition: transform .4s ease, box-shadow .2s ease; }
.gitem:hover img { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(0,0,0,.13); }
.gcap { margin: 13px 2px 0; }
.gcap b { display: block; font-size: 16px; letter-spacing: -.1px; }
.gitem:hover .gcap b { text-decoration: underline; }
.gcap span { display: block; font-size: 13px; color: var(--muted); margin-top: 3px; }
.gcap em { display: block; font-size: 14px; line-height: 1.55; color: #4a4a4a; margin-top: 7px; font-style: normal; }
@media (max-width: 880px) { .gal { grid-template-columns: 1fr; gap: 30px; } }/* ---------- 3D piece detail pages ---------- */
.shell:has(.pgal), .shell:has(.phero) { max-width: 1120px; }
.piece-meta { font-size: 13.5px; color: var(--muted); margin: -4px 0 20px; }
.piece-skills { font-size: 13.5px; line-height: 1.6; color: #5a5a5a; margin: 0 0 26px; padding: 14px 18px; background: #f8f9fa; border-radius: 10px; }
.phero { display: block; width: 100%; margin: 0 0 14px; border-radius: 12px; background: #f1f3f5; cursor: zoom-in; }

.pgal img { display: block; width: 100%; margin: 0; border-radius: 10px; background: #f1f3f5; cursor: zoom-in; }
@media (max-width: 880px) { .pgal { grid-template-columns: 1fr; } }

<script>
const sources = {"v1": "<div class=\"title-card\">\n  <h1 class=\"with-mark\"><img src=\"images/linkedin-mark.png?v=1cb36f74\" alt=\"LinkedIn\">Recruit Portal AI</h1>\n  <p class=\"lede\">Enhancing enterprise interview scheduling with AI and automation.</p>\n</div>\n\n<div class=\"hero\">\n  <img src=\"images/rp2-hero.png?v=4169377d\" data-zoom=\"images/rp2-hero.png?v=4169377d\" alt=\"Recruit Portal AI on a laptop with its AI surfaces open at once: an activity panel on the left logging an auto-replaced interviewer, a detected schedule conflict and an optimised interview sequence; a panel on the right offering one-click actions on an unavailable interviewer, a closer room and an RSVP reminder; and an AI Assistant field at the bottom inviting a free-form scheduling request\">\n</div>\n\n<div class=\"factbar\">\n  <div class=\"fact\"><span class=\"k\">Role</span><span class=\"v\">UX/Product Design (sole)</span></div>\n  <div class=\"fact\"><span class=\"k\">Timeline</span><span class=\"v\">Sep \u2013 Dec 2025 \u00b7 4 months</span></div>\n  <div class=\"fact\"><span class=\"k\">Outcome</span><span class=\"v\"><span class=\"tip\" tabindex=\"0\"><span class=\"tip-t\">Prototype, parked</span><i class=\"tip-i\">i</i><span class=\"tip-b\"><b>Did not ship.</b> Org priorities shifted from \u201cspeed up time-to-hire\u201d to \u201cget better candidates.\u201d The POC, the design language, and the prototype are ready to be picked up when priorities align.</span></span></span></div>\n</div>\n\n## Overview\n\nI was the **sole designer on Recruit Portal AI**, the AI chapter of LinkedIn\u2019s internal ATS for Engineering hiring. I turned a seven-interview onsite from a day of manual coordination into a loop that largely runs itself. First I wrote a **two-tier design language for AI agency**: what the system does alone, what it waits to be asked. The flow gathers availability, builds the schedule from qualified pools, and **fixes itself when someone declines or goes quiet**: five interviewers replaced in one run, no Scheduler involved. A **conversational agent** takes the rest in plain language, \u201csplit this across two days\u201d, with a **human approval gate** before anything moves. Co-designed in a week-long intensive, prototyped in **Figma Make**, parked as a complete POC when priorities shifted.\n\n## The Context\n\nAfter I successfully designed and launched LinkedIn\u2019s applicant tracking system for Engineering hiring, leadership returned to the product a year later with a challenge:\n\n> How might we make scheduling interviews at LinkedIn faster, easier, and with an overall better user experience?\n\n## The Problem\n\nThe current scheduling flow in Recruit Portal is time-consuming, requires manual actions, and lacks automation, making it inefficient.\n\n### \ud83d\udc77 The life of a Scheduler: <span class=\"sub\">the person who builds every interview</span>\n\n<ul class=\"takeaways\">\n  <li><b>Find interviewers</b> who are qualified and actually free.</li>\n  <li><b>Watch for declines.</b> <em>Checked by hand.</em></li>\n  <li><b>Replace whoever drops</b> before the day unravels.</li>\n  <li><b>Chase non-responders.</b> <em>Followed up manually.</em></li>\n  <li><b>Pick rooms</b> that don't send a candidate walking between buildings.</li>\n  <li><b>Shape the day</b>: padding between sessions, or splitting across days.</li>\n</ul>\n\n<p class=\"punch sm\">None of it is automated: a modern product running a manual process.</p>\n\n## The Opportunity\n\n<div class=\"decision\">\n  <p><b>Let's enhance Recruit Portal with automation and AI-driven features</b> that make the Scheduler's job easier and increase time-to-schedule.</p>\n</div>\n\n<p class=\"mlabel\">The goals</p>\n\n<ul class=\"takeaways\">\n  <li><b>Reduce time-to-hire</b>, specifically the scheduling portion.</li>\n  <li><b>Automate the manual loops</b>: auto-replace unavailable interviewers; let candidates provide availability directly without Scheduler intervention.</li>\n  <li><b>Introduce an agent</b> that can coordinate interview schedules.</li>\n</ul>\n\n## Design Principles\n\nThis was the first time we were bringing AI into the product, so before designing any features I put together a set of principles: a shared framework the team and I could use to decide how AI should behave, grounded in UX best practice.\n\n<div class=\"findings even\">\n\n  <div class=\"fgroup\">\n    <p class=\"h\">01 \u00b7 Respect Human Nuance</p>\n    <p class=\"t\">Users can override, adjust or fine-tune anything the AI produces.</p>\n  </div>\n\n  <div class=\"fgroup\">\n    <p class=\"h\">02 \u00b7 Design for Dual Modes of Interaction</p>\n    <p class=\"t\">One-click for quick fixes, conversation for the rest.</p>\n  </div>\n\n  <div class=\"fgroup\">\n    <p class=\"h\">03 \u00b7 Build Trust Through Transparency</p>\n    <p class=\"t\">Show what the AI did and why, with undo and an audit trail.</p>\n  </div>\n\n</div>\n\n## Where the flow breaks\n\nEvery step needs manual input, every step waits on someone, and any decline starts it over.\n\n<div class=\"carousel\">\n<div class=\"car-track\">\n\n<div class=\"car-slide\">\n<img data-zoom=\"images/rp2-flow-01-details.png?v=9166df3c\" src=\"images/rp2-flow-01-details.png?v=9166df3c\" alt=\"The interview details screen: a candidate availability section with three hand-entered date and time rows, an optional recommended interview team with search criteria and duration per slot, and additional fields for cost centre, meeting type and urgency\">\n<p class=\"car-cap\"><b>01 \u00b7 Gather interview details</b></p>\n<div class=\"car-prob\">\n<b>\u26a0\ufe0f Pain points</b>\n<ul>\n<li>Email the candidate for availability.</li>\n<li>Rarely works first time: too few slots, or it clashes with holidays or company outings. Ask again.</li>\n<li>Enter the availability by hand.</li>\n</ul>\n</div>\n</div>\n\n<div class=\"car-slide\">\n<img data-zoom=\"images/rp2-flow-02-draft.png?v=586b98a6\" src=\"images/rp2-flow-02-draft.png?v=586b98a6\" alt=\"A Scheduler screen in Pending Scheduling: a single interview criteria with its time and type set, and the interviewer, RSVP status, meeting room and room status columns all still empty\">\n<p class=\"car-cap\"><b>02 \u00b7 Draft the schedule</b></p>\n<div class=\"car-prob\">\n<b>\u26a0\ufe0f Pain points</b>\n<ul>\n<li>Every criteria, up to 8, needs a day, a time, a code editor flag, an interviewer and a room.</li>\n<li>Criteria order, dates, times, interviewers: so many variables it could go any direction.</li>\n<li>It's a blank template. No defaults, no suggestions, no starting point.</li>\n<li>The system doesn't help at all.</li>\n</ul>\n</div>\n</div>\n\n<div class=\"car-slide\">\n<img data-zoom=\"images/rp2-flow-03-invites.png?v=b90aecc1\" src=\"images/rp2-flow-03-invites.png?v=b90aecc1\" alt=\"The send-interviewers-emails screen: a subject line, a rich-text editor holding the invite template, and placeholder text where the Scheduler must paste the meeting link and the interview details before sending\">\n<p class=\"car-cap\"><b>03 \u00b7 Send invites</b></p>\n<div class=\"car-prob\">\n<b>\u26a0\ufe0f Pain points</b>\n<ul>\n<li>Invitation templates managed across multiple products.</li>\n<li>Interviewers take a long time to RSVP: longer for all of them to confirm.</li>\n<li>The candidate can't be invited until every interviewer confirms.</li>\n<li>Finding an available interviewer is hard: stale calendars, out of office, and plenty who ignore it.</li>\n</ul>\n</div>\n</div>\n\n<div class=\"car-slide\">\n<img data-zoom=\"images/rp2-flow-04-rsvps.png?v=8d48d17b\" src=\"images/rp2-flow-04-rsvps.png?v=8d48d17b\" alt=\"An onsite loop in Upcoming Tentative: five interview criteria, each with its assigned interviewer, meeting room and invitation status, one interviewer showing a red decline and another still pending\">\n<p class=\"car-cap\"><b>04 \u00b7 Monitor RSVPs until everyone confirms</b></p>\n<div class=\"car-prob\">\n<b>\u26a0\ufe0f Pain points</b>\n<ul>\n<li>Monitoring RSVPs is manual: check your email, or refresh the page.</li>\n<li>A single decline can shift the entire schedule.</li>\n<li>So replacing someone isn't a swap. It's a re-solve.</li>\n<li>Reminders are sent by hand when there is no response.</li>\n</ul>\n</div>\n</div>\n\n</div>\n<div class=\"car-ctrl\">\n<button class=\"car-btn car-prev\" aria-label=\"Previous\">&lsaquo;</button>\n<div class=\"car-dots\"></div>\n<button class=\"car-btn car-next\" aria-label=\"Next\">&rsaquo;</button>\n</div>\n</div>\n\n## \ud83e\udd1d My collaboration approach\n\nBefore designing, I redesigned how I'd work with stakeholders. They were there to co-design during a week-long intensive with two senior partners:\n\n<div class=\"roles\">\n  <span class=\"role\"><span class=\"e\">\ud83e\uddd1\u200d\ud83d\udcbc</span> Sr. Program Manager, Recruiting: the strategic voice</span>\n  <span class=\"role\"><span class=\"e\">\ud83e\uddd1\u200d\ud83d\udd27</span> Manager of Recruiting Coordination, Engineering: the operations voice</span>\n</div>\n\n<p class=\"mlabel\">The format</p>\n\n<div class=\"carousel\">\n<div class=\"car-track\">\n\n<div class=\"car-slide\">\n<table>\n<thead><tr><th>#</th><th>Day</th><th>Focus</th></tr></thead>\n<tbody>\n<tr><td>1</td><td>Mon</td><td>Availability logic</td></tr>\n<tr><td>2</td><td>Tue</td><td>Brainstorm enhanced scheduling; draft logic; modular approach</td></tr>\n<tr><td>3</td><td>Wed</td><td>Pain-points review; draft schedule refinements; auto-allocate logic; candidate self-schedule</td></tr>\n<tr><td>4</td><td>Thu</td><td>Full flow with automation; reschedule logic: criteria vs. day</td></tr>\n<tr><td>5</td><td>Fri</td><td>Final iteration and polish review</td></tr>\n</tbody>\n</table>\n<p class=\"car-cap\"><b>01 \u00b7 The five-day agenda</b></p>\n</div>\n\n<div class=\"car-slide\">\n<img data-zoom=\"images/rp2-worksession-board.png?v=27488179\" src=\"images/rp2-worksession-board.png?v=27488179\" alt=\"The working-session board: seven colour-coded columns from Get Availability through Receive Availability, Allocate, Draft Schedule, Send communications, Upcoming Tentative and Upcoming Confirmed, each holding screen designs above a cluster of logic notes\">\n<p class=\"car-cap\"><b>02 \u00b7 What the week produced</b></p>\n</div>\n\n</div>\n<div class=\"car-ctrl\">\n<button class=\"car-btn car-prev\" aria-label=\"Previous\">&lsaquo;</button>\n<div class=\"car-dots\"></div>\n<button class=\"car-btn car-next\" aria-label=\"Next\">&rsaquo;</button>\n</div>\n</div>\n\n<p class=\"mlabel\">UX decision</p>\n\n<div class=\"decision\">\n  <p><b>The format was itself a design choice.</b> Short sessions, escalating daily.</p>\n</div>\n\n<p class=\"mlabel\">UX results</p>\n\n<ul class=\"takeaways\">\n  <li><b>A Strategy Sync locked the feature set</b>: availability, scheduling, communication.</li>\n  <li><b>The people who run the flow helped build it</b>, for their own team.</li>\n  <li><b>I never had to win buy-in at the end.</b> They shaped the solution.</li>\n</ul>\n\n## \ud83e\udd16 The two-tier AI framework\n\nNot a set of AI features: a design language for AI in an enterprise tool, where the kind of intervention is keyed to the level of user agency it requires.\n\n<div class=\"findings\">\n\n  <div class=\"fgroup\">\n    <p class=\"h\">\ud83e\udeb5 AI Activity</p>\n    <ul>\n      <li>The system acts automatically, without being asked.</li>\n      <li>The user is informed afterward, via an audit log blended with their own actions.</li>\n    </ul>\n  </div>\n\n  <div class=\"fgroup\">\n    <p class=\"h\">\ud83e\udde0 AI Assistant</p>\n    <ul>\n      <li>The user makes complex requests in natural language.</li>\n      <li>The system proposes the change and waits for approval before anything moves.</li>\n    </ul>\n  </div>\n\n</div>\n\n<p class=\"mlabel\">UX decision</p>\n\n<div class=\"decision\">\n  <p><b>The same AI, two levels of freedom:</b> it either acts on its own, or it waits to be asked.</p>\n</div>\n\n## \ud83c\udf73 A recipe for the system\n\nA recipe metaphor, so a multi-step orchestration system could be discussed in a room.\n\n<div class=\"flow icons\">\n  <div class=\"step\"><span class=\"n\">\ud83e\uddd1\u200d\ud83c\udf73</span><span class=\"t\">Gather the ingredients</span></div>\n  <div class=\"step\"><span class=\"n\">\ud83c\udf73</span><span class=\"t\">Cook</span><span class=\"sub\">build the interview</span></div>\n  <div class=\"step\"><span class=\"n\">\ud83e\udd58</span><span class=\"t\">Watch it simmer</span><span class=\"sub\">monitor RSVPs</span></div>\n  <div class=\"step\"><span class=\"n\">\ud83e\udd16</span><span class=\"t\">Hand it to the agent</span></div>\n  <div class=\"step\"><span class=\"n\">\ud83c\udf5c</span><span class=\"t\">Serve</span><span class=\"sub\">everyone confirms</span></div>\n</div>\n</div>\n\n<p class=\"mlabel\">UX decision</p>\n\n<div class=\"decision\">\n  <p><b>The people reviewing it were the people building it.</b> They needed shared words for it.</p>\n</div>\n\n## \ud83c\udfa8 What I designed\n\n### \ud83e\uddd1\u200d\ud83c\udf73 Gather the ingredients\n\n<div class=\"carousel\">\n<div class=\"car-track\">\n\n<div class=\"car-slide\">\n<img data-zoom=\"images/rp2-des-01-constraints.png?v=3912997e\" src=\"images/rp2-des-01-constraints.png?v=3912997e\" alt=\"The candidate availability panel: timezone, meeting type, travel and priority controls, a requirement of two full days, and three blackout entries including a week-long recruiting offsite, with a note that blackout days are managed by the Talent Acquisition admin. Below it, seven interview criteria each draw from a named interviewer pool\">\n<p class=\"car-cap\"><b>01 \u00b7 Set the constraints, then ask once</b></p>\n<div class=\"car-win\">\n<b>\u2705 Win</b>\n<ul>\n<li>The candidate gets a form to enter their own times, instead of the Scheduler emailing back and forth.</li>\n<li>Holiday and company-day blackouts are set up front, so what comes back is valid the first time.</li>\n</ul>\n</div>\n</div>\n\n<div class=\"car-slide\">\n<img data-zoom=\"images/rp2-des-02-waiting.png?v=f0c7fc8e\" src=\"images/rp2-des-02-waiting.png?v=f0c7fc8e\" alt=\"The same panel in a waiting state: a clock icon above the message that the availability form has been sent and the Scheduler will be notified when the candidate submits their availability, with the interview structure still listed below\">\n<p class=\"car-cap\"><b>02 \u00b7 The system holds the wait</b></p>\n<div class=\"car-win\">\n<b>\u2705 Win</b>\n<ul>\n<li>The system owns the wait and notifies the Scheduler, instead of them remembering to check back.</li>\n</ul>\n</div>\n</div>\n\n<div class=\"car-slide\">\n<img data-zoom=\"images/rp2-des-03-returned.png?v=8fee7791\" src=\"images/rp2-des-03-returned.png?v=8fee7791\" alt=\"The panel after the candidate responds: three dates with their time ranges and hour totals, a Resend Availability button, and an interview structure where two criteria now name a preferred interviewer or a preferred group while the rest still draw from the pool\">\n<p class=\"car-cap\"><b>03 \u00b7 It comes back filled in</b></p>\n<div class=\"car-win\">\n<b>\u2705 Win</b>\n<ul>\n<li>The candidate\u2019s reply populates the schedule directly: no re-typing, no transcription errors.</li>\n<li>Interviewers stay flexible: keep the pool, name one person, or name a preferred group.</li>\n</ul>\n</div>\n</div>\n\n</div>\n<div class=\"car-ctrl\">\n<button class=\"car-btn car-prev\" aria-label=\"Previous\">&lsaquo;</button>\n<div class=\"car-dots\"></div>\n<button class=\"car-btn car-next\" aria-label=\"Next\">&rsaquo;</button>\n</div>\n</div>\n\n### \ud83c\udf73 Cook: build the interview\n\n<div class=\"carousel\">\n<div class=\"car-track\">\n\n<div class=\"car-slide\">\n<img data-zoom=\"images/rp2-des-04-generated.png?v=870a1be0\" src=\"images/rp2-des-04-generated.png?v=870a1be0\" alt=\"A generated schedule for Monday 13 October: seven interview criteria laid out hour by hour from 9am to 4pm, each with a code-editor flag and two interviewers drawn from the pool, plus an auto-generated meeting link\">\n<p class=\"car-cap\"><b>01 \u00b7 The whole day, drafted</b></p>\n<div class=\"car-win\">\n<b>\u2705 Win</b>\n<ul>\n<li>The system drafts the day: times, criteria order, code editor and two interviewers per slot.</li>\n<li>The meeting link is generated with it, so there is nothing to paste in by hand.</li>\n</ul>\n</div>\n</div>\n\n<div class=\"car-slide\">\n<img data-zoom=\"images/rp2-des-05-ask-split.png?v=ec2e72aa\" src=\"images/rp2-des-05-ask-split.png?v=ec2e72aa\" alt=\"The same schedule with the Schedulo AI assistant open: the Scheduler has typed a request to split the schedule across two days, and the assistant has replied with a proposed split of four interviews on day one and three on day two, asking whether to apply it\">\n<p class=\"car-cap\"><b>02 \u00b7 Ask for a change in plain English</b></p>\n<div class=\"car-win\">\n<b>\u2705 Win</b>\n<ul>\n<li>\u201cCan you split the schedule across 2 days\u201d: no rebuilding the loop by hand.</li>\n<li>The assistant proposes the split and waits for a yes before changing anything.</li>\n</ul>\n</div>\n</div>\n\n<div class=\"car-slide\">\n<div class=\"car-scroll\"><img data-zoom=\"images/rp2-des-07-two-days.png?v=e2d6097f\" src=\"images/rp2-des-07-two-days.png?v=e2d6097f\" alt=\"The split result: two generated schedule cards stacked, Monday 13 October with four interview criteria over four hours and Tuesday 14 October with the remaining three, each row carrying its code-editor flag and two interviewers from the pool\"></div>\n<p class=\"car-cap\"><b>03 \u00b7 Two days, same logic</b>: try scrolling inside the frame</p>\n<div class=\"car-win\">\n<b>\u2705 Win</b>\n<ul>\n<li>Monday drops to four interviews and Tuesday picks up the rest: the whole loop moves together.</li>\n<li>Day two uses the same logic: times, interviewers and code editor flags all carried across.</li>\n</ul>\n</div>\n</div>\n\n</div>\n<div class=\"car-ctrl\">\n<button class=\"car-btn car-prev\" aria-label=\"Previous\">&lsaquo;</button>\n<div class=\"car-dots\"></div>\n<button class=\"car-btn car-next\" aria-label=\"Next\">&rsaquo;</button>\n</div>\n</div>\n\n### \ud83e\udd58 Watch it simmer: monitor RSVPs\n\n<div class=\"carousel\">\n<div class=\"car-track\">\n\n<div class=\"car-slide\">\n<img data-zoom=\"images/rp2-des-08-invites-sent.png?v=485156b2\" src=\"images/rp2-des-08-invites-sent.png?v=485156b2\" alt=\"The onsite interview in Upcoming Tentative: seven criteria with two interviewers each, every invitation marked Sent and every interviewer showing a pending clock icon, with a status line reading Monitoring interview RSVPs\">\n<p class=\"car-cap\"><b>01 \u00b7 Invites out, clock running</b></p>\n<div class=\"car-win\">\n<b>\u2705 Win</b>\n<ul>\n<li>Every invite goes out together and the system starts watching for replies.</li>\n</ul>\n</div>\n</div>\n\n<div class=\"car-slide\">\n<img data-zoom=\"images/rp2-des-09-replies-in.png?v=53ca6991\" src=\"images/rp2-des-09-replies-in.png?v=53ca6991\" alt=\"The same loop as replies arrive: some interviewers now show a green tick for accepted, three show a red cross for declined, and the rest still show a pending clock\">\n<p class=\"car-cap\"><b>02 \u00b7 The AI watches the replies</b></p>\n<div class=\"car-win\">\n<b>\u2705 Win</b>\n<ul>\n<li>Accepted, declined and still-waiting sit one glance apart: green tick, red cross, clock.</li>\n</ul>\n</div>\n</div>\n\n<div class=\"car-slide\">\n<img data-zoom=\"images/rp2-des-10-all-confirmed.png?v=a3ae2a74\" src=\"images/rp2-des-10-all-confirmed.png?v=a3ae2a74\" alt=\"The same loop fully resolved: every interviewer now shows a green tick, with five of the original names replaced by new interviewers drawn from the same pools\">\n<p class=\"car-cap\"><b>03 \u00b7 It resolves itself</b></p>\n<div class=\"car-win\">\n<b>\u2705 Win</b>\n<ul>\n<li>Declines are replaced at once. Non-responders get a reminder, then a replacement at 24 hours.</li>\n<li>Five interviewers changed here: none of it needed the Scheduler.</li>\n</ul>\n</div>\n</div>\n\n</div>\n<div class=\"car-ctrl\">\n<button class=\"car-btn car-prev\" aria-label=\"Previous\">&lsaquo;</button>\n<div class=\"car-dots\"></div>\n<button class=\"car-btn car-next\" aria-label=\"Next\">&rsaquo;</button>\n</div>\n</div>\n\n### \ud83e\udd16 Hand it to the agent\n\n<div class=\"carousel\">\n<div class=\"car-track\">\n\n<div class=\"car-slide\">\n<img data-zoom=\"images/rp2-des-11-ask-reschedule.png?v=3ceeae48\" src=\"images/rp2-des-11-ask-reschedule.png?v=3ceeae48\" alt=\"The confirmed onsite loop with the Schedulo assistant open: the Scheduler has typed \u201ccan you reschedule?\u201d and the agent replies that it will check interviewer availability and can suggest times at the end of this week or early next\">\n<p class=\"car-cap\"><b>01 \u00b7 Ask in plain language</b></p>\n<div class=\"car-win\">\n<b>\u2705 Win</b>\n<ul>\n<li>A free-form request replaces unpicking a confirmed loop by hand.</li>\n<li>Requests go further: a new day for the loop, one criteria moved, or the same team minus one.</li>\n<li>Free-form refinements: \u201crebuild across 2 days,\u201d \u201crebuild early next week,\u201d \u201crebuild with 10 minutes of padding.\u201d</li>\n</ul>\n</div>\n</div>\n\n<div class=\"car-slide\">\n<img data-zoom=\"images/rp2-des-12-proposal.png?v=7d16235b\" src=\"images/rp2-des-12-proposal.png?v=7d16235b\" alt=\"The assistant\u2019s reply: it reports that some interviewers were available and others will be replaced, lists a proposed schedule of five slots with times, criteria, interviewer and room, and offers Approve or Try different times\">\n<p class=\"car-cap\"><b>02 \u00b7 It proposes, you approve</b></p>\n<div class=\"car-win\">\n<b>\u2705 Win</b>\n<ul>\n<li>The agent keeps the interviewers it can, replaces the ones it cannot, and says which is which.</li>\n<li>Nothing moves until Approve: the highest-stakes action still waits for a person.</li>\n</ul>\n</div>\n</div>\n\n</div>\n<div class=\"car-ctrl\">\n<button class=\"car-btn car-prev\" aria-label=\"Previous\">&lsaquo;</button>\n<div class=\"car-dots\"></div>\n<button class=\"car-btn car-next\" aria-label=\"Next\">&rsaquo;</button>\n</div>\n</div>\n\n### \u2728 Communication enhancements\n\n<p class=\"sidenote\">Outside the recipe, but it came straight out of the pain points: invites were written and pasted by hand, every time.</p>\n\n<div class=\"shot\">\n<div class=\"car-scroll\"><img data-zoom=\"images/rp2-des-13-template.png?v=b23fd1bd\" src=\"images/rp2-des-13-template.png?v=b23fd1bd\" alt=\"The Send Invites screen: a stored communication template is selected, a notice that fourteen separate emails will be sent one to each interviewer, and a subject and body already populated with variables for interviewer name, meeting link, candidate details, resume, times and criteria\"></div>\n<p class=\"car-cap\"><b>The invite writes itself</b></p>\n<div class=\"car-win\">\n<b>\u2705 Win</b>\n<ul>\n<li>Every field is auto-populated, so Schedulers aren\u2019t retyping or re-checking the same details.</li>\n<li>Templates are stored in the system, picked from a list, and reused instead of rebuilt.</li>\n</ul>\n</div>\n</div>\n\n## What happened\n\n<p class=\"punch sm\">It didn\u2019t ship.</p>\n\nOrg priorities shifted from <i class=\"qt\">speed up time-to-hire</i> to <i class=\"qt\">get better candidates</i>, and the work became a POC the PM kept in his back pocket. The design language, the prototype, and the working sessions are there, ready to be picked up when priorities align again.\n\n<p class=\"mlabel\">North star metric</p>\n\n<div class=\"decision\">\n  <p><b>80\u201395% of generated schedules require no revisions.</b> A design target the team set, not an achieved outcome: the feature never reached production, so it was never measured.</p>\n</div>\n\n## What I learned\n\n<ul class=\"takeaways\">\n  <li><b>I rebuilt my process around the new tools.</b> Figma Make meant a working system in days, so my time went into what it should do, not how to draw it.</li>\n  <li><b>Lean on the experts who live in the work.</b> Strategy from a Sr. Program Manager, daily reality from a Manager of Recruiting Coordination: both in the room all week.</li>\n  <li><b>With AI, the design question isn\u2019t capability: it\u2019s agency.</b> Almost anything here could be automated. Deciding how much each feature does alone was the work.</li>\n  <li><b>Not every AI feature should be a chat box.</b> Conversation suits complex one-off requests. The routine work should just happen, and tell you afterwards.</li>\n  <li><b>Design what happens when it goes wrong.</b> Declines, silence, a whole day that has to move. If the system can\u2019t handle those alone, nobody will leave it running.</li>\n</ul>\n"};

function show(v) {
